<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23f28b7a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap">
<style>
  /* The poster: just what to do, as large as the screen allows, to read from across the kitchen. You talk to change
     it; Basil says the details. Each cook's step is a poster in the colour of the food it's about (salmon pink,
     chocolate brown, broccoli green), the words in whichever of black or white reads best on it. Every poster has
     the same three places: who, top left; time, top right; the step, on the bottom edge. One strip beneath holds
     Basil's voice and any timers not already on a poster. */
  :root {
    --paper: #eef3e8; --ink: #1a1a1a; --soft: color-mix(in srgb, var(--ink) 55%, transparent);
    --sans: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --pad: clamp(24px, 3vw, 52px);
    /* For core.js's drawers. */
    --bg: var(--paper); --top: #f8faf5; --line: color-mix(in srgb, var(--ink) 14%, transparent); --line-2: color-mix(in srgb, var(--ink) 30%, transparent);
    --muted: var(--soft); --display: var(--sans); --mono: var(--sans); --flame: #7a5cff; --hot: #ff7a45; --alarm: #ff4a2e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #161616; --ink: #eef3e8; --top: #222; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #161616; --ink: #eef3e8; --top: #222; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; display: flex; flex-direction: column; user-select: none;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  [hidden] { display: none !important; }

  /* ---------- posters ---------- */
  #posters { flex: 1; min-height: 0; display: flex; }
  .poster { position: relative; flex: 1 1 0; min-width: 0; display: grid; grid-template-rows: auto 1fr auto; padding: var(--pad);
    background: var(--field, var(--paper)) center / cover no-repeat; color: var(--fg, var(--ink)); transition: background-color .6s ease, flex-grow .6s ease; overflow: hidden; }
  .poster.main { flex-grow: 1.6; }
  .poster.photo { --fg: #fff; background-image: linear-gradient(rgb(0 0 0 / .5), rgb(0 0 0 / .2) 45%, rgb(0 0 0 / .7)), var(--photo); }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 1em; font: 700 var(--small, 32px)/1 var(--sans); letter-spacing: -.01em; }
  .top .time { font-variant-numeric: tabular-nums; }
  .t { grid-row: 3; margin: 0 0 -.08em -.05em; font: 700 120px/.95 var(--sans); letter-spacing: -.025em; text-wrap: balance; }
  .poster.enter .t { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  /* Time's up: the poster flashes between its colour and black. */
  .poster.alarm { animation: flash 1s steps(1) infinite; }
  @keyframes flash { 50% { background-color: #1a1a1a; color: #fff; } }
  .hello .t.working { opacity: .5; animation: dim 1.8s ease-in-out infinite; }
  @keyframes dim { 50% { opacity: .25; } }

  /* ---------- the strip: Basil, then the other timers ---------- */
  footer { flex: none; display: flex; align-items: center; gap: clamp(16px, 2.4vw, 40px); min-height: clamp(64px, 9vh, 100px);
    padding: 10px var(--pad) max(10px, env(safe-area-inset-bottom)); background: var(--paper); }
  #light { flex: none; width: 14px; height: 14px; border-radius: 50%; background: var(--soft); opacity: .45; transition: background .3s, opacity .3s; }
  #light[data-mode="listening"], #light[data-mode="ready"] { background: #2fb37a; opacity: 1; }
  #light[data-mode="you"] { background: #2fb37a; opacity: 1; animation: pulse .7s ease-in-out infinite alternate; }
  #light[data-mode="thinking"], #light[data-mode="talking"] { background: var(--flame); opacity: 1; animation: pulse .4s ease-in-out infinite alternate; }
  #light[data-mode="off"] { background: var(--alarm); opacity: 1; }
  @keyframes pulse { to { transform: scale(1.6); opacity: .6; } }
  #line { flex: 1; min-width: 0; font: 400 clamp(19px, 1.8vw, 30px)/1.25 var(--sans); letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #line .hint { color: var(--soft); }
  #line i { font-style: normal; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  #timers { flex: none; display: flex; gap: clamp(16px, 2vw, 36px); }
  .timer { display: flex; align-items: baseline; gap: .45em; font: 700 clamp(20px, 2vw, 34px)/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .timer::before { content: ""; align-self: center; width: .62em; height: .62em; border-radius: 50%; background: var(--field); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .18); }
  .timer span { font-weight: 400; }
  .timer.rung { color: var(--alarm); }

  @media (max-width: 760px) {
    #posters { flex-direction: column; }
    .poster:not(.main) { flex: 0 0 auto; grid-template-rows: auto auto; gap: 8px; padding-block: 16px; }
    .poster:not(.main) .t { grid-row: 2; }
    footer { flex-wrap: wrap; }
    #timers { order: 3; flex-basis: 100%; flex-wrap: wrap; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="posters" aria-live="polite"></main>
<footer>
  <i id="light" data-mode="asleep"></i>
  <div id="line" aria-live="polite"></div>
  <div id="timers"></div>
</footer>

<script src="/core.js"></script>
<script>
// ---------- colour: the food's own ----------
// The main food in the dish's name picks the colour: the last food word, since that's the head noun ("herb rice" is
// rice). Failing that the step's, and failing that a colour by the dish's place in the plan.
const FOODS = [
  [/salmon|trout|shrimp|prawn|lox/, "#f28b7a"], [/chocolate|cocoa|coffee|espresso|brownie/, "#5a3423"], [/tomato|marinara|ketchup|strawberr|raspberr|chili|chilli|pepperoni/, "#e5432f"],
  [/broccoli|spinach|kale|\bpeas?\b|herb|basil|pesto|parsley|cilantro|green bean|asparagus|lettuce|salad|leaves|cucumber|zucchini/, "#3f9a4f"],
  [/rice|cauliflower|potato|mash|cream|milk|yogurt|tofu|garlic|onion|bread|dough|flour|noodle/, "#efe4cc"],
  [/lemon|butter|\beggs?\b|corn|polenta|banana|pineapple|mustard|curry|turmeric/, "#f5d33f"], [/lime|avocado|pistachio|matcha/, "#a9cf4a"],
  [/carrot|orange|squash|pumpkin|sweet potato|apricot|mango|peach/, "#f28a2e"], [/beet|plum|cherr|wine|cranberr|pomegranate/, "#8e2149"],
  [/eggplant|aubergine|blueberr|grape|purple|cabbage/, "#5b3a7e"], [/mushroom|lentil|\boats?\b|walnut|hazelnut|almond|caramel|toast|tahini/, "#b08b65"],
  [/steak|beef|lamb|burger|sausage|bacon|pork|chicken|duck|turkey/, "#a24a3a"], [/pasta|spaghetti|penne|lasagn|risotto|cheese|parmesan|pizza|cake|cookie|\bpie\b/, "#f0c66b"],
  [/fish|\bcod\b|tuna|sea bass|halibut|scallop|clam|mussel|oyster/, "#9cc3d5"],
];
const FALLBACK = ["#f28b7a", "#3f9a4f", "#f5d33f", "#5a3423", "#9cc3d5", "#e5432f", "#b08b65", "#5b3a7e"];
const colorCache = new Map();
function foodColor(dish, title = "") {
  const key = `${dish}|${title}`;
  if (!colorCache.has(key)) {
    const find = (text) => {
      const words = text.toLowerCase().split(/[^a-z]+/).filter(Boolean);
      for (let i = words.length - 1; i >= 0; i--) {
        const hit = FOODS.find(([re]) => re.test(words.slice(Math.max(0, i - 1), i + 1).join(" ")) && re.test(words[i]) || re.test(words[i]));
        if (hit) return hit[1];
      }
    };
    colorCache.set(key, find(dish) || find(title) || FALLBACK[dishIndex(dish)]);
  }
  return colorCache.get(key);
}
// Black or white, whichever reads better on the colour.
function inkOn(hex) {
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  const L = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2];
  return (L + 0.05) / 0.06 >= 1.05 / (L + 0.05) ? "#1a1a1a" : "#ffffff";
}
const dishOf = (st) => foodColor(st.dish, st.title);
// "Sear the salmon" reads as "Sear salmon" from across the room.
const brief = (title) => { const t = title.replace(/\b(the|a|an|your|some)\s+/gi, "").replace(/\s+/g, " ").trim(); return t.charAt(0).toUpperCase() + t.slice(1); };

// ---------- fitting the title ----------
// The biggest size where no word overflows the width, it takes at most `lines` lines and at most `share` of the height.
const measurer = document.createElement("span");
function fit(el, box, lines, share, most = 400) {
  const cs = getComputedStyle(box), width = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const maxH = box.clientHeight * share, words = el.textContent.split(/\s+/);
  measurer.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap";
  document.body.append(measurer);
  let lo = 28, hi = most;
  while (hi - lo > 2) {
    const mid = (lo + hi) / 2;
    el.style.fontSize = `${mid}px`;
    const s = getComputedStyle(el);
    measurer.style.font = s.font; measurer.style.letterSpacing = s.letterSpacing;
    const wordsFit = words.every((w) => { measurer.textContent = w; return measurer.offsetWidth <= width; });
    if (wordsFit && el.offsetHeight <= Math.min(maxH, mid * 0.95 * lines + 4)) lo = mid; else hi = mid;
  }
  measurer.remove();
  el.style.fontSize = `${lo}px`;
  return lo;
}

// ---------- posters ----------
const onPoster = new Set(); // step ids whose time is on a poster, so the strip doesn't repeat it
function timeOf(o) {
  const st = o.s;
  if (!st) return null;
  if (o.waiting) return h("span", { class: "time", "data-until": stateAt + st.start * 60000, "data-in": "" }, `in ${hours(st.start)}`);
  const tm = timing(st);
  if (!tm) return null;
  onPoster.add(st.id);
  if (tm.paused) return h("span", { class: "time" }, clock(tm.left));
  return h("span", { class: "time", "data-until": tm.until, "data-clock": "" }, clock((tm.until - Date.now()) / 1000));
}
function poster(o, main, enter) {
  const cls = (...c) => ["poster", ...c, main && "main", enter && "enter"].filter(Boolean).join(" ");
  const paint = (hex) => `--field: ${hex}; --fg: ${inkOn(hex)}`;
  if (o.kind === "eat") return h("section", { class: cls(), style: paint("#3f9a4f") }, h("div", { class: "top" }), h("h1", { class: "t" }, "Dinner's up"));
  const st = o.s;
  const who = o.cook != null && state.cooks.length > 1 ? state.cooks[o.cook] : o.anyone ? "Anyone" : "";
  const el = h("section", { class: cls(o.kind === "rang" && "alarm"), style: paint(st ? dishOf(st) : "#ff4a2e") },
    h("div", { class: "top" }, h("span", {}, o.kind === "rang" ? "Time's up" : who), o.kind === "rang" ? h("span", {}, "0:00") : timeOf(o)),
    h("h1", { class: "t" }, brief(st ? st.title : words(o.label))));
  // The step's picture, when Basil has one, becomes the poster.
  if (st && o.kind !== "rang") picture(st).then(({ url }) => {
    if (!url || !el.isConnected) return;
    el.style.setProperty("--photo", `url("${url}")`); el.classList.add("photo");
  });
  return el;
}
function helloPoster() {
  return h("section", { class: "poster hello" }, h("div", { class: "top" }),
    h("h1", { class: `t${busyWith ? " working" : ""}`, "data-busy": busyWith ? "" : null }, busyWith ? busyText() : hello()));
}

let lastKeys = "";
function drawPosters() {
  const objs = objectives();
  const rung = objs.filter((o) => o.kind === "rang");
  // A timer going off takes the whole screen; otherwise one poster per cook, the first one widest.
  const shown = rung.length ? rung.slice(0, 1) : objs.filter((o) => o.kind !== "step" || o.s).slice(0, 3);
  const keys = shown.map((o) => o.key).join("|");
  const enter = !reduced() && keys !== lastKeys;
  lastKeys = keys;
  onPoster.clear();
  $("posters").replaceChildren(...(shown.length ? shown.map((o, i) => poster(o, i === 0 && shown.length > 1, enter)) : [helloPoster()]));
  requestAnimationFrame(() => {
    const ps = [...$("posters").children], narrow = matchMedia("(max-width: 760px)").matches;
    const main = ps.find((p) => p.classList.contains("main")) || ps[0], others = ps.filter((p) => p !== main);
    const title = (p) => p.querySelector(".t");
    // Name and time are a set fraction of the title, so every poster has the same proportions.
    const set = (p, s) => { title(p).style.fontSize = `${Math.round(s)}px`; p.style.setProperty("--small", `${Math.round(Math.max(18, Math.min(44, s * 0.24)))}px`); };
    if (narrow) for (const p of others) set(p, fit(title(p), p, 1, 1, 44));
    const size = fit(title(main), main, 2, 0.6);
    set(main, size);
    // Side by side, the others share one size, at most two thirds of the main.
    if (!narrow && others.length) {
      const s = Math.min(size * 0.66, ...others.map((p) => fit(title(p), p, 2, 0.6)));
      others.forEach((p) => set(p, s));
    }
  });
}

// ---------- the strip ----------
// Timers not already on a poster: the food and the time.
function drawTimers() {
  const timers = (state.timers || []).filter((t) => t.kind !== "reminder" && !t.follows && !onPoster.has(t.step_id)).sort((a, b) => a.seconds_left - b.seconds_left).slice(0, 3);
  $("timers").replaceChildren(...timers.map((t) => {
    const st = t.step_id && state.steps.find((x) => x.id === t.step_id);
    const name = st ? (FOODS.map(([re]) => st.title.toLowerCase().match(re)?.[0]).find(Boolean) || brief(st.title).split(" ").at(-1)) : words(t.label);
    const until = stateAt + t.seconds_left * 1000;
    return h("div", { class: `timer${rang.has(t.label) ? " rung" : ""}`, style: `--field: ${st ? dishOf(st) : "var(--ink)"}` },
      h("span", {}, name.charAt(0).toUpperCase() + name.slice(1)),
      t.paused ? clock(t.seconds_left) : h("b", { "data-until": until, "data-clock": "" }, clock(t.seconds_left)));
  }));
}
// Basil's line: what's being said while anyone's talking (and a while after), otherwise the one thing to say.
let quietAt = 0;
function drawLine() {
  const live = talking || hearing || Date.now() - quietAt < 9000;
  if (live && (basilText || youText)) return $("line").replaceChildren(basilText || youText);
  const [o] = objectives();
  const say = !o ? "“Salmon and rice for two, at seven”" : o.kind === "eat" ? "“We're done”" : "“Done”";
  $("line").replaceChildren(h("span", { class: "hint" }, busyWith ? busyText() : `${ws ? "Say" : "Space, then say"} ${say}`));
}

View.render = () => { drawPosters(); drawTimers(); drawLine(); };
View.tick = () => { if (!talking && !hearing && Date.now() - quietAt > 9000 && !$("line").querySelector(".hint")) drawLine(); };
View.pilot = (mode) => { $("light").dataset.mode = mode; if (state) drawLine(); };
View.said = (who, text, live) => { if (!live) quietAt = Date.now(); drawLine(); };
View.stream = (piece) => {
  if ($("line").querySelector(".hint") || !basilText.endsWith(piece)) return drawLine();
  $("line").append(h("i", {}, piece));
};
View.ignite = () => sound.boot();

// A tap anywhere starts talking, like pressing space.
$("posters").addEventListener("click", () => { if (!ws) talkPress(); });
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.repeat || pushToTalk || sheetView || e.target.matches?.("input, textarea, button, a")) return;
  e.preventDefault(); talkPress();
});
addEventListener("resize", () => state && drawPosters());
// Titles are fitted by measuring them, so fit again once the type has loaded.
document.fonts?.addEventListener("loadingdone", () => state && drawPosters());
document.fonts?.ready.then(() => state && drawPosters());
startBasil();
</script>
</body>
</html>
