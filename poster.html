<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23c8553d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wdth,wght@0,62..125,100..900;1,62..125,100..900&display=swap">
<style>
  /* The poster: no app on screen, just what to do, set as large as the screen allows so it reads from across the
     kitchen. You talk to change it. Each cook gets a poster in the colour of the dish they're on; timers sit in a
     quiet rail beneath; a timer that goes off takes the whole screen. The last line is the voice: whether Basil is
     listening, then what you can say, or what's being said. */
  :root {
    --paper: #f4efe6; --ink: #1b1712; --rule: color-mix(in srgb, var(--ink) 14%, transparent); --soft: color-mix(in srgb, var(--ink) 55%, transparent);
    --d0: #c8553d; --d1: #2e4a7d; --d2: #d9a23b; --d3: #7d3c5a; --d4: #8fa57f; --d5: #2f6f6a; --d6: #e2a593; --d7: #6b4a35;
    --alarm: #ff5a3c; --cream: #f7f1e6;
    --sans: "Archivo", system-ui, sans-serif; --wide: 125%;
    /* For core.js's drawers. */
    --bg: var(--paper); --top: #fbf8f2; --line: var(--rule); --line-2: color-mix(in srgb, var(--ink) 24%, transparent); --muted: var(--soft);
    --display: var(--sans); --mono: var(--sans); --flame: var(--d1); --hot: var(--d0);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #141311; --ink: #eee7da; --top: #1d1b18; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #141311; --ink: #eee7da; --top: #1d1b18; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; display: flex; flex-direction: column; user-select: none;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  [hidden] { display: none !important; }
  .caps { font: 600 clamp(11px, .95vw, 14px)/1.3 var(--sans); letter-spacing: .14em; text-transform: uppercase; }

  /* ---------- posters ---------- */
  #posters { flex: 1; min-height: 0; display: flex; }
  .poster { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; padding: clamp(24px, 3.6vw, 64px);
    background: var(--field, var(--paper)); color: var(--fg, var(--ink)); transition: background-color .8s ease, flex-grow .6s ease; overflow: hidden; }
  .poster.on-light { --fg: #1b1712; }
  .poster.on-dark { --fg: #f7f1e6; }
  .poster.main { flex-grow: 1.55; }
  .label { display: flex; flex-wrap: wrap; gap: .3em 1.6em; opacity: .75; }
  .t { margin: .22em 0 0 -.03em; font: 800 120px/.94 var(--sans); font-stretch: var(--wide); letter-spacing: -.035em; text-wrap: balance; }
  .poster.enter .t { animation: rise .7s cubic-bezier(.2, .8, .2, 1) both; }
  .poster.enter .body { animation: rise .7s .08s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px); } }
  .body { margin-top: auto; display: grid; gap: 1em; max-width: 30ch; font-size: var(--body, 28px); }
  .say-it { display: grid; gap: .35em; font: 500 1em/1.28 var(--sans); letter-spacing: -.005em; text-wrap: pretty; }
  .say-it p { margin: 0; }
  .say-it b { font-weight: 700; }
  .say-it .cue { opacity: .68; }
  .uses { margin: 0; opacity: .7; max-width: 60ch; }
  .uses .out { text-decoration: line-through; }
  .when { font: 700 var(--clock, 64px)/1 var(--sans); font-stretch: var(--wide); letter-spacing: -.03em; margin-top: .2em; opacity: .8; }
  .tap { position: absolute; right: clamp(24px, 3.6vw, 64px); bottom: clamp(24px, 3.6vw, 64px); opacity: .55; padding: 6px 0; border-bottom: 1px solid currentColor; }
  .tap:hover { opacity: 1; }
  /* Time's up: the poster goes dark and the words turn vermilion. */
  .poster.alarm { background: #15120f; color: var(--alarm); }
  .poster.alarm::after { content: ""; position: absolute; inset: 0; background: #fff; opacity: 0; animation: breathe 1.6s ease-in-out infinite; pointer-events: none; }
  @keyframes breathe { 50% { opacity: .1; } }
    .hello .t.working { opacity: .55; animation: dim 1.8s ease-in-out infinite; }
  @keyframes dim { 50% { opacity: .3; } }

  /* ---------- the rail: timers, then the voice ---------- */
  footer { flex: none; background: var(--paper); }
  #timers { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); border-bottom: 1px solid var(--rule); }
  #timers:empty { display: none; }
  .timer { position: relative; display: flex; align-items: baseline; justify-content: space-between; gap: 1em; padding: 18px clamp(24px, 3.6vw, 64px) 16px; min-width: 0; }
  .timer + .timer { border-left: 1px solid var(--rule); }
  .timer::before { content: ""; position: absolute; left: 0; top: 0; height: 3px; width: calc(var(--left) * 100%); background: var(--field); transition: width 1s linear; }
  .timer .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; align-items: center; gap: .8em; }
  .timer .what::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--field); }
  .timer .clock { font: 700 clamp(26px, 2.4vw, 40px)/1 var(--sans); font-stretch: var(--wide); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .timer.rung { color: var(--alarm); }
  .timer.rung .clock { animation: dim 1s ease-in-out infinite; }
  #voice { display: flex; align-items: center; gap: clamp(16px, 2.4vw, 40px); min-height: clamp(64px, 8.5vh, 96px); padding: 12px clamp(24px, 3.6vw, 64px) max(12px, env(safe-area-inset-bottom)); }
  .mark { flex: none; font: 800 clamp(18px, 1.5vw, 24px)/1 var(--sans); font-stretch: var(--wide); letter-spacing: -.03em; display: flex; align-items: center; gap: .45em; }
  /* Basil's light: still when asleep, steady when listening, quick when talking. */
  #light { width: 10px; height: 10px; border-radius: 50%; background: var(--soft); opacity: .5; transition: background .3s, opacity .3s; }
  #light[data-mode="listening"], #light[data-mode="ready"] { background: var(--d4); opacity: 1; }
  #light[data-mode="you"] { background: var(--d4); opacity: 1; animation: pulse .7s ease-in-out infinite alternate; }
  #light[data-mode="thinking"] { background: var(--d2); opacity: 1; animation: pulse 1s ease-in-out infinite alternate; }
  #light[data-mode="talking"] { background: var(--ink); opacity: 1; animation: pulse .35s ease-in-out infinite alternate; }
  #light[data-mode="off"] { background: var(--alarm); opacity: 1; }
  @keyframes pulse { to { transform: scale(1.7); opacity: .6; } }
  #line { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .2em 1.4em; }
  #line .hint { color: var(--soft); }
  #line q { quotes: "“" "”"; font: 600 clamp(17px, 1.45vw, 23px)/1.2 var(--sans); letter-spacing: -.01em; }
  #line .you { flex-basis: 100%; color: var(--soft); font-size: clamp(14px, 1.1vw, 17px); }
  #line .basil { flex-basis: 100%; font: 500 clamp(20px, 1.8vw, 30px)/1.25 var(--sans); letter-spacing: -.01em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #line i { font-style: normal; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  #more { flex: none; display: flex; gap: clamp(14px, 1.6vw, 28px); }
  #more button { color: var(--soft); padding: 6px 0; }
  #more button:hover, #more button[aria-expanded="true"] { color: var(--ink); }
  #b-sheet h2 { font: 800 30px var(--sans); font-stretch: var(--wide); letter-spacing: -.03em; }

  @media (max-width: 760px) {
    #posters { flex-direction: column; }
    .poster:not(.main) { flex: 0 0 auto; padding-block: 18px; }
    .poster:not(.main) .body, .poster:not(.main) .tap { display: none; }
    #timers { grid-auto-flow: row; }
    .timer + .timer { border-left: 0; border-top: 1px solid var(--rule); }
    #line q:nth-of-type(n+3) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="posters" aria-live="polite"></main>
<footer>
  <div id="timers"></div>
  <div id="voice">
    <span class="mark"><i id="light" data-mode="asleep"></i>basil</span>
    <div id="line" class="caps-free" aria-live="polite"></div>
    <span id="more" class="caps"></span>
  </div>
</footer>

<script src="/core.js"></script>
<script>
// Ink that reads on each dish's field.
const LIGHT_FIELDS = new Set([2, 4, 6]);
const fieldOf = (dish) => ({ field: `var(--d${dishIndex(dish)})`, on: LIGHT_FIELDS.has(dishIndex(dish)) ? "on-light" : "on-dark" });

// The title as large as the poster allows: the biggest size where no word overflows the width, it takes at most
// `lines` lines, and it fills at most `share` of the height.
const measurer = document.createElement("span");
function fit(el, box, lines, share, most = 380) {
  const cs = getComputedStyle(box), width = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const maxH = box.clientHeight * share, words = el.textContent.split(/\s+/);
  measurer.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap";
  document.body.append(measurer);
  let lo = 28, hi = most;
  while (hi - lo > 2) {
    const mid = (lo + hi) / 2;
    el.style.fontSize = measurer.style.fontSize = `${mid}px`;
    const cs2 = getComputedStyle(el);
    measurer.style.font = cs2.font; measurer.style.fontStretch = cs2.fontStretch; measurer.style.letterSpacing = cs2.letterSpacing;
    const wordsFit = words.every((w) => { measurer.textContent = w; return measurer.offsetWidth <= width; });
    if (wordsFit && el.offsetHeight <= Math.min(maxH, mid * 0.94 * lines + 4)) lo = mid; else hi = mid;
  }
  measurer.remove();
  el.style.fontSize = `${lo}px`;
  return lo;
}

function poster(o, main, enter) {
  const a = objectiveAction(o);
  const cls = (...c) => ["poster", ...c, main && "main", enter && "enter"].filter(Boolean).join(" ");
  if (o.kind === "eat") {
    return h("section", { class: cls("on-light"), style: "--field: var(--d4)" },
      h("div", { class: "label caps" }, h("span", {}, "Served")), h("h1", { class: "t" }, "Dinner's up."),
      h("div", { class: "body" }, h("div", { class: "say-it" }, h("p", {}, "Everything's done. Go and eat."))));
  }
  const st = o.s;
  const { field, on } = st ? fieldOf(st.dish) : { field: "var(--alarm)", on: "on-dark" };
  const who = o.cook != null && state.cooks.length > 1 ? state.cooks[o.cook] : o.anyone ? "Anyone" : null;
  const total = st ? state.steps.filter((x) => x.dish === st.dish).length : 0;
  const items = st ? stepUses(st) : [];
  return h("section", { class: cls(on, o.kind === "rang" && "alarm"), style: `--field: ${field}` },
    h("div", { class: "label caps" },
      o.kind === "rang" && h("span", {}, "Time's up"),
      who && h("span", {}, who),
      st && h("span", {}, st.dish),
      total > 1 && h("span", {}, `${stepNumber(st)} of ${total}`),
      o.viewing && h("span", {}, "Looking ahead")),
    h("h1", { class: "t" }, st ? st.title : words(o.label)),
    o.waiting && h("div", { class: "when", "data-until": stateAt + st.start * 60000, "data-in": "" }, `in ${hours(st.start)}`),
    h("div", { class: "body" },
      st && !sameWords(st.title, st.text) && instructionLines(st.text, "say-it"),
      items.length > 0 && h("p", { class: "uses caps" }, items.flatMap((u, i) => [i ? "   ·   " : null, h("span", { class: u.out ? "out" : false }, [u.amount, u.name].filter(Boolean).join(" "))]))),
    a && h("button", { class: "tap caps", onclick: () => a.run() }, a.label));
}
function helloPoster() {
  const working = !!busyWith;
  return h("section", { class: "poster hello" },
    h("div", { class: "label caps" }, h("span", {}, new Date().toLocaleDateString([], { weekday: "long" }))),
    h("h1", { class: `t${working ? " working" : ""}`, "data-busy": working ? "" : null }, working ? busyText() : hello()),
    h("div", { class: "body" }, h("div", { class: "say-it" }, h("p", {}, working ? "Basil's working it out." : "Tell Basil what you're making, who's eating, and when."))));
}

let lastKeys = "";
function drawPosters() {
  const objs = objectives();
  const rung = objs.filter((o) => o.kind === "rang");
  // A timer going off takes the whole screen; otherwise one poster per cook, the first one widest.
  const shown = rung.length ? rung.slice(0, 1) : objs.filter((o) => o.kind !== "step" || o.s).slice(0, 3);
  const keys = shown.map((o) => o.key).join("|");
  const enter = !reduced() && keys !== lastKeys;
  lastKeys = keys;
  $("posters").replaceChildren(...(shown.length ? shown.map((o, i) => poster(o, i === 0 && shown.length > 1, enter)) : [helloPoster()]));
  requestAnimationFrame(() => {
    // The others first, so the main poster fits the room they leave.
    for (const p of [...$("posters").children].sort((a, b) => a.classList.contains("main") - b.classList.contains("main"))) {
      const hasBody = !!p.querySelector(".say-it p");
      // Stacked on a phone, the others are a line each under the main poster.
      const aside = matchMedia("(max-width: 760px)").matches && !p.classList.contains("main") && $("posters").children.length > 1;
      const size = fit(p.querySelector(".t"), p, aside ? 1 : 3, hasBody ? 0.44 : 0.66, aside ? 44 : 380);
      let s2 = size;
      const scale = () => {
        p.querySelector(".t").style.fontSize = `${s2}px`;
        p.style.setProperty("--body", `${Math.max(17, Math.min(34, s2 * 0.26))}px`);
        p.style.setProperty("--clock", `${Math.max(32, Math.min(110, s2 * 0.55))}px`);
      };
      scale();
      // If the instructions don't fit under the title, the title gives way.
      while (!aside && p.scrollHeight > p.clientHeight + 1 && s2 > 30) { s2 *= 0.94; scale(); }
    }
  });
}

// Every running timer, soonest first, in the rail; the line along its top is the time left.
function drawTimers() {
  const timers = (state.timers || []).filter((t) => t.kind !== "reminder" && !t.follows).sort((a, b) => a.seconds_left - b.seconds_left).slice(0, 4);
  $("timers").replaceChildren(...timers.map((t) => {
    const st = t.step_id && state.steps.find((x) => x.id === t.step_id);
    const until = stateAt + t.seconds_left * 1000, left = Math.max(0, Math.min(1, t.seconds_left / (t.seconds || 1)));
    return h("div", { class: `timer${rang.has(t.label) ? " rung" : ""}`, style: `--field: ${st ? dishColor(st.dish) : "var(--ink)"}; --left: ${left}`,
      "data-band": "", "data-until": t.paused ? "" : until, "data-total": t.seconds },
      h("span", { class: "what caps" }, st ? st.title : words(t.label)),
      h("span", { class: "clock", ...(t.paused ? {} : { "data-until": until, "data-clock": "" }) }, t.paused ? `${clock(t.seconds_left)} paused` : clock(t.seconds_left)));
  }));
}

// The voice line: what's being said while anyone's talking (and for a while after), otherwise what you can say.
let quietAt = 0;
function drawLine() {
  const live = talking || hearing || Date.now() - quietAt < 9000;
  if (live && (basilText || youText)) {
    $("line").replaceChildren(...[youText && h("span", { class: "you" }, youText), basilText && h("span", { class: "basil" }, basilText)].filter(Boolean));
    return;
  }
  const [o] = objectives();
  const say = !o ? ["Salmon and rice for two, at seven", "What can I make from the fridge?"]
    : o.kind === "rang" ? ["Done", "One more minute"] : o.kind === "eat" ? ["We're done"]
    : ["Done", "What's next?", "How long's left?", "Show me the plan"];
  $("line").replaceChildren(h("span", { class: "hint caps" }, ws ? "Say" : busyWith ? busyText() : "Press space and say"), ...say.map((q) => h("q", {}, q)));
}
function drawMore() {
  $("more").replaceChildren(...navItems().map(({ view: v, label }) =>
    h("button", { "aria-expanded": String(sheetView === v), onclick: () => { sound.tap(); openSheet(sheetView === v ? "nothing" : v); } }, label)));
}

View.render = () => { drawTimers(); drawPosters(); drawLine(); drawMore(); };
View.tick = (now) => {
  if (!talking && !hearing && now - quietAt > 9000 && $("line").querySelector(".basil, .you")) drawLine();
  for (const el of document.querySelectorAll("[data-band]")) {
    if (el.dataset.until) el.style.setProperty("--left", Math.max(0, Math.min(1, (Number(el.dataset.until) - now) / 1000 / Number(el.dataset.total))));
  }
};
View.pilot = (mode) => {
  $("light").dataset.mode = mode;
  if (state) drawLine();
};
View.said = (who, text, live) => { if (!live) quietAt = Date.now(); drawLine(); };
View.stream = (piece) => {
  const p = $("line").querySelector(".basil");
  if (!p) return drawLine();
  p.append(h("i", {}, piece));
};
View.ignite = () => sound.boot();

// A tap anywhere on the posters starts talking, like pressing space.
$("posters").addEventListener("click", (e) => { if (!e.target.closest("button") && !ws) talkPress(); });
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.repeat || pushToTalk || sheetView || e.target.matches?.("input, textarea, button, a")) return;
  e.preventDefault(); talkPress();
});
addEventListener("resize", () => state && drawPosters());
// Titles are fitted by measuring them, so fit again once the type has loaded.
document.fonts?.addEventListener("loadingdone", () => state && drawPosters());
document.fonts?.ready.then(() => state && drawPosters());
startBasil();
</script>
</body>
</html>
