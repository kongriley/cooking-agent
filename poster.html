<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%238c33ff'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700&display=swap">
<style>
  /* The poster: no app on screen, just what to do, set as large as the screen allows so it reads from across the
     kitchen. You talk to change it. Each cook gets a poster in the colour of the dish they're on (or its picture);
     timers run in a dark rail beneath; a timer that goes off takes the whole screen. The last line is the voice:
     whether Basil is listening, then what you can say, or what's being said. Bold grotesk capitals for what to do,
     big plain sentences for how, hairlines between. */
  :root {
    --paper: #eef3e8; --ink: #1a1a1a; --rule: color-mix(in srgb, currentColor 28%, transparent); --soft: color-mix(in srgb, var(--ink) 55%, transparent);
    --d0: #ff7a45; --d1: #ffd23a; --d2: #b99aff; --d3: #6fd3a6; --d4: #ff9ccf; --d5: #7fb2ff; --d6: #d7e84f; --d7: #f2b880;
    --violet: #8c33ff;
    --sans: "Archivo", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --pad: clamp(24px, 2.8vw, 48px);
    /* For core.js's drawers. */
    --bg: var(--paper); --top: #f8faf5; --line: color-mix(in srgb, var(--ink) 14%, transparent); --line-2: color-mix(in srgb, var(--ink) 30%, transparent); --muted: var(--soft);
    --display: var(--sans); --mono: var(--sans); --flame: var(--violet); --hot: var(--d1); --alarm: var(--d1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --paper: #1a1a1a; --ink: #eef3e8; --top: #232323; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --paper: #1a1a1a; --ink: #eef3e8; --top: #232323; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--paper); color: var(--ink); font-family: var(--sans); overflow: hidden; display: flex; flex-direction: column; user-select: none;
    -webkit-font-smoothing: antialiased; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  [hidden] { display: none !important; }
  .caps { font: 700 clamp(13px, 1.1vw, 17px)/1.3 var(--sans); letter-spacing: .04em; text-transform: uppercase; }

  /* ---------- posters ---------- */
  #posters { flex: 1; min-height: 0; display: flex; }
  .poster { position: relative; flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; padding: var(--pad);
    background: var(--field, var(--paper)) center / cover no-repeat; color: var(--fg, #1a1a1a); transition: background-color .6s ease, flex-grow .6s ease; overflow: hidden; }
  .poster.main { flex-grow: 1.55; }
  .poster + .poster { box-shadow: inset 2px 0 0 #1a1a1a; }
  /* With a picture of the step, the picture is the poster. */
  .poster.photo { --fg: #fff; background-image: linear-gradient(rgb(0 0 0 / .6), rgb(0 0 0 / .35) 40%, rgb(0 0 0 / .78)), var(--photo); }
  /* Everything sits on the poster's bottom edge, so titles side by side share a baseline. */
  .stack { margin-top: auto; display: grid; gap: clamp(12px, 2vh, 24px); }
  .who { margin: 0; font: 700 clamp(20px, 2vw, 32px)/1 var(--sans); display: flex; align-items: center; gap: .5em; }
  .t { margin: 0 0 0 -.04em; font: 700 120px/1 var(--sans); letter-spacing: -.015em; text-wrap: balance; overflow-wrap: normal; }
  .poster.enter .t { animation: rise .6s cubic-bezier(.2, .8, .2, 1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } }
  .when { margin: 0; font: 400 clamp(28px, 3.4vw, 56px)/1 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  /* Time's up: black, the step in white capitals, and a violet ticker across the top that won't stop. */
  .poster.alarm { --fg: #fff; padding-top: calc(var(--pad) + 64px); background-image: none; }
  .ticker { position: absolute; left: 0; right: 0; top: 0; height: 56px; display: flex; align-items: center; overflow: hidden; background: var(--violet); color: #fff; white-space: nowrap; }
  .ticker span { flex: none; padding-right: 2em; font: 400 22px var(--sans); animation: tick 6s linear infinite; }
  @keyframes tick { to { transform: translateX(-100%); } }
  .hello .t.working { opacity: .5; animation: dim 1.8s ease-in-out infinite; }
  @keyframes dim { 50% { opacity: .25; } }

  /* ---------- the rail: timers on black, then the voice ---------- */
  footer { flex: none; }
  #timers { display: flex; background: #1a1a1a; color: #fff; box-shadow: inset 0 1px 0 rgb(255 255 255 / .14); }
  #timers:empty { display: none; }
  .timer { position: relative; flex: 0 1 auto; min-width: 0; width: clamp(200px, 22vw, 340px); display: grid; gap: 10px; padding: 16px var(--pad) 18px; }
  .timer + .timer { border-left: 1px solid rgb(255 255 255 / .2); }
  .timer::before { content: ""; position: absolute; left: 0; bottom: 0; height: 4px; width: calc(var(--left) * 100%); background: var(--field); transition: width 1s linear; }
  .timer .what { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .timer .clock { font: 700 clamp(30px, 3vw, 52px)/.9 var(--sans); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .timer.rung { background: var(--violet); }
  .timer.rung .clock { animation: dim 1s ease-in-out infinite; }
  #voice { display: flex; align-items: center; gap: clamp(16px, 2.4vw, 40px); min-height: clamp(64px, 8.5vh, 96px); padding: 12px var(--pad) max(12px, env(safe-area-inset-bottom));
    background: var(--paper); border-top: 1px solid var(--line); }
  .mark { flex: none; font: 700 clamp(20px, 1.6vw, 26px)/1 var(--sans); letter-spacing: -.02em; display: flex; align-items: center; gap: .5em; }
  /* Basil's light: still when asleep, steady when listening, quick when talking. */
  #light { width: 12px; height: 12px; border-radius: 50%; background: var(--soft); opacity: .45; transition: background .3s, opacity .3s; }
  #light[data-mode="listening"], #light[data-mode="ready"] { background: var(--d4); opacity: 1; }
  #light[data-mode="you"] { background: var(--d4); opacity: 1; animation: pulse .7s ease-in-out infinite alternate; }
  #light[data-mode="thinking"] { background: var(--violet); opacity: 1; animation: pulse 1s ease-in-out infinite alternate; }
  #light[data-mode="talking"] { background: var(--violet); opacity: 1; animation: pulse .35s ease-in-out infinite alternate; }
  #light[data-mode="off"] { background: var(--d1); opacity: 1; }
  @keyframes pulse { to { transform: scale(1.6); opacity: .6; } }
  #line { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: .2em 1.6em; }
  #line .hint { color: var(--soft); }
  #line q { quotes: "“" "”"; font: 500 clamp(18px, 1.6vw, 26px)/1.2 var(--sans); }
  #line .you { flex-basis: 100%; color: var(--soft); font-size: clamp(14px, 1.1vw, 17px); }
  #line .basil { flex-basis: 100%; font: 400 clamp(20px, 1.9vw, 32px)/1.25 var(--sans); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #line i { font-style: normal; animation: fade .25s ease-out; }
  @keyframes fade { from { opacity: 0; } }
  #more { flex: none; display: flex; gap: clamp(20px, 2.4vw, 48px); }
  #more button { padding: 6px 0; }
  #more button:hover, #more button[aria-expanded="true"] { box-shadow: 0 2px 0 currentColor; }
  #b-sheet h2 { font: 700 32px var(--sans); letter-spacing: -.02em; }
  #b-sheet { border-radius: 0; }

  @media (max-width: 760px) {
    #posters { flex-direction: column; }
    .poster + .poster { box-shadow: inset 0 2px 0 #1a1a1a; }
    .poster:not(.main) { flex: 0 0 auto; padding-block: 18px; }
    #timers { flex-direction: column; }
    .timer { width: auto; }
    .timer + .timer { border-left: 0; border-top: 1px solid rgb(255 255 255 / .2); }
    .timer { grid-template-columns: 1fr auto; align-items: baseline; padding-block: 12px; }
    #line q:nth-of-type(n+3) { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<main id="posters" aria-live="polite"></main>
<footer>
  <div id="timers"></div>
  <div id="voice">
    <span class="mark"><i id="light" data-mode="asleep"></i>basil</span>
    <div id="line" class="caps-free" aria-live="polite"></div>
    <span id="more" class="caps"></span>
  </div>
</footer>

<script src="/core.js"></script>
<script>


// The title as large as the poster allows: the biggest size where no word overflows the width, it takes at most
// `lines` lines, and it fills at most `share` of the height.
const measurer = document.createElement("span");
function fit(el, box, lines, share, most = 380) {
  const cs = getComputedStyle(box), width = box.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const maxH = box.clientHeight * share, words = el.textContent.split(/\s+/);
  measurer.style.cssText = "position:absolute;visibility:hidden;white-space:nowrap";
  document.body.append(measurer);
  let lo = 28, hi = most;
  while (hi - lo > 2) {
    const mid = (lo + hi) / 2;
    el.style.fontSize = measurer.style.fontSize = `${mid}px`;
    const cs2 = getComputedStyle(el);
    measurer.style.font = cs2.font; measurer.style.fontStretch = cs2.fontStretch; measurer.style.letterSpacing = cs2.letterSpacing; measurer.style.textTransform = cs2.textTransform;
    const wordsFit = words.every((w) => { measurer.textContent = w; return measurer.offsetWidth <= width; });
    if (wordsFit && el.offsetHeight <= Math.min(maxH, mid * 1.0 * lines + 4)) lo = mid; else hi = mid;
  }
  measurer.remove();
  el.style.fontSize = `${lo}px`;
  return lo;
}

// A poster says only what to do: who (when there's more than one cook), the step, and when it starts if it's waiting.
// Basil says the rest.
function poster(o, main, enter) {
  const cls = (...c) => ["poster", ...c, main && "main", enter && "enter"].filter(Boolean).join(" ");
  if (o.kind === "eat") return h("section", { class: cls(), style: "--field: var(--d4)" }, h("h1", { class: "t" }, "Dinner's up"));
  const st = o.s;
  const who = o.cook != null && state.cooks.length > 1 ? state.cooks[o.cook] : o.anyone ? "Anyone" : null;
  const rung = o.kind === "rang";
  const el = h("section", { class: cls(rung && "alarm"), style: `--field: ${rung ? "#1a1a1a" : st ? dishColor(st.dish) : "var(--ink)"}` },
    rung && h("div", { class: "ticker", "aria-hidden": "true" }, Array.from({ length: 8 }, () => h("span", {}, "Time's up"))),
    h("div", { class: "stack" },
      who && h("p", { class: "who" }, who),
      h("h1", { class: "t" }, st ? st.title : words(o.label)),
      o.waiting && h("p", { class: "when", "data-until": stateAt + st.start * 60000, "data-in": "" }, `in ${hours(st.start)}`)));
  // The step's picture, when Basil has one, becomes the poster.
  if (st && !rung) picture(st).then(({ url }) => {
    if (!url || !el.isConnected) return;
    el.style.setProperty("--photo", `url("${url}")`); el.classList.add("photo");
  });
  return el;
}
function helloPoster() {
  const working = !!busyWith;
  return h("section", { class: "poster hello" },
    h("div", { class: "stack" }, h("h1", { class: `t${working ? " working" : ""}`, "data-busy": working ? "" : null }, working ? busyText() : hello())));
}

let lastKeys = "";
function drawPosters() {
  const objs = objectives();
  const rung = objs.filter((o) => o.kind === "rang");
  // A timer going off takes the whole screen; otherwise one poster per cook, the first one widest.
  const shown = rung.length ? rung.slice(0, 1) : objs.filter((o) => o.kind !== "step" || o.s).slice(0, 3);
  const keys = shown.map((o) => o.key).join("|");
  const enter = !reduced() && keys !== lastKeys;
  lastKeys = keys;
  $("posters").replaceChildren(...(shown.length ? shown.map((o, i) => poster(o, i === 0 && shown.length > 1, enter)) : [helloPoster()]));
  requestAnimationFrame(() => {
    const ps = [...$("posters").children], narrow = matchMedia("(max-width: 760px)").matches;
    const main = ps.find((p) => p.classList.contains("main")) || ps[0], others = ps.filter((p) => p !== main);
    const title = (p) => p.querySelector(".t");
    const set = (p, s) => { title(p).style.fontSize = `${Math.round(s)}px`; };
    if (narrow) for (const p of others) set(p, fit(title(p), p, 1, 1, 40));
    const size = fit(title(main), main, 3, 0.62);
    set(main, size);
    // Side by side, the others share one size, at most two thirds of the main.
    if (!narrow && others.length) {
      const s = Math.min(size * 0.66, ...others.map((p) => fit(title(p), p, 3, 0.62)));
      others.forEach((p) => set(p, s));
    }
  });
}

// Every running timer, soonest first, in the rail; the line along its top is the time left.
function drawTimers() {
  const timers = (state.timers || []).filter((t) => t.kind !== "reminder" && !t.follows).sort((a, b) => a.seconds_left - b.seconds_left).slice(0, 4);
  $("timers").replaceChildren(...timers.map((t) => {
    const st = t.step_id && state.steps.find((x) => x.id === t.step_id);
    const until = stateAt + t.seconds_left * 1000, left = Math.max(0, Math.min(1, t.seconds_left / (t.seconds || 1)));
    return h("div", { class: `timer${rang.has(t.label) ? " rung" : ""}`, style: `--field: ${st ? dishColor(st.dish) : "var(--ink)"}; --left: ${left}`,
      "data-band": "", "data-until": t.paused ? "" : until, "data-total": t.seconds },
      h("span", { class: "what caps" }, st ? st.title : words(t.label)),
      h("span", { class: "clock", ...(t.paused ? {} : { "data-until": until, "data-clock": "" }) }, t.paused ? `${clock(t.seconds_left)} paused` : clock(t.seconds_left)));
  }));
}

// The voice line: what's being said while anyone's talking (and for a while after), otherwise what you can say.
let quietAt = 0;
function drawLine() {
  const live = talking || hearing || Date.now() - quietAt < 9000;
  if (live && (basilText || youText)) {
    $("line").replaceChildren(...[youText && h("span", { class: "you" }, youText), basilText && h("span", { class: "basil" }, basilText)].filter(Boolean));
    return;
  }
  const [o] = objectives();
  const say = !o ? ["Salmon and rice for two, at seven", "What can I make from the fridge?"]
    : o.kind === "rang" ? ["Done", "One more minute"] : o.kind === "eat" ? ["We're done"]
    : ["Done", "What's next?", "How do I do that?"];
  $("line").replaceChildren(h("span", { class: "hint caps" }, ws ? "Say" : busyWith ? busyText() : "Space, then say"), ...say.map((q) => h("q", {}, q)));
}
function drawMore() {
  $("more").replaceChildren(...navItems().map(({ view: v, label }) =>
    h("button", { "aria-expanded": String(sheetView === v), onclick: () => { sound.tap(); openSheet(sheetView === v ? "nothing" : v); } }, label)));
}

View.render = () => { drawTimers(); drawPosters(); drawLine(); drawMore(); };
View.tick = (now) => {
  if (!talking && !hearing && now - quietAt > 9000 && $("line").querySelector(".basil, .you")) drawLine();
  for (const el of document.querySelectorAll("[data-band]")) {
    if (el.dataset.until) el.style.setProperty("--left", Math.max(0, Math.min(1, (Number(el.dataset.until) - now) / 1000 / Number(el.dataset.total))));
  }
};
View.pilot = (mode) => {
  $("light").dataset.mode = mode;
  if (state) drawLine();
};
View.said = (who, text, live) => { if (!live) quietAt = Date.now(); drawLine(); };
View.stream = (piece) => {
  const p = $("line").querySelector(".basil");
  if (!p) return drawLine();
  p.append(h("i", {}, piece));
};
View.ignite = () => sound.boot();

// A tap anywhere on the posters starts talking, like pressing space.
$("posters").addEventListener("click", (e) => { if (!e.target.closest("button") && !ws) talkPress(); });
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.repeat || pushToTalk || sheetView || e.target.matches?.("input, textarea, button, a")) return;
  e.preventDefault(); talkPress();
});
addEventListener("resize", () => state && drawPosters());
// Titles are fitted by measuring them, so fit again once the type has loaded.
document.fonts?.addEventListener("loadingdone", () => state && drawPosters());
document.fonts?.ready.then(() => state && drawPosters());
startBasil();
</script>
</body>
</html>
