<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='3' y='3' width='10' height='10' rx='2' fill='%2316201a'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
  /* Layout: a cookbook page on an appliance. The plan runs across the top, the step you're on reads like a recipe on
     the left with its ingredients beside it, and timers, captions and the mic sit along the bottom. */
  :root {
    --enamel: #e2e9da; --ink: #16201a; --muted: #6b7b6d; --rule: #c5d1be; --knob: #eef3ea;
    --flame: #2e6ed8; --glow: #e3862a; --hot: #d4412a; --hot-soft: #f6dfd6;
    /* One colour per dish, so a dish's key and its steps on the timeline match. */
    --d0: #b85a35; --d1: #2f7a6a; --d2: #a07a1c; --d3: #6a56a8; --d4: #3567a8; --d5: #a3456a; --d6: #557f2f; --d7: #86654a;
    --display: "Bricolage Grotesque", ui-rounded, "Avenir Next", system-ui, sans-serif;
    /* The pass: ticket paper and the printer's type for facts; one red, for the stamp. */
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --paper: #fbfaf6; --stamp: #c8361f;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --enamel: #111814; --ink: #e4ece0; --muted: #879889; --rule: #25312a; --knob: #18211c;
      --flame: #6f9cff; --glow: #f0a14e; --hot: #ff6a4f; --hot-soft: #3a1f19; color-scheme: dark;
      --paper: #1a211c; --stamp: #ff6a4f;
      --d0: #e58c66; --d1: #6dbaa7; --d2: #d9b456; --d3: #a593e6; --d4: #7eaaea; --d5: #df7fa3; --d6: #96c56e; --d7: #c7a283;
    }
  }
  :root[data-theme="dark"] {
    --enamel: #111814; --ink: #e4ece0; --muted: #879889; --rule: #25312a; --knob: #18211c;
    --flame: #6f9cff; --glow: #f0a14e; --hot: #ff6a4f; --hot-soft: #3a1f19; color-scheme: dark;
      --paper: #1a211c; --stamp: #ff6a4f;
      --d0: #e58c66; --d1: #6dbaa7; --d2: #d9b456; --d3: #a593e6; --d4: #7eaaea; --d5: #df7fa3; --d6: #96c56e; --d7: #c7a283;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--enamel); color: var(--ink); font-family: var(--display);
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 28px;
    padding-block: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-bottom));
    padding-inline: clamp(16px, 5vw, 64px); user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  /* With nothing cooking, the corner keeps the time, in the printer's type. */
  .clock { font: 500 15px var(--mono); letter-spacing: .04em; color: var(--muted); font-variant-numeric: tabular-nums; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--flame); outline-offset: 3px; border-radius: 12px; }
  [hidden] { display: none !important; }
  .kicker { margin: 0; font-size: 15px; color: var(--muted); }

  /* Picture tiles: shown only once a photo is found. */
  .pic { flex: none; width: var(--size, 40px); height: var(--size, 40px); border-radius: 10px; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: contain; }
  .pic.photo img { object-fit: cover; }

  /* ---------- top: the dish, its steps, and the way into everything else ---------- */
  header { display: grid; grid-template-columns: auto minmax(0, max-content) minmax(0, 1fr) auto; gap: 28px; align-items: center; min-height: 44px; }
  /* The wordmark: the display face, tight, with the stamp's red for a full stop. */
  .wordmark { font-size: 24px; font-weight: 700; letter-spacing: -.045em; line-height: 1; font-variation-settings: "opsz" 96; }
  .wordmark i { font-style: normal; color: var(--stamp); }
  #dish:not(:empty) { margin-left: -8px; padding-left: 20px; border-left: 1px solid var(--rule); min-height: 32px; }
  #dish { display: flex; gap: 12px; align-items: center; --size: 44px; min-width: 0; }
  #dish b { font-size: 18px; line-height: 1.1; max-width: 26em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #strip { list-style: none; margin: 0; padding: 4px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; justify-content: flex-start; }
  /* Several dishes: one tab each, a thin line for how far along it is. The dot says where the work is: ink for the
     step your hands are on, amber for one cooking by itself. Only the chosen dish's steps show in the strip. */
  #dish:has(.tab) { gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .back { flex: none; font: 500 13px/1 var(--mono); letter-spacing: .06em; text-transform: uppercase; padding: 9px 14px; border-radius: 999px; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .back:hover { background: var(--ink); color: var(--enamel); }
  .pick { display: grid; gap: 2px; text-align: left; padding: 4px 8px; margin: -4px -8px; border-radius: 12px; }
  .pick b { font-size: 18px; line-height: 1.1; }
  .pick span { font-size: 13px; color: var(--muted); }
  .pick:hover span { color: var(--ink); }
  .tab { display: grid; gap: 7px; padding: 6px 12px; font-size: 16px; font-weight: 500; color: var(--muted); white-space: nowrap; text-align: left; border-radius: 12px; }
  .tab:hover { color: var(--ink); }
  .tab[aria-selected="true"] { color: var(--ink); }
  .tab .name { display: flex; gap: 8px; align-items: center; }
  .tab .name::before { content: ""; width: 7px; height: 7px; border-radius: 50%; display: none; }
  .tab.now .name::before { display: block; background: var(--ink); }
  .tab.cooking:not(.now) .name::before { display: block; background: var(--glow); }
  .tab .bar { height: 3px; border-radius: 2px; background: var(--rule); overflow: hidden; }
  .tab .bar i { display: block; height: 100%; background: currentColor; transition: width .4s; }
  #strip button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 500;
    font-variant-numeric: tabular-nums; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--rule); transition: background .2s, color .2s; }
  #strip button:hover { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--muted); }
  #strip button svg { width: 14px; height: 14px; }
  #strip [data-state="done"] button { box-shadow: none; }
  #strip [data-state="running"] button { color: var(--ink); box-shadow: inset 0 0 0 2px var(--glow); }
  #strip [data-state="now"] button { background: var(--ink); color: var(--enamel); box-shadow: none; }
  #strip .viewing button { box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
  #chips { display: flex; gap: 8px; }
  #chips button { padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--muted);
    box-shadow: inset 0 0 0 1.5px var(--rule); display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  #chips button:hover, #chips button[aria-expanded="true"] { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  #chips .pending::before, #chips .late::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--glow); }
  #chips .late::before { background: var(--hot); }
  #chips .busy::before { animation: flicker 1.2s ease-in-out infinite; }

  /* ---------- middle: the step, read like a recipe, and the ingredient list beside it ---------- */
  #work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: clamp(32px, 6vw, 88px); align-items: start;
    min-height: 0; padding-top: clamp(8px, 5vh, 48px); }
  #stage { display: grid; gap: 22px; align-content: start; grid-auto-rows: max-content; min-height: 0; max-width: 760px; }
  #stage:has(> #said, > .hint) { align-self: center; padding-bottom: clamp(8px, 5vh, 48px); }
  #stage.wide { max-width: none; align-content: start; align-self: stretch; overflow-y: auto; scrollbar-width: none; padding-bottom: 24px;
    -webkit-mask-image: linear-gradient(to top, transparent, #000 24px); mask-image: linear-gradient(to top, transparent, #000 24px); }
  /* A how-to card: the title, the usual mistake and the moment that matters along the top; numbered steps below. */
  .howto { display: grid; gap: 32px; }
  .howto-top { display: grid; grid-template-columns: minmax(0, 1fr); gap: clamp(24px, 4vw, 56px); align-items: center; }
  .howto-top:has(> .pinned) { grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
  .howto-head { display: grid; gap: 16px; justify-items: start; }
  .howto-head h1 { font-size: clamp(34px, 4.2vw, 56px); }
  .watch { margin: 0; display: grid; gap: 4px; font-size: 18px; line-height: 1.4; max-width: 32ch; }
  .watch b { font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--stamp); }
  .howto .hero-clip { width: 100%; aspect-ratio: 16 / 9; }
  .pinned .step-pic { width: 100%; border-radius: 4px; }
  .howto-steps { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 28px 24px; }
  .howto-steps li { display: grid; gap: 10px; align-content: start; }
  .howto-steps .step-pic { width: 100%; aspect-ratio: 3 / 2; border-radius: 4px; }
  .howto-steps h3 { margin: 4px 0 0; display: flex; gap: 10px; align-items: flex-start; font-size: 20px; line-height: 1.2; letter-spacing: -.01em; }
  .howto-steps .n { flex: none; padding-top: 3px; font: 700 13px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
  .howto-steps p { margin: 0; font-size: 17px; line-height: 1.4; text-wrap: pretty; }
  /* max-content rows: in a height-limited grid, the clipped picture frame would otherwise shrink and overlap the list. */
  #side { align-self: stretch; overflow-y: auto; min-height: 0; display: grid; gap: 22px; align-content: start; grid-auto-rows: max-content; padding-top: 4px;
    padding-bottom: 28px; -webkit-mask-image: linear-gradient(to top, transparent, #000 28px); mask-image: linear-gradient(to top, transparent, #000 28px); scrollbar-width: none; }
  .narrow-pic { display: none; }
  #side .step-pic { width: 100%; }
  #side:empty { display: none; }
  h1 { margin: 0; font-weight: 700; font-size: clamp(36px, 4.8vw, 64px); line-height: 1; letter-spacing: -.03em; text-wrap: balance; font-variation-settings: "opsz" 96; }
  .instruction { margin: 0; max-width: 30ch; font-size: clamp(22px, 2.3vw, 30px); line-height: 1.3; text-wrap: pretty; font-variation-settings: "opsz" 24; }
  div.instruction { display: grid; gap: .55em; }
  div.instruction p { margin: 0; }
  div.instruction b { font-weight: 700; }
  div.instruction .cue { color: var(--muted); }
  .head { display: grid; gap: 12px; }
  /* The step is an order ticket tucked into the rail: paper with a torn top, the printer's header, and a stamp when
     it's done ("DONE") or fired ("FIRED"). */
  .rail { position: relative; padding-top: 4px; max-width: 700px; }
  /* The pass: one ticket per station, side by side; tickets keep their height to their own content. */
  /* Tickets keep a ticket's width however wide the screen: a row of them, left-aligned under the wordmark. */
  .pass { position: relative; display: flex; flex-wrap: wrap; gap: 24px; align-items: stretch; width: fit-content; max-width: 100%; }
  .pass::before { content: ""; position: absolute; z-index: 2; top: 0; left: -12px; right: -12px; height: 4px; border-radius: 2px; background: var(--ink); }
  .pass .rail, .pass .ticket, .pass .slip { min-width: 0; }
  .pass .rail { display: flex; flex: 1 1 216px; max-width: 340px; }
  .pass .rail::before { display: none; }
  /* In the pass, tickets are compact: several have to fit, and each is read at a glance. */
  .pass .ticket { flex: 1; display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; }
  .pass .ticket .act { margin-top: auto; padding-top: 4px; }
  .pass .slip { padding-bottom: 10px; font-size: 12px; }
  .pass .step-pic { width: 100%; aspect-ratio: 16 / 7; border-radius: 3px; }
  .pass .ticket h1 { font-size: clamp(22px, 2.1vw, 28px); letter-spacing: -.02em; }
  .pass .instruction { font-size: 16px; max-width: none; }
  .pass .done { padding: 11px 26px; font-size: 16px; }
  .pass .ticket[data-stamp]::after { bottom: 20px; right: 20px; font-size: 14px; }
  .pass .slip { flex-wrap: nowrap; gap: 6px 12px; }
  .pass .slip > * { flex: none; white-space: nowrap; }
  .pass .slip .dish { flex: 1 1 auto; }
  .pass .slip .dish { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .rail::before { content: ""; position: absolute; z-index: 2; top: 0; left: -12px; right: -12px; height: 4px; border-radius: 2px; background: var(--ink); }
  .ticket { position: relative; display: grid; gap: 20px; padding: 30px clamp(22px, 3vw, 36px) 30px; background: var(--paper);
    border-radius: 0 0 4px 4px; box-shadow: 0 1px 0 color-mix(in srgb, var(--ink) 8%, transparent), 0 24px 48px -32px color-mix(in srgb, var(--ink) 50%, transparent); }
  .ticket.fresh { animation: hang .45s cubic-bezier(.2, 1.3, .4, 1) both; transform-origin: top center; }
  @keyframes hang { from { transform: translateY(-10px); opacity: 0; } }
  .slip { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding-bottom: 14px; border-bottom: 1px solid var(--rule);
    font: 500 13px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .slip .who { font-family: var(--mono); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; }
  .slip .n { margin-left: auto; color: var(--ink); font-weight: 700; }
  .ticket[data-stamp]::after { content: attr(data-stamp); position: absolute; bottom: 38px; right: clamp(22px, 3vw, 36px); padding: 6px 14px;
    border: 2px solid var(--stamp); border-radius: 3px; font: 700 18px/1 var(--mono); letter-spacing: .2em; color: var(--stamp);
    background: var(--paper); transform: rotate(-4deg); pointer-events: none; }
  .ticket.stamping[data-stamp]::after { animation: stamp .3s cubic-bezier(.2, 1.6, .4, 1) both; }
  @keyframes stamp { from { transform: rotate(-4deg) scale(1.8); opacity: 0; } }
  .countdown { margin: 0; font-size: clamp(34px, 3.6vw, 46px); line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .countdown small { font: 400 16px var(--display); color: var(--muted); letter-spacing: 0; margin-left: 10px; }
  .act { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .done { padding: 18px 44px; border-radius: 999px; background: var(--ink); color: var(--enamel); font-weight: 700; font-size: 20px; transition: transform .12s; }
  .done:active { transform: scale(.96); }
  .then { margin: 0; font-size: 17px; color: var(--muted); }
  .early { padding: 14px 30px; border-radius: 999px; font-weight: 500; font-size: 17px; box-shadow: inset 0 0 0 1.5px var(--ink); }
  .head .kicker { display: flex; gap: 10px; align-items: center; }
  .meanwhile { list-style: none; margin: 10px 0 0; padding: 16px 0 0; border-top: 1px solid var(--rule); display: grid; gap: 10px; }
  .meanwhile button { display: flex; gap: 12px; align-items: center; font-size: 18px; text-align: left; }
  .meanwhile button:hover span { text-decoration: underline; text-underline-offset: 4px; }
  .meanwhile small { font-size: 14px; color: var(--muted); }
  .meanwhile.next small { flex: none; min-width: 6.5em; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
  .meanwhile .dot { flex: none; width: 8px; height: 8px; border-radius: 50%; }
  .then svg { width: 28px; height: 28px; }
  .choices { display: flex; gap: 12px; flex-wrap: wrap; }
  .choices button, .choices a { padding: 18px 34px; border-radius: 999px; font-weight: 700; font-size: 20px; text-decoration: none; box-shadow: inset 0 0 0 2px var(--ink); }
  .choices .yes { background: var(--ink); color: var(--enamel); }
  .hero { --size: 180px; border-radius: 24px; }
  .hero[hidden] { display: none; }
  /* The step's picture: room is held for it while it's being found or made, so the text doesn't jump. */
  .step-pic { position: relative; margin: 0; width: min(100%, 420px); aspect-ratio: 3 / 2; border-radius: 18px; overflow: hidden; background: var(--knob); }
  .step-pic.loading { animation: flicker 1.8s ease-in-out infinite; }
  .step-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .step-pic .wait { position: absolute; inset: 0; display: grid; place-items: center; font: 500 12px var(--mono);
    letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
  .step-pic figcaption { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: rgb(255 255 255 / .85); text-shadow: 0 1px 3px rgb(0 0 0 / .5); }

  /* Ingredient list, cookbook style: amount first. Only what you're missing is marked, and gathered at the top. */
  .recipe { display: grid; gap: 14px; }
  .recipe h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .recipe ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: fit-content(40%) minmax(0, 1fr); column-gap: 16px; row-gap: 10px; }
  .recipe li { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline; font-size: 16px; line-height: 1.35; color: var(--muted); }
  .recipe li .amt { font-variant-numeric: tabular-nums; }
  .recipe li.now { color: var(--ink); font-weight: 500; }
  .recipe li.out .name { color: var(--hot); }
  .recipe .edit { justify-self: start; padding: 2px 0; font-size: 14px; font-weight: 500; color: var(--muted); }
  .recipe .edit:hover, .recipe .edit[aria-pressed="true"] { color: var(--ink); }
  .recipe ul.editing { grid-template-columns: 6em minmax(0, 1fr) 24px; row-gap: 0; }
  .recipe ul.editing li { align-items: center; color: var(--ink); }
  .recipe input { min-width: 0; padding: 7px 0; font: inherit; font-size: 16px; color: var(--ink); background: none; border: 0; border-radius: 0;
    box-shadow: inset 0 -1px 0 var(--rule); user-select: text; }
  .recipe input.amt { font-variant-numeric: tabular-nums; color: var(--muted); }
  .recipe input:focus { outline: none; box-shadow: inset 0 -1.5px 0 var(--ink); }
  .recipe input::placeholder { color: var(--muted); opacity: .7; }
  .recipe .x { padding: 4px; font-size: 14px; color: var(--muted); opacity: .5; }
  .recipe .x:hover { color: var(--hot); opacity: 1; }
  .recipe .get { justify-self: start; padding: 9px 16px; border-radius: 999px; font-weight: 500; font-size: 15px; box-shadow: inset 0 0 0 1.5px var(--hot); color: var(--hot); }

  /* Nothing cooking: the conversation is the content, so it takes the middle of the screen, on the mic's axis. */
  #work:has(> #side:empty) { grid-template-columns: minmax(0, 1fr); }
  #stage:has(> #said, > .hint) { justify-self: center; justify-items: center; text-align: center; }
  /* Captions read left to right in a column of fixed width: centred text would re-centre with every word. */
  /* A set width, not a share of the middle (which shrinks to fit, so the column grew word by word). */
  #stage > #said { gap: 14px; width: min(760px, calc(100vw - 2 * clamp(16px, 5vw, 64px))); text-align: start; }
  #stage > #said .line { max-height: none; -webkit-mask-image: none; mask-image: none; }
  #stage > #said .you { font-size: clamp(18px, 2vw, 22px); }
  #stage:has(> .hint) { justify-self: center; justify-items: center; text-align: center; }
  #stage > .hint { margin: 0; font-size: clamp(26px, 3.2vw, 40px); line-height: 1.3; letter-spacing: -.01em; color: var(--muted); max-width: 18em; }
  #stage > #said .basil { font-size: clamp(26px, 3.2vw, 40px); line-height: 1.3; letter-spacing: -.01em; }

  /* ---------- bottom: timers on the left, the voice in the middle: what was said, above the mic ---------- */
  footer { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 28px; align-items: end; }
  #voice { display: grid; justify-items: center; gap: 14px; }
  #voice > #said { width: min(520px, 44vw); text-align: start; }
  #said { display: grid; gap: 4px; min-width: 0; }
  .said { margin: 0; display: grid; font-size: 17px; line-height: 1.4; color: var(--muted); }
  .said .line { max-height: 2.8em; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 1.1em); mask-image: linear-gradient(to bottom, transparent 0, #000 1.1em); }
  .said .line:has(> span:only-child) { -webkit-mask-image: none; mask-image: none; }
  .said.basil .line { color: var(--ink); }
  .said .line i { font-style: normal; animation: appear .35s ease-out; }
  /* Your words stream in as you speak, then stay, quieter, until you speak again. */
  footer .said.you .line { color: var(--muted); }
  footer .said.you.live .line { color: var(--ink); }
  .said.pondering .line { color: var(--muted); animation: flicker 1.6s ease-in-out infinite; }
  @keyframes appear { from { opacity: 0; } }

  #mic { display: grid; justify-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  /* Basil working on something slow (a plan, a hard question): said plainly until it lands. */
  #busy { margin: 0; font: 500 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--ink);
    animation: flicker 1.6s ease-in-out infinite; }

  /* When the strip can't fit every title, keep the one you're on (or looking at) and show numbers for the rest. */
  @media (max-width: 900px) {

<body>
<header>
  <span class="wordmark" aria-label="Basil">basil<i>.</i></span>
  <div id="dish"></div>
  <ol id="strip" aria-label="Steps"></ol>
  <nav id="chips" aria-label="More"></nav>
</header>
<aside id="sheet" hidden></aside>
<div id="notice" role="status" hidden></div>
<div id="work">
  <main id="stage"></main>
  <div id="side"></div>
</div>
<footer>
  <div id="timers"></div>
  <div id="voice">
  <p id="busy" role="status" hidden></p>
  <div id="said">
    <p class="said you" hidden><span class="line"><span id="said-you"></span></span></p>
    <p class="said basil" hidden><span class="line"><span id="said-basil"></span></span></p>
  </div>
  <button id="mic" data-mode="asleep" aria-label="Talk to Basil">
    <span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/>
    </svg></span>
    <span id="mic-word"></span>
  </button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
// Text always goes in via textContent, so nothing the model writes can inject markup.
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    k.startsWith("on") ? el.addEventListener(k.slice(2), v) : el.setAttribute(k, v === true ? "" : v);
  }
  el.append(...kids.flat().filter((k) => k != null && k !== false));
  return el;
}
function svg(tag, attrs = {}, ...kids) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  el.append(...kids);
  return el;
}

const RATE = 16000, FRAME = 320; // 20 ms frames; the API rejects chunks over 40 ms
const R = 48, CIRC = 2 * Math.PI * R; // dial ring radius, inside a 108 px face
let ws = null, screen = null, ctx, mic, muted = false, state = null, stateAt = 0;
let talking = false, hearing = false, thinking = false, consulting = false, playhead = 0;
const playing = new Set();
const rang = new Map(); // timer label -> {at, step_id}
let closedBecause = ""; // Phonic's reason for ending the conversation, when it gives one
let viewing = null; // id of a step the cook is looking ahead (or back) at; null follows the current step

// ---------- connection, audio ----------
// Two connections: the screen's own, always open, which shows the saved kitchen and takes taps; and the conversation
// with Basil, which starts only from the mic. While a conversation is open, it carries both.
function connectScreen() {
  screen = new WebSocket(`ws://${location.host}/ws?talk=0`);
  screen.onopen = refresh;
  screen.onmessage = (e) => { if (!ws) onEvent(JSON.parse(e.data)); };
  screen.onclose = () => setTimeout(connectScreen, 1000);
}
function refresh() { if (screen?.readyState === 1) screen.send(JSON.stringify({ type: "refresh" })); }
connectScreen();

// How Basil listens, a setting on this screen. Always on: from the moment the page opens, picking the conversation
// back up, quietly, whenever it drops (Phonic ends one after ten minutes of nobody speaking). Tap: the mic button
// starts him and mutes him. Hold: he hears only while the mic button or Space is held down.
const ALWAYS_KEY = "basil.alwaysOn", HOLD_KEY = "basil.pushToTalk";

  // holding starts a new one (straight away if always on, else at the next press).
  if (ws && wasHold !== pushToTalk) ws.close();

const setAlwaysOn = (on) => setListen(on ? "always" : "tap");

// Browsers only let sound play after the page has been touched; the first touch anywhere unlocks it.
document.addEventListener("pointerdown", () => {
  if (ctx?.state === "suspended") ctx.resume();
  if (dictationBlocked && ws?.readyState === 1) { dictationBlocked = false; try { recognizer?.start(); } catch {} }

async function wake(quiet = false) {
  if (ws) return;
  ctx ||= new AudioContext({ sampleRate: RATE });
  muted = false;
  const opened = Date.now();
  const query = [quiet && "quiet=1", pushToTalk && "ptt=1"].filter(Boolean).join("&");
  ws = new WebSocket(`ws://${location.host}/ws${query ? `?${query}` : ""}`);
  ws.onmessage = (e) => onEvent(JSON.parse(e.data));
  ws.onclose = () => {
    // Back to asleep: the next tap starts a fresh conversation, which picks up where this one left off.
    ws = null; talking = hearing = thinking = consulting = false; busyWith = null; renderBusy(); hush();
    recognizer?.abort(); mic?.getTracks().forEach((t) => t.stop()); mic = null;
    pilot("asleep", closedBecause);

      // A conversation that ends straight away (an account problem, the server down) waits longer each time.
      retryMs = Date.now() - opened < 15000 ? Math.min(retryMs * 2, 60000) : 1000;
      setTimeout(() => stayConnected() && !ws && wake(true), retryMs);

let worklet = null;

    constructor() { super(); this.buf = new Int16Array(${FRAME}); this.n = 0; }
    process([input]) {
      for (const s of input[0] || []) {
        this.buf[this.n++] = Math.max(-1, Math.min(1, s)) * 0x7fff;
        if (this.n === ${FRAME}) { this.port.postMessage(this.buf.slice().buffer); this.n = 0; }
      }
      return true;
    }

  await worklet;

    if (muted || ws?.readyState !== 1) return;
    let s = "";
    for (const b of new Uint8Array(e.data)) s += String.fromCharCode(b);
    ws.send(JSON.stringify({ type: "audio", audio: btoa(s) }));
  };

  refreshPilot();
}

$("mic").onclick = () => {
  if (pushToTalk) return; // pressing and letting go is the whole gesture
  if (!ws) return wake(); if (!mic) return; muted = !muted; mic.getAudioTracks().forEach((t) => (t.enabled = !muted)); refreshPilot();
};
$("mic").addEventListener("pointerdown", (e) => {

  hold(true);

});
for (const end of ["pointerup", "pointercancel", "lostpointercapture"]) $("mic").addEventListener(end, () => pushToTalk && holding && hold(false));
document.addEventListener("keydown", (e) => {
  if (!pushToTalk || e.code !== "Space" || e.repeat || e.target.matches?.("input, textarea")) return;
  e.preventDefault(); hold(true); if (!ws) wake();
});
document.addEventListener("keyup", (e) => { if (pushToTalk && e.code === "Space" && holding) { e.preventDefault(); hold(false); } });

function play(audio) {

  for (let i = 0; i < n; i++) { const v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); out[i] = (v > 32767 ? v - 65536 : v) / 32768; }

  node.start(playhead); playhead += buf.duration;

// Live words while the cook talks. Phonic only sends the transcript once they stop, so the browser's own speech

let recognizer = null, dictationBlocked = false;

  recognizer.continuous = true; recognizer.interimResults = true;
  recognizer.onresult = (e) => {

    said("you", text.trim(), true);
  };
  recognizer.onend = () => { if (ws?.readyState === 1 && !dictationBlocked) setTimeout(() => recognizer?.start(), 250); };
  // Chrome can refuse to start recognition without a click (always-on starts on its own): it then waits for the next
  // touch of the page. Basil still hears everything; only the live words would be missing.
  recognizer.onerror = (e) => {
    console.warn("live captions:", e.error);
    if (e.error === "not-allowed" || e.error === "service-not-allowed") dictationBlocked = true;
  };
  try { recognizer.start(); } catch (e) { console.warn("live captions:", e); dictationBlocked = true; }
}

const SLOW_TOOLS = ["think_it_through", "plan_dish"]; // a careful chef thinking: 10-30 s
// What Basil is busy with, shown until it lands: "Planning poulet au vinaigre…", "Thinking…".
let busyWith = null;
function busyLabel(tool, parameters = {}) {
  if (tool === "plan_dish") return parameters.dish ? `Planning ${parameters.dish.toLowerCase()}…` : "Planning…";
  return "Thinking…";
}
// Thinking: from the end of what you said to his first word. He may decide it wasn't for him and say nothing, so it
// doesn't outlast a few seconds of silence.
const THINKING_MS = 10000;
let thinkingTimer = null;
function setThinking(on) {
  thinking = on;
  clearTimeout(thinkingTimer);
  if (on) thinkingTimer = setTimeout(() => setThinking(false), THINKING_MS);
  refreshPilot();
}
// A slow consult counts its seconds, so a long one reads as working, not stuck.
let busySince = 0, busyTicker = null;
const busyText = () => {
  const secs = Math.floor((Date.now() - busySince) / 1000);
  return busyWith && secs >= 3 ? `${busyWith} ${secs}s` : busyWith || "";
};
function tickBusy() { // just the words: no redraw every second
  $("busy").textContent = busyText();
  const middle = document.querySelector("#stage > .hint.working");
  if (middle) middle.textContent = busyText();
}
function renderBusy() {
  clearInterval(busyTicker);
  busySince = busyWith ? Date.now() : 0;
  if (busyWith) busyTicker = setInterval(tickBusy, 1000);
  $("busy").hidden = !busyWith;
  $("busy").textContent = busyText();
  if (!plan().steps.length) render(); // on an empty screen, it takes the middle
}
function onEvent(m) {

    case "audio_chunk": play(m.audio); if (m.text) stream(m.text); break;
    case "input_text": said("you", m.text, false); break;
    case "tool_started":
      // A consult takes a while; say so, so a quiet Basil doesn't read as a frozen one.
      // While he's still saying his line ("Chicken. One sec."), let it finish; the mic shows the thinking either way.
      if (SLOW_TOOLS.includes(m.tool_name)) { consulting = true; busyWith = busyLabel(m.tool_name, m.parameters); renderBusy(); }
      break;
    case "tool_result":
      if (m.silent) setThinking(false); // a change the screen shows, or not his turn: no answer is coming
      if (m.tool_name === "show_on_screen" && m.output.ok) showOnScreen(m.output);
      if (m.tool_name === "set_listening" && m.output.ok) setAlwaysOn(m.output.always);
      if (SLOW_TOOLS.includes(m.tool_name)) { consulting = false; busyWith = null; renderBusy(); }
      break;
    case "assistant_started_speaking": talking = true; setThinking(false); document.querySelector(".said.basil").classList.remove("pondering"); said("basil", "", true); break;
    case "assistant_finished_speaking": talking = false; live("basil", false); break;
    case "interrupted_response": talking = false; hush(); live("basil", false); break;
    case "user_started_speaking": hearing = true; hush(); said("you", "", true); break;
    case "user_finished_speaking": hearing = false; setThinking(true); break;

      if (!talking && !consulting && (m.said.basil || "") !== basilText) said("basil", m.said.basil || "", false);

function said(who, text, isLive) {

  live(who, isLive);
}
function live(who, on) {
  const row = document.querySelector(`.said.${who}`);
  row.classList.toggle("live", on);
  row.hidden = !on && !$(`said-${who}`).textContent;
  if (!row.hidden && document.querySelector("#stage > .hint")) render(); // first words replace the hint
}
function stream(text) {

  if (basilText && !/\s$/.test(basilText) && !/^\s/.test(text) && (/[.!?,:;]$/.test(basilText) || /^[A-Z]/.test(text))) text = " " + text;

function pilot(mode, word) {

  $("mic").setAttribute("aria-label", pushToTalk ? "Hold to talk to Basil" : mode === "asleep" ? "Talk to Basil" : "Mute or unmute the microphone");

  if (!mic) return pilot("off", "No microphone");
  const idle = pushToTalk && !holding ? "ready" : "listening";
  pilot(muted ? "off" : holding ? "you" : talking ? "talking" : hearing ? "you" : thinking || consulting ? "thinking" : idle, "");

// ---------- helpers ----------
const nowClock = () => h("span", { class: "clock", "data-now": "" }, atClock(Date.now()));
// The first thing on an empty screen, in Basil's voice and the time of day's.
function hello() {
  const hour = new Date().getHours();
  if (hour >= 5 && hour < 11) return "Morning. What are we making?";
  if (hour >= 11 && hour < 15) return "What's for lunch?";
  if (hour >= 15 && hour < 22) return "What's for dinner?";
  return "Late one. What are we making?";
}
// A tap goes to the conversation when there is one (so Basil knows), otherwise straight to the saved kitchen.
function act(action, extra = {}) {
  const message = JSON.stringify({ type: "action", action, ...extra });
  if (ws?.readyState === 1) ws.send(message);
  else if (ws) ws.addEventListener("open", () => ws.send(message), { once: true });

// Durations, short: "10 min", "2 hr", "1 hr 20 min".

  return m % 60 ? `${Math.floor(m / 60)} hr ${m % 60} min` : `${m / 60} hr`;
}

}

  return text.charAt(0).toUpperCase() + text.slice(1);

const TOOL_WORDS = /\b(pan|pot|skillet|sheet|tray|mixer|bowl|whisk|knife|board|oven|rack|pin|scale|thermometer|colander|sieve|grater|processor|blender|dutch|spatula|tongs|mold|tin|dish|grill|griddle|thermometer)\b/i;
// A photo of the finished dish; a missing one shows nothing.

  const tile = h("div", { class: `pic${kind === "dish" ? " photo" : ""}`, hidden: true });
  const img = h("img", { src: `/img?q=${encodeURIComponent(name)}&kind=${kind}`, alt: "", loading: "lazy" });
  img.onload = () => { tile.replaceChildren(img); tile.hidden = false; };

// ---------- shopping ----------
const NOTICE_MS = 15 * 1000; // how long a finished cart's notice stays up
// The store the agent shopped at (its cart is one tap from there); older orders didn't record it.
const cartUrl = (o) => o.cart_url || "https://www.instacart.com/store";
// The sandboxed shopping browser's screen: where the cook signs in once, and can watch it shop.
const VIEWER_URL = `http://${location.hostname}:6080/vnc.html?autoconnect=1&resize=scale`;
const setAside = new Set();
const itemName = (added) => added.split(":")[0].trim();
function link(url, label, cls, at) {
  const a = h("a", { class: cls, href: url, target: "_blank", rel: "noopener" }, label);
  if (at) a.addEventListener("click", () => { putAwayCarts(); setTimeout(render, 0); });
  return a;
}
// Done with the cart card: every finished cart goes, not just the one on screen (or the next pops straight up).

function shopperLink(label, cls, at) {
  if (state.shopping.viewer) return link(VIEWER_URL, label, cls, at);
  if (label === "Watch") return h("button", { class: cls, onclick: () => openSheet("shopping") }, label);
  return h("button", { class: cls, title: "Opens a window to sign in to Instacart; it closes itself once you're in", onclick: () => {
    act("show_shopper");

  } }, label);
}
// What can be done with a cart. An Instacart cart is on the cook's account, so Review opens it in their own browser;
// a store's own cart lives in the shopping browser, so Open shows that browser as a window on it.
function cartActions(o, cls) {
  if (o.status === "needs_login") return [shopperLink("Sign in", cls)];
  if (o.status === "filling") return state.shopping.viewer ? [shopperLink("Watch", cls)] : [];
  if (o.status !== "ready") return [];

// "dartagnan.com" -> "Dartagnan"; Instacart stores keep their name.

  const name = o.store || "Instacart";

  const base = name.split(".").slice(-2, -1)[0] || name;

// "18 items · Safeway": what the cart is, without listing it.
function cartTitle(o) {

  return listing(o.status === "ready" && o.kind !== "change" ? (o.added || []).map(itemName) : o.items).toLowerCase();

function cartLine(o) {

// What Basil puts on screen when asked, the same as the taps that do it.
function showOnScreen({ showing, step_id, dish }) {
  if (showing === "now" || (showing === "step" && !step_id)) {
    viewing = null; planDish = null; openSheet("nothing");
  } else if (showing === "nothing") {
    // Back to what they're doing: no sheet, no card, no rung timers, the cart put away, the current step.
    viewing = null; planDish = null; rang.clear();
    for (const o of state?.carts || []) setAside.add(o.at);
    openSheet("nothing");
  } else if (showing === "step") {
    viewing = step_id; openSheet("nothing");
  } else if (showing === "plan") {
    planDish = dish; openSheet("plan");
  } else {
    openSheet(showing);
  }
  render();

// A cart that just finished: a small notice at the bottom, not the middle of the screen. Basil says it too; the
// notice is there to act on (review, sign in) and goes by itself. Everything else about the cart is in the sheet.
function renderNotice() {
  const notice = $("notice");
  const done = (state?.carts || []).find((o) => ["ready", "needs_login", "failed"].includes(o.status) && !setAside.has(o.at)
    && Date.now() - (o.done_at ?? o.at) * 1000 < NOTICE_MS);
  notice.hidden = !done;
  if (!done) return;
  const close = h("button", { class: "x", "aria-label": "Dismiss", onclick: () => { setAside.add(done.at); renderNotice(); } }, "✕");
  notice.replaceChildren(h("span", {}, h("b", {}, storeName(done)), ` · ${cartLine(done)}`),
    ...cartActions(done, "open small"), close);
  setTimeout(renderNotice, NOTICE_MS + 500);
}

// ---------- sheets ----------
let sheetView = null; // "plan" | "shopping" | "kitchen" | "ingredients" | null
function openSheet(view) { sheetView = view === "nothing" ? null : view; renderChips(); renderSheet(); }
document.addEventListener("click", (e) => {
  if (sheetView && !e.composedPath().some((el) => el.id === "sheet" || el.id === "chips")) openSheet("nothing");
});
document.addEventListener("keydown", (e) => {
  if (e.target.matches?.("input")) return; // keys in a field are for the field
  if (e.key === "Escape") { if (sheetView) openSheet("nothing"); else if (viewing) backToNow(); }
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "z" && !e.shiftKey) { e.preventDefault(); act("undo"); }
  if (e.key === "ArrowRight") look(1);
  if (e.key === "ArrowLeft") look(-1);
});

function renderChips() {
  const carts = state?.carts || [];
  const filling = carts.some((o) => o.status === "filling");
  const chip = (view, label, cls = "") => h("button", { class: cls, "aria-expanded": String(sheetView === view),
    onclick: () => openSheet(sheetView === view ? "nothing" : view) }, label);
  $("chips").replaceChildren(...[
    plan().steps.length > 0 && chip("plan", state.serve_at ? `Eat ${atClock(state.serve_at * 1000)}` : "Plan", lateBy() > LATE_AFTER ? "late" : ""),
    plan().shown && chip("ingredients", "Ingredients", (state.cooks?.length || 1) > 1 && !viewing ? "" : "narrow"),
    carts.length > 0 && chip("shopping", filling ? "Shopping…" : "Shopping", filling ? "pending busy" : ""),
    state && chip("kitchen", "Kitchen", state.shopping.on && state.shopping.signed_in === false ? "pending" : ""),
  ].filter(Boolean));
}

const PLACES = [["fridge", "Fridge"], ["freezer", "Freezer"], ["pantry", "Pantry"], ["spices", "Spices"], ["tools", "Tools"]];

    const hero = pic(steps[0]?.dish || "Dinner", "dish");
    hero.classList.add("hero");
    view = [h("div", { class: "rail" }, h("article", { class: "ticket", "data-stamp": "ORDER UP" },
      h("p", { class: "slip" }, h("span", {}, "Pass"), h("span", { class: "n" }, atClock(state.finished_at * 1000))),
      hero, h("h1", {}, "Plates up."),
      h("div", { class: "act" }, h("button", { class: "early", onclick: () => { state.finished_at = null; state.steps = []; act("clear_finished"); render(); } }, "Done"))))];
  } else {
    const quiet = !$("said-you").textContent && !$("said-basil").textContent;
    view = busyWith ? [h("p", { class: "hint working" }, busyText())] : [quiet ? h("p", { class: "hint" }, hello()) : $("said")];
  }
  // Captions live above the mic, except when nothing is cooking and the conversation takes the middle.
  if (!view.includes($("said"))) $("voice").prepend($("said"));
  $("stage").replaceChildren(...view.filter(Boolean));
  // A how-to card takes the whole middle; otherwise the right column shows the step (its picture) and what it takes
  // (the ingredients), and the left is words and action.
  const stepView = shown && !how && !passView;
  ticketsUp = ticketsNow;
  $("stage").classList.toggle("wide", !!how || (!!shown && passView));
  keepTyping($("side"), () => $("side").replaceChildren(...[stepView && stepPicture(shown), stepView && ingredientList(shown.dish, shown.uses)].filter(Boolean)));
  if (stepView) $("stage").prepend(h("div", { class: "narrow-pic" }, stepPicture(shown)));
  renderChips();
  if (sheetView) renderSheet();
  renderTimers();
}

// Each step's picture: a real photo when one shows the step, otherwise a generated illustration (labelled as one).
const pictures = new Map(); // picture request URL -> promise of {url, illustration}
function picture(s) {
  const key = `/steppic?${new URLSearchParams({ dish: s.dish, title: s.title, text: s.text })}`;
  if (!pictures.has(key)) pictures.set(key, fetch(key).then((r) => r.json()).catch(() => ({ url: null })));
  return pictures.get(key);
}
// Asked for as soon as the plan exists, so stepping ahead never waits on a picture or clip being made.
function preloadPictures(steps) { steps.forEach(picture); }
function stepPicture(s) {
  const frame = h("figure", { class: "step-pic loading" }, h("span", { class: "wait" }, "Picturing it…"));
  picture(s).then(({ url, illustration }) => {
    if (!url) return frame.remove();
    const img = h("img", { src: url, alt: "" });
    img.onload = () => { frame.classList.remove("loading"); frame.replaceChildren(img, illustration && h("figcaption", {}, "Illustration")); };
    img.onerror = () => frame.remove();
  });
  return frame;
}

// ---------- showing how ----------
// "How do I use a moka pot?" answered the way a good cookbook would: numbered steps with a picture each (a clip when
// a step ends on something you have to see), the moment that matters moving at the top, and the one usual mistake.
function howToCard(how) {
  const hero = how.clip && stepPicture({ dish: how.topic, title: how.topic, text: how.clip });
  hero?.classList.add("hero-clip");
  const pinned = hero && h("div", { class: "pinned" }, hero);
  return [h("section", { class: "howto" },
    h("div", { class: "howto-top" },
      h("div", { class: "howto-head" },
        h("h1", {}, how.topic),
        how.watch_out && h("p", { class: "watch" }, h("b", {}, "Watch out"), h("span", {}, how.watch_out)),
        h("button", { class: "early", onclick: () => act("close_how") }, "Done")),
      pinned),
    // Rows that come out even: four steps side by side, otherwise three across (five or six make two rows).
    h("ol", { class: "howto-steps", style: `--cols: ${how.steps.length === 4 ? 4 : Math.min(how.steps.length, 3)}` }, how.steps.map((st, i) => h("li", {},
      stepPicture({ dish: how.topic, title: st.title, text: st.text }),
      h("h3", {}, h("span", { class: "n" }, String(i + 1).padStart(2, "0")), st.title),
      h("p", {}, st.text)))))];
}

// An instruction, made to scan: one sentence per line, with the numbers you act on (times, heat, sizes, amounts) in bold.
// Lines that tell you what to look for rather than what to do ("If it sticks…", "The skin should…") are lighter.
const CUE = /^(if|when|once|until|the|it|it's|they|you'll|you should|this)\b/i;
const MEASURE = /(\d+(?:[.,/]\d+)?(?:\s*(?:–|-|to)\s*\d+(?:[.,/]\d+)?)?\s*(?:°\s*[FC]?|degrees(?: [FC])?|minutes?|mins?|seconds?|hours?|inch(?:es)?|-inch|cm|mm|cups?|tbsp|tsp|tablespoons?|teaspoons?|oz|ounces?|g|grams?|kg|lbs?|pounds?|ml|l)\b|\d+\s*°)/g;
function instructionLines(text) {
  const sentences = text.trim().split(/(?<=[.!?])\s+(?=[A-Z])/);
  return h("div", { class: "instruction" }, sentences.map((line) =>
    h("p", { class: CUE.test(line) ? "cue" : false }, line.split(MEASURE).map((part, i) => (i % 2 ? h("b", {}, part) : part)))));
}

function stepCard(s, { alone = true, anyone = false, sameDish = false } = {}) {
  const running = s.status === "in_progress" && !s.hands_on;
  const due = s.status === "pending" && s.start === 0;
  let status = null;
  if (running) {
    status = h("p", { class: "countdown" }, h("span", { "data-until": stateAt + s.end * 60000, "data-clock": "" }));
  } else if (s.status === "done") {
    status = h("p", { class: "then" }, checkmark());
  } else if (s.status === "pending" && s.start > 0) {
    status = h("p", { class: "then" }, h("span", { "data-until": stateAt + s.start * 60000, "data-in": "" }));
  }
  // Work in hand is finished with Done; something that cooks by itself is started (its timer starts with it).
  // A step that's due later but has nothing left to wait on can be done ahead, the way prep gets done early.
  // Either way the ticket gets stamped first, a beat before the next one hangs.
  const step = (status) => (e) => stamp(e.currentTarget.closest(".ticket"), status === "done" ? "DONE" : "FIRED", () => act("step", { step_id: s.id, status }));
  let button = null;
  if (s.status === "in_progress" || (due && s.hands_on)) button = h("button", { class: "done", onclick: step("done") }, "Done");
  else if (due) button = h("button", { class: "done", onclick: step("started") }, "Start");
  else if (s.status === "pending" && unblocked(s)) button = h("button", { class: "early", onclick: step("started") }, "Start");
  else if (s.status === "done") button = h("button", { class: "early", onclick: () => act("step", { step_id: s.id, status: "not_started" }) }, "Undo");
  const mine = state.steps.filter((x) => x.dish === s.dish);
  const fresh = !ticketsUp.has(s.id);
  ticketsNow.add(s.id);
  return [
    h("div", { class: "rail" }, h("article", { class: `ticket${fresh ? " fresh" : ""}`, "data-stamp": s.status === "done" ? "DONE" : running ? "FIRED" : false },
      h("p", { class: "slip" }, anyone ? h("span", { class: "who" }, "Anyone") : cookName(s) && whoTag(s),
        !alone && !sameDish && h("span", { class: "dish", title: s.dish }, s.dish), !alone && sameDish && h("span", { class: "dish" }),
        h("span", {}, hours(s.minutes)),
        h("span", { class: "n" }, `${stepNumber(s, state.steps)}/${mine.length}`)),
      !alone && stepPicture(s), // alone, the picture has the side column; in the pass, each ticket carries its own
      h("div", { class: "head" }, h("h1", {}, s.title)),
      !sameWords(s.text, s.title) && instructionLines(s.text),
      status,
      button && h("div", { class: "act" }, button))),
    alone && meanwhile(s),
    alone && upNext(s),
  ];
}

// While something cooks by itself (the oven heating, a braise), or nothing is due yet, the next few things across every
// dish, with when: so the wait shows what it's for, and a step can be opened and started early.
// In the pass (no `shown`), always: what comes after the tickets, and whose it is.
function upNext(shown, onTickets = []) {
  const { open, hands } = plan();
  if (shown) {
    const waiting = shown.status === "in_progress" ? !shown.hands_on : shown.status === "pending" && shown.start > 0;
    if (viewing || !waiting) return null;
  }
  const skip = new Set([shown, ...hands, ...onTickets]);
  const next = open.filter((s) => !skip.has(s) && s.status === "pending").sort((a, b) => a.start - b.start).slice(0, 3);
  if (!next.length) return null;
  const many = new Set(state.steps.map((s) => s.dish)).size > 1;
  return h("ul", { class: "meanwhile next" }, next.map((s) => h("li", {},
    h("button", { onclick: () => { viewing = s.id; render(); } },
      h("small", {}, s.start > 0 ? h("span", { "data-until": stateAt + s.start * 60000, "data-in": "" }) : "now"),
      many && h("i", { class: "dot", style: `background: ${dishColor(s.dish)}`, title: s.dish }),
      cookName(s) && whoTag(s),
      h("span", {}, s.title)))));
}

// With more than one cook, the screen is the pass: a ticket for each cook's station, side by side, each with its own
// Done, and one for anything that just needs starting (the oven, a pot of water). No tapping across to someone else's.
// A free cook gets their next step only if they could start it now: one further down a chain still being worked on
// (turn the sausages, while they're not on yet) isn't theirs yet; it's in the list below. No tickets, no pass.
function stations() {
  const { open, hands } = plan();
  const ready = open.filter((s) => s.status === "pending" && s.start === 0);
  const nextFor = (i) => open.filter((s) => s.hands_on && s.status === "pending" && (s.cook ?? 0) === i && unblocked(s)).sort((a, b) => a.start - b.start)[0];
  const theirs = hands.map((s, i) => s || nextFor(i)).filter(Boolean);
  const anyone = ready.filter((s) => !s.hands_on && !theirs.includes(s)).slice(0, 1);
  if (!theirs.length && !anyone.length) return null;
  // The dish goes on each ticket only when they're for different dishes; otherwise the top bar says it once.
  const sameDish = new Set([...theirs, ...anyone].map((s) => s.dish)).size === 1;
  const pass = h("div", { class: "pass" },
    ...theirs.flatMap((s) => stepCard(s, { alone: false, sameDish })),
    ...anyone.flatMap((s) => stepCard(s, { alone: false, anyone: true, sameDish })));
  return [pass, upNext(null, [...theirs, ...anyone])];
}
// An instruction that only repeats its heading ("Bloom the gelatin." under "Bloom the gelatin") says nothing.
const sameWords = (a, b) => a.toLowerCase().replace(/[^a-z0-9]+/g, "") === b.toLowerCase().replace(/[^a-z0-9]+/g, "");
// Which tickets are up, so a new one hangs and a redraw of the same one doesn't.
let ticketsUp = new Set(), ticketsNow = new Set();
// Stamp a ticket, then do the thing: the stamp is the feedback, the next ticket the result.
function stamp(ticket, word, then) {
  if (!ticket || ticket.dataset.stamp) return then();
  ticket.dataset.stamp = word;
  ticket.classList.add("stamping");
  setTimeout(then, matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 450);
}

// With more than one cook, what everyone else has in hand, so nobody has to ask.
function meanwhile(shown) {
  const { hands } = plan();
  if (state.cooks.length < 2) return null;
  const mine = shown.hands_on ? shown.cook ?? 0 : -1; // the cook whose step is on screen is already covered
  const others = hands.map((s, i) => ({ s, i, who: state.cooks[i] })).filter(({ s, i }) => s && s !== shown && i !== mine);
  if (!others.length) return null;
  return h("ul", { class: "meanwhile" }, others.map(({ s, who }) => h("li", {},
    h("button", { onclick: () => { viewing = s.id; render(); } }, whoTag(s), h("span", {}, s.title)))));
}

// ---------- timers ----------
// Twelve ticks round a knob, like the numbers on an oven dial.
const TICKS = () => Array.from({ length: 12 }, (_, i) => {
  const a = (i / 12) * 2 * Math.PI, x = (r) => 54 + r * Math.sin(a), y = (r) => 54 - r * Math.cos(a);
  return svg("line", { class: "tick", x1: x(52), y1: y(52), x2: x(i % 3 ? 53.5 : 55), y2: y(i % 3 ? 53.5 : 55) });
});
function dial(t) {
  const left = t.seconds_left, until = stateAt + left * 1000;
  const ring = svg("circle", { class: "ring", cx: 54, cy: 54, r: R, "stroke-dasharray": CIRC, transform: "rotate(-90 54 54)",
    "stroke-dashoffset": CIRC * (1 - Math.max(0, Math.min(1, left / (t.seconds || 1)))) });
  // A paused dial holds its time and doesn't tick.
  const attrs = t.paused ? { class: "dial paused" } : { class: "dial", "data-until": until, "data-total": t.seconds };
  attrs.style = `--turn: ${360 * Math.max(0, Math.min(1, left / (t.seconds || 1)))}deg`;
  return h("div", attrs,
    h("button", { class: "face", "aria-label": `${t.paused ? "Resume" : "Pause"} ${t.label}`, title: t.paused ? "Tap to resume" : "Tap to pause",
      onclick: () => act("timer", { label: t.label, change: t.paused ? "resume" : "pause" }) },
      svg("svg", { viewBox: "0 0 108 108", "aria-hidden": "true" }, ...TICKS(), svg("circle", { class: "track", cx: 54, cy: 54, r: R }), ring),
      h("b", {}, clock(left))),
    h("span", {}, words(t.label)));
}

function renderTimers() {
  const rung = [...rang.entries()].map(([label, r]) => h("div", { class: "dial rang" },
    h("div", { class: "face" }, h("b", {}, "Time")),
    h("span", {}, words(label)),
    h("div", { class: "ctl" },
      h("button", { "aria-label": "One more minute", onclick: () => { rang.delete(label); act("timer_again", { label, minutes: 1 }); renderTimers(); } }, "+1 min"),
      h("button", { class: "primary", onclick: () => {
        rang.delete(label);
        if (r.step_id) act("step", { step_id: r.step_id, status: "done" });
        renderTimers();
      } }, "Done"))));
  // Dials for timers that are running; a queued one sits beside the timer it follows, with its whole time.
  const timers = (state?.timers || []).filter((t) => t.kind !== "reminder");
  const queued = (label) => timers.filter((t) => t.follows === label).flatMap((t) =>
    [h("div", { class: "queued", title: `Starts when ${words(label).toLowerCase()} goes off` },
      h("span", {}, "then"), h("b", {}, clock(t.seconds)), h("span", {}, words(t.label))), ...queued(t.label)]);
  const running = timers.filter((t) => !t.follows).flatMap((t) => [dial(t), ...queued(t.label)]);
  $("timers").replaceChildren(...rung, ...running);
  tick();
}

function ring(label) {
  const step_id = (state?.timers || []).find((t) => t.label === label)?.step_id || null;
  rang.set(label, { at: Date.now(), step_id });
  // One soft two-note chime; Basil says what to do, so the sound only has to turn heads.
  [[660, 0], [880, 0.18]].forEach(([freq, delay]) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + delay;
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 1);
  });
  renderTimers();
}

// Dials and countdowns tick in place so buttons are never rebuilt under a finger.
function tick() {
  const now = Date.now();
  for (const el of document.querySelectorAll(".dial[data-until]")) {
    const left = (el.dataset.until - now) / 1000, total = Number(el.dataset.total) || 1;
    el.querySelector("b").textContent = clock(left);
    el.querySelector(".ring").setAttribute("stroke-dashoffset", CIRC * (1 - Math.max(0, Math.min(1, left / total))));
    el.style.setProperty("--turn", `${360 * Math.max(0, Math.min(1, left / total))}deg`);
    el.classList.toggle("soon", left < 30);
  }
  for (const el of document.querySelectorAll("[data-now]")) el.textContent = atClock(now);
  if (now % 2000 < 1000) for (const el of document.querySelectorAll("img[data-live]")) el.src = `/shopper-frame?${now}`;
  for (const el of document.querySelectorAll("[data-until]:not(.dial)")) {
    const s = (el.dataset.until - now) / 1000;
    el.textContent = "in" in el.dataset ? `in ${hours(s / 60)}` : clock(s);
  }
}
setInterval(tick, 1000);
pilot("asleep", "");
if (stayConnected()) wake(true); // last, once everything it touches exists
</script>
</body>
</html>
