<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='%232e6ed8'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&display=swap">
<style>
  /* Layout: a cookbook page on an appliance. The plan runs across the top, the step you're on reads like a recipe on
     the left with its ingredients beside it, and timers, captions and the mic sit along the bottom. */
  :root {
    --enamel: #e2e9da; --ink: #16201a; --muted: #6b7b6d; --rule: #c5d1be; --knob: #eef3ea;
    --flame: #2e6ed8; --glow: #e3862a; --hot: #d4412a; --hot-soft: #f6dfd6;
    --display: "Bricolage Grotesque", ui-rounded, "Avenir Next", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --enamel: #111814; --ink: #e4ece0; --muted: #879889; --rule: #25312a; --knob: #18211c;
      --flame: #6f9cff; --glow: #f0a14e; --hot: #ff6a4f; --hot-soft: #3a1f19; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --enamel: #111814; --ink: #e4ece0; --muted: #879889; --rule: #25312a; --knob: #18211c;
    --flame: #6f9cff; --glow: #f0a14e; --hot: #ff6a4f; --hot-soft: #3a1f19; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--enamel); color: var(--ink); font-family: var(--display);
    display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 28px;
    padding-block: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-bottom));
    padding-inline: clamp(16px, 5vw, 64px); user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--flame); outline-offset: 3px; border-radius: 12px; }
  [hidden] { display: none !important; }
  .kicker { margin: 0; font-size: 15px; color: var(--muted); }

  /* Picture tiles: shown only once a photo is found. */
  .pic { flex: none; width: var(--size, 40px); height: var(--size, 40px); border-radius: 10px; overflow: hidden; }
  .pic img { width: 100%; height: 100%; object-fit: contain; }
  .pic.photo img { object-fit: cover; }

  /* ---------- top: the dish, its steps, and the way into everything else ---------- */
  header { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 28px; align-items: center; min-height: 44px; }
  #dish { display: flex; gap: 12px; align-items: center; --size: 44px; }
  #dish b { font-size: 18px; line-height: 1.1; max-width: 14em; }
  #strip { list-style: none; margin: 0; padding: 4px; display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; justify-content: center; }
  #strip li.group { align-self: center; padding: 0 2px 0 12px; }
  #strip li.group:first-child { padding-left: 0; }
  #strip button { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; font-weight: 500;
    font-variant-numeric: tabular-nums; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--rule); transition: background .2s, color .2s; }
  #strip button:hover { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--muted); }
  #strip button svg { width: 14px; height: 14px; }
  #strip [data-state="done"] button { box-shadow: none; }
  #strip [data-state="running"] button { color: var(--ink); box-shadow: inset 0 0 0 2px var(--glow); }
  #strip [data-state="now"] button { background: var(--ink); color: var(--enamel); box-shadow: none; }
  #strip .viewing button { box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); }
  #chips { display: flex; gap: 8px; }
  #chips button { padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 500; color: var(--muted);
    box-shadow: inset 0 0 0 1.5px var(--rule); display: flex; gap: 8px; align-items: center; white-space: nowrap; }
  #chips button:hover, #chips button[aria-expanded="true"] { color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  #chips .pending::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--glow); }
  #chips .busy::before { animation: flicker 1.2s ease-in-out infinite; }

  /* ---------- middle: the step, read like a recipe, and the ingredient list beside it ---------- */
  #work { display: grid; grid-template-columns: minmax(0, 1fr) minmax(280px, 360px); gap: clamp(32px, 6vw, 88px); align-items: center; min-height: 0; }
  #stage { display: grid; gap: 22px; align-content: center; grid-auto-rows: max-content; min-height: 0; max-width: 760px; }
  /* max-content rows: in a height-limited grid, the clipped picture frame would otherwise shrink and overlap the list. */
  #side { align-self: stretch; overflow-y: auto; min-height: 0; display: grid; gap: 22px; align-content: safe center; grid-auto-rows: max-content;
    padding-bottom: 28px; -webkit-mask-image: linear-gradient(to top, transparent, #000 28px); mask-image: linear-gradient(to top, transparent, #000 28px); scrollbar-width: none; }
  .narrow-pic { display: none; }
  #side .step-pic { width: 100%; }
  #side:empty { display: none; }
  h1 { margin: 0; font-weight: 700; font-size: clamp(36px, 4.8vw, 64px); line-height: 1; letter-spacing: -.03em; text-wrap: balance; font-variation-settings: "opsz" 96; }
  .instruction { margin: 0; max-width: 30ch; font-size: clamp(22px, 2.3vw, 30px); line-height: 1.3; text-wrap: pretty; font-variation-settings: "opsz" 24; }
  div.instruction { display: grid; gap: .55em; }
  div.instruction p { margin: 0; }
  div.instruction b { font-weight: 700; }
  div.instruction .cue { color: var(--muted); }
  .head { display: grid; gap: 12px; }
  .countdown { margin: 0; font-size: clamp(34px, 3.6vw, 46px); line-height: 1; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  .countdown small { font: 400 16px var(--display); color: var(--muted); letter-spacing: 0; margin-left: 10px; }
  .act { display: flex; gap: 20px; align-items: center; flex-wrap: wrap; margin-top: 6px; }
  .done { padding: 18px 44px; border-radius: 999px; background: var(--ink); color: var(--enamel); font-weight: 700; font-size: 20px; transition: transform .12s; }
  .done:active { transform: scale(.96); }
  .then { margin: 0; font-size: 17px; color: var(--muted); }
  .then svg { width: 28px; height: 28px; }
  .choices { display: flex; gap: 12px; flex-wrap: wrap; }
  .choices button, .choices a { padding: 18px 34px; border-radius: 999px; font-weight: 700; font-size: 20px; text-decoration: none; box-shadow: inset 0 0 0 2px var(--ink); }
  .choices .yes { background: var(--ink); color: var(--enamel); }
  .hero { --size: 180px; border-radius: 24px; }
  .hero[hidden] { display: none; }
  /* The step's picture: room is held for it while it's being found or made, so the text doesn't jump. */
  .step-pic { position: relative; margin: 0; width: min(100%, 420px); aspect-ratio: 3 / 2; border-radius: 18px; overflow: hidden; background: var(--knob); }
  .step-pic img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .step-pic.loading { animation: flicker 1.8s ease-in-out infinite; }
  .step-pic figcaption { position: absolute; right: 12px; bottom: 10px; font-size: 12px; color: rgb(255 255 255 / .85); text-shadow: 0 1px 3px rgb(0 0 0 / .5); }

  /* Ingredient list, cookbook style: amount first. Only what you're missing is marked, and gathered at the top. */
  .recipe { display: grid; gap: 14px; }
  .recipe h2 { margin: 0; font-size: 20px; letter-spacing: -.01em; }
  .recipe ul { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: fit-content(40%) minmax(0, 1fr); column-gap: 16px; row-gap: 10px; }
  .recipe li { display: grid; grid-column: 1 / -1; grid-template-columns: subgrid; align-items: baseline; font-size: 16px; line-height: 1.35; color: var(--muted); }
  .recipe li .amt { font-variant-numeric: tabular-nums; }
  .recipe li.now { color: var(--ink); font-weight: 500; }
  .recipe li.out .name { color: var(--hot); }
  .recipe .get { justify-self: start; padding: 9px 16px; border-radius: 999px; font-weight: 500; font-size: 15px; box-shadow: inset 0 0 0 1.5px var(--hot); color: var(--hot); }

  /* Nothing cooking: the conversation is the content, so it takes the middle of the screen, on the mic's axis. */
  #work:has(> #side:empty) { grid-template-columns: minmax(0, 1fr); }
  #stage:has(> #said, > .hint) { justify-self: center; justify-items: center; text-align: center; }
  #stage > #said { gap: 14px; max-width: min(100%, 900px); }
  #stage > #said .line { max-height: none; -webkit-mask-image: none; mask-image: none; }
  #stage > #said .you { font-size: clamp(18px, 2vw, 22px); }
  #stage > .hint { margin: 0; font-size: clamp(26px, 3.2vw, 40px); line-height: 1.3; letter-spacing: -.01em; color: var(--muted); max-width: 18em; }
  #stage > #said .basil { font-size: clamp(26px, 3.2vw, 40px); line-height: 1.3; letter-spacing: -.01em; }

  /* ---------- bottom: timers on the left, the voice in the middle: what was said, above the mic ---------- */
  footer { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 28px; align-items: end; }
  #voice { display: grid; justify-items: center; gap: 14px; }
  #voice > #said { width: min(560px, 44vw); text-align: center; }
  #said { display: grid; gap: 4px; min-width: 0; }
  .said { margin: 0; display: grid; font-size: 17px; line-height: 1.4; color: var(--muted); }
  .said .line { max-height: 2.8em; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 1.1em); mask-image: linear-gradient(to bottom, transparent 0, #000 1.1em); }
  .said .line:has(> span:only-child) { -webkit-mask-image: none; mask-image: none; }
  .said.basil .line { color: var(--ink); }
  .said .line i { font-style: normal; animation: appear .35s ease-out; }
  footer .said.you:not(.live) { display: none; }
  .said.pondering .line { color: var(--muted); animation: flicker 1.6s ease-in-out infinite; }
  @keyframes appear { from { opacity: 0; } }

  #mic { display: grid; justify-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  #mic .disc { width: 72px; height: 72px; border-radius: 50%; display: grid; place-items: center; background: var(--knob); color: var(--ink); transition: background .3s, color .3s, box-shadow .3s, transform .15s; }
  #mic svg { width: 28px; height: 28px; }
  #mic-word:empty { display: none; }
  #mic-word { max-width: 18em; text-align: center; }
  #mic .slash { display: none; }
  #mic[data-mode="listening"] .disc { background: var(--flame); color: var(--enamel); box-shadow: 0 0 0 6px color-mix(in srgb, var(--flame) 16%, transparent); }
  #mic[data-mode="you"] .disc { background: var(--flame); color: var(--enamel); transform: scale(1.06); box-shadow: 0 0 0 11px color-mix(in srgb, var(--flame) 22%, transparent); }
  #mic[data-mode="thinking"] .disc { background: var(--glow); color: var(--enamel); animation: flicker 1.4s ease-in-out infinite; }
  #mic[data-mode="talking"] .disc { background: var(--glow); color: var(--enamel); animation: glow .8s ease-in-out infinite alternate; }
  #mic[data-mode="off"] .disc { box-shadow: inset 0 0 0 2px var(--muted); color: var(--muted); }
  #mic[data-mode="off"] .slash { display: inline; }
  /* Before the conversation starts: a plain, still button. Blue and motion mean Basil is listening, so neither shows yet. */
  #mic[data-mode="asleep"] .disc { box-shadow: inset 0 0 0 2px var(--ink); }
  #mic[data-mode="asleep"]:hover .disc { background: var(--ink); color: var(--enamel); }
  #mic[data-mode="asleep"]:active .disc { transform: scale(.94); }
  @keyframes flicker { 50% { opacity: .45; } }
  @keyframes glow { to { box-shadow: 0 0 0 9px color-mix(in srgb, var(--glow) 25%, transparent); } }

  /* Timer dials: the dial is the control (tap to pause); a rung one asks the only two questions left. */
  #timers { display: flex; flex-wrap: wrap; gap: 16px; min-width: 0; }
  .dial { display: grid; justify-items: center; gap: 6px; width: 108px; }
  .dial .face { position: relative; width: 108px; height: 108px; border-radius: 50%; display: grid; place-items: center; transition: transform .12s; }
  .dial button.face:active { transform: scale(.96); }
  .dial svg { position: absolute; inset: 0; }
  .dial .track { fill: none; stroke: var(--rule); stroke-width: 3; }
  .dial .ring { fill: none; stroke: var(--glow); stroke-width: 3; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .dial b { position: relative; font-size: 24px; font-weight: 500; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .dial > span { font-size: 14px; color: var(--muted); text-align: center; line-height: 1.2; }
  .dial.soon .ring { stroke: var(--hot); }
  .dial.soon b { color: var(--hot); }
  .dial.paused .face { opacity: .6; }
  .dial.paused b::after { content: "paused"; display: block; font-size: 12px; font-weight: 400; text-align: center; color: var(--muted); }
  .dial.rang .face { background: var(--hot); color: var(--enamel); }
  .dial.rang .face b { font: 700 18px var(--display); }
  .dial .ctl { display: flex; gap: 6px; white-space: nowrap; }
  .dial .ctl button { padding: 6px 12px; border-radius: 999px; font-size: 14px; font-weight: 500; box-shadow: inset 0 0 0 1.5px var(--rule); }
  .dial .ctl button.primary { background: var(--ink); color: var(--enamel); box-shadow: none; }

  /* ---------- sheets ---------- */
  #sheet { position: fixed; z-index: 3; top: calc(max(20px, env(safe-area-inset-top)) + 64px); right: clamp(16px, 5vw, 64px);
    width: min(560px, calc(100% - 32px)); max-height: calc(100% - 220px); background: var(--knob); border-radius: 22px; padding: 22px 24px; overflow-y: auto;
    box-shadow: 0 18px 50px color-mix(in srgb, var(--ink) 22%, transparent); display: grid; align-content: start; gap: 22px; animation: slide .2s ease-out; }
  @keyframes slide { from { transform: translateX(16px); opacity: 0; } }
  #sheet .top { display: flex; justify-content: space-between; align-items: baseline; }
  #sheet h2 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  #sheet .top button { font-size: 20px; line-height: 1; color: var(--muted); padding: 6px; }
  #sheet .top button:hover { color: var(--ink); }
  #sheet section { display: grid; gap: 10px; }
  #sheet p { margin: 0; line-height: 1.45; }
  #sheet .unknown { color: var(--muted); }
  #sheet .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  #sheet .row button { padding: 0; font-size: 15px; color: var(--muted); }
  #sheet .row button:hover { color: var(--hot); }
  #sheet .clear { justify-self: start; padding: 9px 16px; border-radius: 999px; font-size: 15px; color: var(--muted); box-shadow: inset 0 0 0 1.5px var(--rule); transition: background .2s, color .2s; }
  #sheet .clear:hover { color: var(--hot); box-shadow: inset 0 0 0 1.5px var(--hot); }
  #sheet .clear.armed { background: var(--hot); color: var(--enamel); box-shadow: none; }
  #sheet .recipe h2 { display: none; }
  /* Each shelf, a short list: name, and how much. */
  .shelf { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .stock { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .stock b { font-size: 16px; font-weight: 400; }
  .stock span { font-size: 15px; color: var(--muted); }
  .stock.out b, .stock.out span { color: var(--hot); }
  .order { display: grid; gap: 2px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
  .order:last-child { border: 0; }
  .order b { font-size: 18px; }
  .meta { font-size: 15px; color: var(--muted); }
  .open.small { justify-self: start; margin-top: 6px; padding: 6px 14px; border-radius: 999px; font-weight: 600; font-size: 14px; text-decoration: none; background: var(--ink); color: var(--knob); }

  /* When the strip can't fit every title, keep the one you're on (or looking at) and show numbers for the rest. */
  @media (max-width: 900px) {
    header { grid-template-columns: auto auto; gap: 14px; }
    #chips { justify-self: end; }
    #strip { grid-column: 1 / -1; grid-row: 2; }
    #work { grid-template-columns: 1fr; align-items: start; overflow-y: auto; }
    #stage { align-content: start; }
    .narrow-pic { display: block; }
    /* Short on a phone, so the heading and instruction still show above the pinned Done. */
    .step-pic { width: 100%; aspect-ratio: 5 / 2; }
    /* The one thing to do stays on screen however long the step is. */
    .act { position: sticky; bottom: 0; padding-block: 12px 4px; background: var(--enamel); }
    #timers { flex-wrap: nowrap; overflow-x: auto; }
    #side { display: none; }
    #voice { display: contents; }
    #voice > #said { grid-column: 1 / -1; grid-row: 1; width: auto; text-align: left; }
    #mic { grid-column: 3; grid-row: 2; justify-self: end; }
    #timers { grid-column: 1 / 3; grid-row: 2; }
    #sheet { top: auto; bottom: 16px; left: 16px; right: 16px; width: auto; max-height: 76%; animation-name: rise; }
    @keyframes rise { from { transform: translateY(16px); opacity: 0; } }
  }
  @media (min-width: 901px) { #chips .narrow { display: none; } }
  @media (max-width: 640px) {
    /* A phone's height goes to the step: smaller dials, only Basil's line in the captions, Done alone in the pinned bar. */
    #dish b { font-size: 16px; }
    .done { width: 100%; }
    .said.you { display: none; }
    body { gap: 14px; }
    .dial { width: 72px; } .dial .face { width: 72px; height: 72px; } .dial b { font-size: 15px; } .dial > span { font-size: 12px; }
    #mic .disc { width: 60px; height: 60px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <div id="dish"></div>
  <ol id="strip" aria-label="Steps"></ol>
  <nav id="chips" aria-label="More"></nav>
</header>
<aside id="sheet" hidden></aside>
<div id="work">
  <main id="stage"></main>
  <div id="side"></div>
</div>
<footer>
  <div id="timers"></div>
  <div id="voice">
  <div id="said">
    <p class="said you" hidden><span class="line"><span id="said-you"></span></span></p>
    <p class="said basil" hidden><span class="line"><span id="said-basil"></span></span></p>
  </div>
  <button id="mic" data-mode="asleep" aria-label="Talk to Basil">
    <span class="disc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
      <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/><path class="slash" d="M4 4l16 16"/>
    </svg></span>
    <span id="mic-word"></span>
  </button>
  </div>
</footer>

<script>
const $ = (id) => document.getElementById(id);
// Text always goes in via textContent, so nothing the model writes can inject markup.
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    k.startsWith("on") ? el.addEventListener(k.slice(2), v) : el.setAttribute(k, v === true ? "" : v);
  }
  el.append(...kids.flat().filter((k) => k != null && k !== false));
  return el;
}
function svg(tag, attrs = {}, ...kids) {
  const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
  el.append(...kids);
  return el;
}

const RATE = 16000, FRAME = 320; // 20 ms frames; the API rejects chunks over 40 ms
const R = 48, CIRC = 2 * Math.PI * R; // dial ring radius, inside a 108 px face
let ws = null, screen = null, ctx, mic, muted = false, state = null, stateAt = 0;
let talking = false, hearing = false, thinking = false, consulting = false, playhead = 0;
const playing = new Set();
const rang = new Map(); // timer label -> {at, step_id}
let closedBecause = ""; // Phonic's reason for ending the conversation, when it gives one
let viewing = null; // id of a step the cook is looking ahead (or back) at; null follows the current step

// ---------- connection, audio ----------
// Two connections: the screen's own, always open, which shows the saved kitchen and takes taps; and the conversation
// with Basil, which starts only from the mic. While a conversation is open, it carries both.
function connectScreen() {
  screen = new WebSocket(`ws://${location.host}/ws?talk=0`);
  screen.onopen = refresh;
  screen.onmessage = (e) => { if (!ws) onEvent(JSON.parse(e.data)); };
  screen.onclose = () => setTimeout(connectScreen, 1000);
}
function refresh() { if (screen?.readyState === 1) screen.send(JSON.stringify({ type: "refresh" })); }
connectScreen();

async function wake() {
  if (ws) return;
  ctx ||= new AudioContext({ sampleRate: RATE });
  muted = false;
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onmessage = (e) => onEvent(JSON.parse(e.data));
  ws.onclose = () => {
    // Back to asleep: the next tap starts a fresh conversation, which picks up where this one left off.
    ws = null; talking = hearing = thinking = consulting = false; hush();
    recognizer?.abort(); mic?.getTracks().forEach((t) => t.stop()); mic = null;
    pilot("asleep", closedBecause); closedBecause = "";
    refresh();
  };
  pilot("listening", "");
  try { await startMic(); startDictation(); } catch { pilot("off", "No microphone"); }
}

let worklet = null;
async function startMic() {
  mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  const src = `registerProcessor("mic", class extends AudioWorkletProcessor {
    constructor() { super(); this.buf = new Int16Array(${FRAME}); this.n = 0; }
    process([input]) {
      for (const s of input[0] || []) {
        this.buf[this.n++] = Math.max(-1, Math.min(1, s)) * 0x7fff;

// ---------- the plan ----------
const READY_FOR_MS = 60 * 60 * 1000;

  const open = steps.filter((s) => s.status !== "done");
  // The step for the cook's hands: hands-on work ready now, else anything ready now, else whatever is running.
  const ready = open.filter((s) => s.status === "pending" && s.start === 0);
  const current = ready.find((s) => s.hands_on) || ready[0];

      return h("li", { "data-state": at, class: s === shown && s !== current ? "viewing" : false },
        h("button", { title: s.title, onclick: () => { viewing = s === current ? null : s.id; render(); } },

  ]).filter(Boolean));

  let view;

  } else if (fresh) {

      h("div", { class: "choices" }, link(cartUrl(fresh), "Review", "yes", fresh.at),

    h("div", { class: "ctl" },
      h("button", { "aria-label": "One more minute", onclick: () => { rang.delete(label); act("timer_again", { label, minutes: 1 }); renderTimers(); } }, "+1 min"),
      h("button", { class: "primary", onclick: () => {
        rang.delete(label);
        if (r.step_id) act("step", { step_id: r.step_id, status: "done" });
        renderTimers();
      } }, "Done"))));
  const running = (state?.timers || []).map(dial);
  $("timers").replaceChildren(...rung, ...running);
  tick();
}

function ring(label) {
  const step_id = (state?.timers || []).find((t) => t.label === label)?.step_id || null;
  rang.set(label, { at: Date.now(), step_id });
  // One soft two-note chime; Basil says what to do, so the sound only has to turn heads.
  [[660, 0], [880, 0.18]].forEach(([freq, delay]) => {
    const o = ctx.createOscillator(), g = ctx.createGain(), t = ctx.currentTime + delay;
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.12, t + 0.03); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 1);
  });
  renderTimers();
}

// Dials and countdowns tick in place so buttons are never rebuilt under a finger.
function tick() {
  const now = Date.now();
  for (const el of document.querySelectorAll(".dial[data-until]")) {
    const left = (el.dataset.until - now) / 1000, total = Number(el.dataset.total) || 1;
    el.querySelector("b").textContent = clock(left);
    el.querySelector(".ring").setAttribute("stroke-dashoffset", CIRC * (1 - Math.max(0, Math.min(1, left / total))));
    el.classList.toggle("soon", left < 30);
  }
  for (const el of document.querySelectorAll("[data-until]:not(.dial)")) {
    const s = (el.dataset.until - now) / 1000;
    el.textContent = "in" in el.dataset ? `in ${hours(s / 60)}` : clock(s);
  }
}
setInterval(tick, 1000);
</script>
</body>
</html>
