<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 15C3 13 2 7 4 3c3 0 9 2 9 7 0 3-2 5-5 5z' fill='%232f8f5b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800;900&display=swap">
<style>
  /* The stove, as a toy: the cook's own range seen from the front and a little above, with pots in each dish's
     colour on the burners it's using, the oven's window lit when something's in it, and the counter beside it. The
     card on the left is the one thing to do now; the marker over the stove shows where. Basil is the leaf. */
  :root {
    --bg: #efe5d3; --wall: #f3ebdd; --tile: #e7dcc8; --floor: #dccdb3;
    --top: #fffaf2; --ink: #211b14; --muted: #8b7f6d; --line: #eadfcd; --line-2: #d3c4ab;
    --enamel: #2f8f5b; --enamel-hi: #48ad74; --enamel-lo: #1f6a42; --steel: #22251f; --steel-2: #30342d; --grate: #45493f;
    --chrome: #e4e6e1; --chrome-lo: #a9ada5; --wood: #dfae72; --wood-lo: #b9834a; --cab: #f6efe2; --cab-lo: #dccfb8;
    --flame: #3f7bff; --flame-2: #a9c4ff; --hot: #ff8a2a; --alarm: #ee3d2c; --gold: #ffc23a;
    --go: #2f8f5b; --go-lo: #1d6a40;
    --d0: #f0692c; --d1: #2f6fd6; --d2: #f3b928; --d3: #d63a63; --d4: #8a5cdc; --d5: #17a2a0; --d6: #ef8fb2; --d7: #a06c42;
    --c0: #ff5a4e; --c1: #3d8bff; --c2: #ffb81f; --c3: #a96bff;
    --display: "Rubik", ui-rounded, "Avenir Next", system-ui, sans-serif;
    --mono: "Rubik", ui-rounded, system-ui, sans-serif;
    --ease: cubic-bezier(.2, .9, .25, 1); --spring: cubic-bezier(.34, 1.56, .5, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11141c; --wall: #151924; --tile: #1b2030; --floor: #0b0d13;
      --top: #1d2230; --ink: #f4efe6; --muted: #8f97aa; --line: #2a3043; --line-2: #3b4360;
      --cab: #262c3c; --cab-lo: #1b2030; --chrome: #c9ccd3; --chrome-lo: #7f8492;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11141c; --wall: #151924; --tile: #1b2030; --floor: #0b0d13;
    --top: #1d2230; --ink: #f4efe6; --muted: #8f97aa; --line: #2a3043; --line-2: #3b4360;
    --cab: #262c3c; --cab-lo: #1b2030; --chrome: #c9ccd3; --chrome-lo: #7f8492;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden;
    display: grid; grid-template-columns: minmax(340px, 4fr) minmax(0, 7fr); grid-template-rows: auto minmax(0, 1fr) auto;
    column-gap: clamp(16px, 3vw, 48px);
    padding-block: max(16px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-bottom));
    padding-inline: clamp(16px, 3vw, 44px); user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, a:focus-visible { outline: 3px solid var(--flame); outline-offset: 4px; border-radius: 14px; }
  [hidden] { display: none !important; }

  /* ---------- top: the wordmark and the ways into everything else ---------- */
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; min-height: 48px; position: relative; z-index: 2; }
  .wordmark { display: flex; align-items: center; gap: 8px; font-size: 26px; font-weight: 900; letter-spacing: -.04em; }
  .wordmark svg { width: 26px; height: 26px; }
  nav { margin-left: auto; display: flex; gap: 8px; }
  /* How far through dinner: one segment per step, filling in each dish's colour, like a level's progress bar. */
  #track { margin: 0 auto; display: flex; align-items: center; gap: 14px; height: 40px; padding: 0 16px; border-radius: 999px; background: var(--top);
    box-shadow: 0 3px 0 var(--line-2); width: min(560px, 46vw); }
  #track:hover { transform: translateY(-1px); }
  #track .segs { flex: 1; display: flex; gap: 4px; height: 14px; }
  #track .seg { flex: 1; border-radius: 5px; background: color-mix(in srgb, var(--ink) 10%, transparent); position: relative; overflow: hidden; }
  #track .seg.done { background: var(--dish); box-shadow: inset 0 -3px 0 rgb(0 0 0 / .18); }
  #track .seg.now { background: color-mix(in srgb, var(--dish) 35%, transparent); }
  #track .seg.now::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, var(--dish) 0 5px, transparent 5px 10px); animation: slide 1s linear infinite; background-size: 28px 100%; }
  #track .seg.pop { animation: seg-pop .6s var(--spring); }
  @keyframes slide { to { background-position: 28px 0; } }
  @keyframes seg-pop { 40% { transform: scaleY(1.8); } }
  #track b { font-weight: 800; font-size: 15px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  #track small { font-weight: 600; font-size: 13px; color: var(--muted); }
  #track:has(+ nav:empty) { margin-right: 0; }
  nav button { position: relative; height: 40px; padding: 0 16px; border-radius: 999px; font-weight: 700; font-size: 15px; background: var(--top);
    box-shadow: 0 3px 0 var(--line-2); transition: transform .12s var(--spring), box-shadow .12s; }
  nav button:hover { transform: translateY(-1px); }
  nav button:active, nav button[aria-expanded="true"] { transform: translateY(3px); box-shadow: 0 0 0 var(--line-2); }
  nav button[aria-expanded="true"] { background: var(--ink); color: var(--top); }
  nav button.flag::after { content: ""; position: absolute; top: -2px; right: -2px; width: 12px; height: 12px; border-radius: 50%; background: var(--hot); box-shadow: 0 0 0 3px var(--bg); }
  nav button.busy::after { animation: blink 1s ease-in-out infinite; }

  /* ---------- the quest: what to do now ---------- */
  #quest { grid-column: 1; grid-row: 2; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: 14px; padding: 10px 4px 14px 0;
    overflow-y: auto; scrollbar-width: none; position: relative; z-index: 1; }
  .card { position: relative; display: grid; gap: 16px; justify-items: start; padding: 24px 26px 26px; border-radius: 30px; background: var(--top);
    box-shadow: 0 8px 0 var(--line-2), 0 24px 50px -24px rgb(60 40 10 / .35); }
  .card.enter { animation: card-in .5s var(--spring) both; }
  @keyframes card-in { from { transform: translateY(30px) scale(.94); opacity: 0; } }
  .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tag { display: inline-flex; align-items: center; gap: 8px; height: 30px; padding: 0 12px; border-radius: 999px; font-weight: 700; font-size: 13px; letter-spacing: .02em;
    background: color-mix(in srgb, var(--ink) 7%, transparent); color: var(--ink); white-space: nowrap; }
  .tag.dish { background: var(--dish); color: #fff; text-shadow: 0 1px 0 rgb(0 0 0 / .15); }
  .tag.dish svg { width: 18px; height: 14px; }
  .tag.where { background: none; box-shadow: inset 0 0 0 2px var(--line-2); color: var(--muted); }
  .tag.alarm { background: var(--alarm); color: #fff; animation: bounce .8s var(--spring) infinite; }
  .avatar { position: relative; flex: none; display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--cook); color: #fff;
    font-weight: 900; font-size: 14px; box-shadow: inset 0 -3px 0 rgb(0 0 0 / .18); }
  .avatar::before { content: ""; position: absolute; top: -9px; left: 50%; width: 20px; height: 12px; translate: -50% 0; border-radius: 8px 8px 3px 3px; background: #fff; box-shadow: 0 1px 0 var(--line-2); }
  .tag.cook { padding-left: 0; background: color-mix(in srgb, var(--cook) 16%, transparent); }
  .card h1 { margin: 0; font-weight: 800; font-size: clamp(38px, 4.4vw, 70px); line-height: .98; letter-spacing: -.035em; text-wrap: balance; }
  .instruction { margin: 0; display: grid; gap: .35em; font-size: clamp(19px, 1.65vw, 25px); line-height: 1.28; text-wrap: pretty; }
  .instruction p { margin: 0; }
  .instruction b { font-weight: 700; background: color-mix(in srgb, var(--gold) 45%, transparent); border-radius: 6px; padding: 0 4px; margin: 0 -2px; box-decoration-break: clone; }
  .instruction .cue { color: var(--muted); }
  .uses { display: flex; flex-wrap: wrap; gap: 6px; margin: 0; padding: 0; list-style: none; }
  .uses li { padding: 5px 11px; border-radius: 10px; font-size: 14px; font-weight: 500; background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .uses .amt { font-weight: 800; margin-right: 6px; }
  .uses .out { background: color-mix(in srgb, var(--alarm) 14%, transparent); color: var(--alarm); }
  .act { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 4px; }
  /* The one button: a real key you press down. */
  .go { position: relative; display: inline-flex; align-items: center; gap: 16px; height: 70px; padding: 0 16px 0 34px; border-radius: 22px;
    background: var(--go); color: #fff; font-weight: 800; font-size: 26px; letter-spacing: -.01em; text-shadow: 0 2px 0 rgb(0 0 0 / .15);
    box-shadow: 0 8px 0 var(--go-lo), 0 14px 24px -8px color-mix(in srgb, var(--go) 60%, transparent); transform: translateY(0); transition: transform .1s, box-shadow .1s; }
  .go::after { content: ""; position: absolute; inset: 5px 8px auto; height: 22px; border-radius: 14px 14px 30px 30px; background: linear-gradient(rgb(255 255 255 / .28), rgb(255 255 255 / 0)); pointer-events: none; }
  .go:hover { transform: translateY(-2px); box-shadow: 0 10px 0 var(--go-lo), 0 18px 28px -8px color-mix(in srgb, var(--go) 60%, transparent); }
  .go:active, .go.pressed { transform: translateY(8px); box-shadow: 0 0 0 var(--go-lo), 0 4px 10px -6px color-mix(in srgb, var(--go) 60%, transparent); }
  .go kbd { display: grid; place-items: center; min-width: 38px; height: 38px; padding: 0 9px; border-radius: 11px; font: 800 17px var(--display); background: rgb(0 0 0 / .16); }
  .go.alarm { --go: var(--alarm); --go-lo: #a8251a; }
  .go.light { --go: var(--hot); --go-lo: #c35a0c; }
  .ghost { height: 56px; padding: 0 22px; border-radius: 18px; font-weight: 700; font-size: 18px; background: var(--top); box-shadow: inset 0 0 0 3px var(--line-2), 0 5px 0 var(--line-2);
    transition: transform .1s, box-shadow .1s; }
  .ghost:active { transform: translateY(5px); box-shadow: inset 0 0 0 3px var(--line-2), 0 0 0 var(--line-2); }
  .when { display: flex; align-items: baseline; gap: 10px; font-weight: 800; font-size: clamp(30px, 3vw, 44px); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .when small { font-weight: 600; font-size: 15px; letter-spacing: 0; color: var(--muted); }
  .card.alarm { box-shadow: 0 8px 0 #a8251a, 0 0 0 4px var(--alarm), 0 24px 60px -18px color-mix(in srgb, var(--alarm) 70%, transparent); animation: shake .5s ease-in-out 2; }
  .card.alarm h1 { color: var(--alarm); }
  @keyframes shake { 20% { transform: rotate(-1.4deg); } 60% { transform: rotate(1.4deg); } }
  .back { justify-self: start; font-weight: 700; font-size: 14px; color: var(--muted); padding: 4px 0; }
  .back:hover { color: var(--ink); }
  /* Someone else's work: a smaller card. */
  .card.small { gap: 10px; padding: 16px 18px 16px 20px; border-radius: 22px; box-shadow: 0 5px 0 var(--line-2); grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .card.small h1 { font-size: clamp(22px, 2vw, 30px); letter-spacing: -.02em; }
  .card.small .main { display: grid; gap: 8px; min-width: 0; }
  .card.small .go { height: 52px; font-size: 18px; padding: 0 20px; border-radius: 16px; box-shadow: 0 6px 0 var(--go-lo); }
  .card.small .go kbd { display: none; }
  .card.small .ghost { height: 46px; font-size: 16px; padding: 0 16px; }
  /* Up next: the queue, like the next pieces in a falling-block game. */
  .next { display: grid; gap: 8px; }
  .next h2 { margin: 6px 0 0 6px; font-size: 13px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .next button { display: grid; grid-template-columns: 4.6em 14px minmax(0, 1fr); align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px; text-align: left;
    background: color-mix(in srgb, var(--top) 55%, transparent); font-size: 17px; font-weight: 500; transition: transform .15s var(--spring), background .15s; }
  .next button:hover { background: var(--top); transform: translateX(4px); }
  .next small { font-weight: 800; font-size: 14px; font-variant-numeric: tabular-nums; color: var(--muted); }
  .next i { width: 14px; height: 14px; border-radius: 5px; background: var(--dish); box-shadow: inset 0 -2px 0 rgb(0 0 0 / .2); }
  .next span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .next .by { color: var(--muted); }
  /* An empty stove: the question, and the knob to light it. */
  .hello { margin: 0; font-size: clamp(40px, 4.4vw, 68px); font-weight: 900; line-height: .95; letter-spacing: -.045em; text-wrap: balance; }
  .hello.working { color: var(--muted); animation: blink 1.6s ease-in-out infinite; }
  .ideas { display: flex; flex-wrap: wrap; gap: 8px; }
  .ideas span { padding: 8px 14px; border-radius: 999px; font-size: 15px; font-weight: 500; background: color-mix(in srgb, var(--ink) 6%, transparent); color: var(--muted); }
  .ideas span::before { content: "“"; } .ideas span::after { content: "”"; }
  .sub { margin: 0; font-size: 17px; color: var(--muted); }

  /* ---------- the scene: wall, range, counter ---------- */
  #scene { grid-column: 2; grid-row: 2; min-height: 0; position: relative; display: grid; place-items: center; }
  #scene > svg { width: 100%; height: 100%; overflow: visible; }
  .wall { fill: var(--wall); }
  .floor { fill: var(--floor); }
  .tiles { fill: url(#tiles); }
  .enamel { fill: var(--enamel); }
  .enamel-hi { fill: var(--enamel-hi); }
  .enamel-lo { fill: var(--enamel-lo); }
  .chrome { fill: var(--chrome); }
  .chrome-lo { fill: var(--chrome-lo); }
  .cooktop { fill: var(--steel); }
  .cooktop-edge { fill: var(--steel-2); }
  .bowl { fill: #181a16; }
  .grate { stroke: var(--grate); stroke-width: 11; stroke-linecap: round; fill: none; }
  .cap { fill: #34382f; }
  .plate { font: 900 22px var(--display); fill: var(--chrome); letter-spacing: -.03em; }
  .lcd { fill: #12140f; }
  .lcd-text { font: 800 32px var(--display); fill: var(--hot); font-variant-numeric: tabular-nums; letter-spacing: .02em; filter: drop-shadow(0 0 6px color-mix(in srgb, var(--hot) 70%, transparent)); }
  .lcd-text.late { fill: var(--alarm); }
  .lcd-label { font: 800 11px var(--display); fill: #8a7a5c; text-anchor: middle; letter-spacing: .18em; }
  .clock { cursor: pointer; }
  .clock:hover .lcd { fill: #1c1f18; }
  .wood { fill: var(--wood); }
  .wood-lo { fill: var(--wood-lo); }
  .cab { fill: var(--cab); stroke: var(--cab-lo); stroke-width: 3; }
  .cab-handle { fill: var(--chrome-lo); }
  .shadow { fill: rgb(0 0 0 / .32); filter: url(#soft); }

  /* Knobs turn with the heat. */
  .knob .face { fill: var(--chrome); }
  .knob .rim { fill: var(--chrome-lo); }
  .knob .ptr { stroke: var(--ink); stroke-width: 5; stroke-linecap: round; }
  .knob .turn { transform-box: fill-box; transform-origin: center; transition: transform .7s var(--spring); }
  .knob-led { fill: #3a2a1a; transition: fill .3s; }
  .knob.on .knob-led { fill: var(--hot); filter: drop-shadow(0 0 5px var(--hot)); }

  /* Flames: a ring of petals, each flickering on its own. */
  .flames { opacity: 0; transition: opacity .4s; }
  .on > .flames { opacity: 1; }
  .petal { fill: var(--flame); }
  .petal.core { fill: var(--flame-2); }
  .petal-g { transform-box: fill-box; transform-origin: 50% 100%; animation: flick var(--t, .45s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
  @keyframes flick { from { transform: scale(.9, .72); } to { transform: scale(1.05, 1.12); } }
  .low .petal-g { scale: .7; }
  .rung .petal { fill: var(--alarm); }
  /* Lighting the stove: every burner catches in turn. */
  .ignite .burner > .flames { animation: catch 1.3s var(--ease) both; animation-delay: calc(var(--i) * .12s); }
  @keyframes catch { 0% { opacity: 0; } 18% { opacity: 1; } 70% { opacity: 1; } 100% { opacity: var(--rest, 0); } }
  .ignite .knob .turn { animation: twist 1.1s var(--spring) both; animation-delay: calc(var(--i) * .12s); }
  @keyframes twist { 30% { transform: rotate(150deg); } }

  /* Pots and pans, in each dish's colour. */
  .vessel { cursor: pointer; }
  .vessel .body { fill: var(--dish); }
  .vessel .lid { fill: var(--dish); }
  .vessel .lid-rim { fill: none; stroke: color-mix(in srgb, var(--dish) 70%, #000); stroke-width: 5; }
  .vessel .shine { fill: url(#shine); pointer-events: none; }
  .vessel .gloss { fill: url(#gloss); pointer-events: none; }
  .vessel .lug, .vessel .handle { fill: color-mix(in srgb, var(--dish) 60%, #000); }
  .vessel .handle-bar { stroke: #2a2b27; stroke-width: 18; stroke-linecap: round; }
  .vessel .well { fill: #262723; }
  .vessel .rim { fill: none; stroke: var(--dish); stroke-width: 9; }
  .vessel .track { fill: none; stroke: rgb(0 0 0 / .22); stroke-width: 9; }
  .vessel .bar { fill: none; stroke: #fff; stroke-width: 9; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .vessel.rung .bar { stroke: var(--alarm); }
  .vessel .big { font: 800 40px var(--display); fill: #fff; text-anchor: middle; font-variant-numeric: tabular-nums; letter-spacing: -.02em; paint-order: stroke; stroke: rgb(0 0 0 / .14); stroke-width: 4px; }
  .vessel .small { font: 800 12.5px var(--display); fill: rgb(255 255 255 / .85); text-anchor: middle; letter-spacing: .1em; text-transform: uppercase; }
  .vessel .word { font: 800 21px var(--display); fill: #fff; text-anchor: middle; letter-spacing: -.01em; }
  .vessel:hover .lid, .vessel:hover .body { filter: brightness(1.06); }
  .vessel.viewing .lid { filter: brightness(1.12); }
  .wobble { transform-box: fill-box; transform-origin: 50% 100%; }
  .rung .wobble { animation: rattle .32s ease-in-out infinite; }
  @keyframes rattle { 25% { transform: rotate(-3deg) translateY(-4px); } 75% { transform: rotate(3deg) translateY(-2px); } }
  .due .wobble { animation: nudge 1.8s var(--spring) infinite; }
  @keyframes nudge { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-10px); } 90% { transform: translateY(0) scaleY(.96); } }
  .drop { transform-box: fill-box; transform-origin: 50% 100%; animation: drop .6s var(--spring) both; }
  @keyframes drop { from { transform: translateY(-120px); opacity: 0; } 50% { opacity: 1; } }
  .puff circle { fill: #fff; opacity: 0; filter: url(#puff); animation: puff 2.8s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes puff { 0% { opacity: 0; transform: translateY(0) scale(.5); } 30% { opacity: .55; } 100% { opacity: 0; transform: translateY(-90px) scale(1.6); } }
  .ghost-pan { fill: rgb(255 255 255 / .04); stroke: #6c7064; stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
  .ghost-text { font: 700 14px var(--display); fill: #b8bcb0; text-anchor: middle; }
  .ghost-when { font: 800 26px var(--display); fill: #d6d9cf; text-anchor: middle; font-variant-numeric: tabular-nums; }

  /* Who's on it: a little cook in a hat, bobbing. */
  .cook-tok { animation: bob 1.4s ease-in-out infinite; transform-box: fill-box; }
  @keyframes bob { 50% { transform: translateY(-5px); } }
  .cook-tok .head { fill: var(--cook); stroke: #fff; stroke-width: 3.5; }
  .cook-tok .hat { fill: #fff; }
  .cook-tok text { font: 900 17px var(--display); fill: #fff; text-anchor: middle; }

  /* The quest marker: where the thing to do now is. */
  .marker { pointer-events: none; }
  .marker .arrow { fill: var(--gold); stroke: var(--ink); stroke-width: 4; stroke-linejoin: round; }
  .marker g { animation: hover 1s ease-in-out infinite; }
  .marker.alarm .arrow { fill: var(--alarm); }
  @keyframes hover { 50% { transform: translateY(-12px); } }
  .alert circle { fill: var(--alarm); stroke: #fff; stroke-width: 4; }
  .alert text { font: 900 34px var(--display); fill: #fff; text-anchor: middle; }
  .alert g { animation: pop-bounce .6s var(--spring) infinite alternate; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes pop-bounce { from { transform: scale(.9); } to { transform: scale(1.1) translateY(-6px); } }

  /* The oven: its window lights up. */
  .door { fill: var(--enamel); }
  .door-hi { fill: var(--enamel-hi); }
  .window { fill: #121310; }
  .glow { fill: url(#oven-glow); opacity: 0; transition: opacity 1.2s; }
  .oven.hot .glow { opacity: 1; }
  .element { fill: none; stroke: #3b2d22; stroke-width: 5; stroke-linejoin: round; transition: stroke .8s; }
  .oven.hot .element { stroke: var(--hot); filter: drop-shadow(0 0 6px var(--hot)); }
  .rack { stroke: #3d3f39; stroke-width: 4; }
  .tray { cursor: pointer; }
  .tray .dish-body { fill: var(--dish); }
  .tray .dish-lip { fill: color-mix(in srgb, var(--dish) 70%, #000); }
  .tray text { font: 800 15px var(--display); fill: #fff; text-anchor: middle; }
  .tray .t { font-size: 26px; font-variant-numeric: tabular-nums; }
  .tray .track { stroke: rgb(255 255 255 / .18); stroke-width: 6; stroke-linecap: round; }
  .tray .bar { stroke: #fff; stroke-width: 6; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .tray.rung .dish-body { fill: var(--alarm); }
  .oven-label { font: 800 13px var(--display); fill: rgb(255 255 255 / .55); letter-spacing: .14em; }
  .oven-next { font: 700 16px var(--display); fill: rgb(255 255 255 / .45); text-anchor: middle; }

  /* The counter: boards for prep and resting, a kitchen timer for loose ones. */
  .board { cursor: pointer; }
  .board .slab { fill: #f2d7a8; }
  .board .edge { fill: #c99a5c; }
  .board .title { font: 700 19px var(--display); fill: #3b2a14; }
  .board .label { font: 800 11.5px var(--display); fill: #8a6533; letter-spacing: .12em; text-transform: uppercase; }
  .board .t { font: 800 24px var(--display); fill: #3b2a14; font-variant-numeric: tabular-nums; text-anchor: end; }
  .board .dot { fill: var(--dish); }
  .board.rung .slab { fill: #ffd2c9; }
  .board.rung .t { fill: var(--alarm); }
  .egg .shell { fill: var(--gold); }
  .egg .band { fill: #fff; }
  .egg.rung .shell { fill: var(--alarm); }

  /* ---------- bottom: Basil ---------- */
  footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; min-height: 92px; position: relative; z-index: 2; }
  #pilot { position: relative; flex: none; width: 84px; height: 84px; touch-action: none; transition: transform .15s var(--spring); }
  #pilot:hover { transform: scale(1.05) rotate(-3deg); }
  #pilot:active { transform: scale(.92); }
  #pilot svg { width: 100%; height: 100%; overflow: visible; }
  #pilot .leaf { fill: var(--enamel); }
  #pilot .leaf-hi { fill: var(--enamel-hi); }
  #pilot .vein { stroke: var(--enamel-lo); stroke-width: 3; fill: none; stroke-linecap: round; }
  #pilot .eye { fill: #fff; }
  #pilot .pupil { fill: var(--ink); transition: transform .3s var(--spring); }
  #pilot .lids { fill: var(--enamel); transform-box: fill-box; transform-origin: 50% 0; transform: scaleY(0); }
  #pilot .mouth { fill: #3b1610; transform-box: fill-box; transform-origin: 50% 0; transition: transform .08s; }
  #pilot .shut { fill: none; stroke: var(--ink); stroke-width: 3.5; stroke-linecap: round; opacity: 0; }
  #pilot[data-mode="asleep"] .shut { opacity: 1; }
  #pilot .cheek { fill: #ff8f7a; opacity: .55; }
  #pilot .body { transform-box: fill-box; transform-origin: 50% 100%; }
  #pilot .halo-ring { fill: none; stroke: var(--flame); stroke-width: 4; opacity: 0; }
  #pilot .zz { font: 900 16px var(--display); fill: var(--muted); opacity: 0; }
  #pilot .dots circle { fill: var(--muted); opacity: 0; }
  #pilot .mute { stroke: var(--alarm); stroke-width: 6; stroke-linecap: round; opacity: 0; }
  #pilot[data-mode="asleep"] .lids { transform: scaleY(1); }
  #pilot[data-mode="asleep"] .zz { animation: zz 2.4s ease-out infinite; }
  #pilot[data-mode="asleep"] .zz + .zz { animation-delay: 1.2s; }
  @keyframes zz { 0% { opacity: 0; transform: translate(0, 0); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(14px, -22px); } }
  #pilot[data-mode="asleep"] .body { animation: snooze 3s ease-in-out infinite; }
  @keyframes snooze { 50% { transform: scale(1.03, .97); } }
  #pilot[data-mode="listening"] .lids, #pilot[data-mode="ready"] .lids { animation: blink-lid 4s infinite; }
  @keyframes blink-lid { 0%, 94%, 100% { transform: scaleY(0); } 97% { transform: scaleY(1); } }
  #pilot[data-mode="you"] .halo-ring { opacity: 1; animation: ping 1.2s ease-out infinite; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.35); opacity: 0; } }
  #pilot[data-mode="you"] .body { animation: lean 1s ease-in-out infinite; }
  @keyframes lean { 50% { transform: rotate(-4deg); } }
  #pilot[data-mode="thinking"] .pupil { transform: translate(3px, -4px); }
  #pilot[data-mode="thinking"] .dots circle { animation: dots 1.2s ease-in-out infinite; }
  #pilot[data-mode="thinking"] .dots circle:nth-child(2) { animation-delay: .2s; }
  #pilot[data-mode="thinking"] .dots circle:nth-child(3) { animation-delay: .4s; }
  @keyframes dots { 0%, 100% { opacity: .2; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-5px); } }
  #pilot[data-mode="talking"] .body { animation: talk-bob .5s ease-in-out infinite; }
  @keyframes talk-bob { 50% { transform: translateY(-3px) scale(1.01, .99); } }
  #pilot[data-mode="off"] .mute { opacity: 1; }
  #pilot[data-mode="off"] .lids { transform: scaleY(.55); }
  #pilot.hop .body { animation: hop .6s var(--spring); }
  @keyframes hop { 30% { transform: translateY(-22px) rotate(-8deg); } 60% { transform: translateY(0) scale(1.08, .9); } }
  #lines { min-width: 0; flex: 1; display: grid; gap: 6px; justify-items: start; }
  .bubble { position: relative; max-width: min(820px, 100%); margin: 0; padding: 12px 18px; border-radius: 20px; background: var(--top); box-shadow: 0 4px 0 var(--line-2);
    font-size: clamp(17px, 1.5vw, 21px); line-height: 1.32; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #basil::before { content: ""; position: absolute; left: -9px; bottom: 16px; width: 18px; height: 18px; background: var(--top); transform: rotate(45deg); border-radius: 3px; }
  #basil { overflow: visible; }
  #basil > span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  #basil.pondering { color: var(--muted); }
  #basil i { font-style: normal; animation: b-fade .25s ease-out; }
  #you { font-size: 15px; padding: 7px 14px; border-radius: 14px; background: color-mix(in srgb, var(--ink) 7%, transparent); box-shadow: none; color: var(--muted); -webkit-line-clamp: 1; }
  #you.live { color: var(--ink); background: color-mix(in srgb, var(--flame) 16%, transparent); }
  #status { font-weight: 700; font-size: 14px; color: var(--muted); padding-left: 4px; }
  #status.working { color: var(--ink); animation: blink 1.6s ease-in-out infinite; }
  .keys { margin-left: auto; flex: none; display: flex; gap: 14px; font-size: 13px; font-weight: 600; color: var(--muted); }
  .keys kbd { display: inline-grid; place-items: center; min-width: 26px; height: 26px; padding: 0 7px; margin-right: 6px; border-radius: 8px; background: var(--top);
    box-shadow: 0 3px 0 var(--line-2); font: 800 12px var(--display); color: var(--ink); }
  @keyframes blink { 50% { opacity: .45; } }
  @keyframes bounce { 50% { transform: translateY(-3px); } }

  /* Confetti for a step well done. */
  .bit { position: fixed; z-index: 70; width: 10px; height: 14px; border-radius: 3px; pointer-events: none; }

  /* ---------- narrow: the card on top, the stove under it ---------- */
  @media (max-width: 960px), (max-aspect-ratio: 1/1) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; row-gap: 10px; }
    #quest { grid-row: 2; justify-content: start; overflow: visible; padding: 4px 0 6px; }
    #scene { grid-column: 1; grid-row: 3; }
    #track { width: auto; flex: 1; margin: 0 4px; }
    .card { padding: 18px 20px 20px; gap: 12px; }
    .card h1 { font-size: clamp(30px, 8vw, 50px); }
    .instruction { font-size: clamp(17px, 4.3vw, 21px); }
    .next, .ideas { display: none; }
    .card.small { padding: 10px 12px 10px 14px; border-radius: 18px; }
    .card.small .tag.dish, .card.small .tag.where { display: none; }
    .card.small .main { grid-auto-flow: column; justify-content: start; align-items: center; gap: 10px; }
    .card.small h1 { font-size: 19px; }
    .card.small .go { height: 42px; font-size: 16px; padding: 0 16px; box-shadow: 0 4px 0 var(--go-lo); }
    .card.small .tag.cook { padding-right: 0; background: none; font-size: 0; gap: 0; }
    #scene { min-height: 34vh; }
    #track .segs { display: none; }
    .keys { display: none; }
  }
  @media (max-width: 640px) {
    /* A phone scrolls: the card, then the stove, with Basil pinned to the bottom. */
    html, body { height: auto; min-height: 100%; }
    body { overflow-y: auto; grid-template-rows: auto auto auto auto; }
    #scene { overflow: clip; border-radius: 22px; min-height: 0; }
    #scene > svg { height: auto; }
    footer { position: sticky; bottom: 0; padding-block: 8px; margin-inline: -16px; padding-inline: 16px; background: linear-gradient(transparent, var(--bg) 30%); }
    nav button { padding: 0 12px; font-size: 14px; }
    .go { height: 60px; font-size: 21px; padding: 0 22px; }
    .go kbd { display: none; }
    .uses { display: none; }
    footer { min-height: 72px; }
    #pilot { width: 64px; height: 64px; }
    .bubble { font-size: 16px; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <span class="wordmark" aria-label="Basil"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 15C3 13 2 7 4 3c3 0 9 2 9 7 0 3-2 5-5 5z" fill="var(--enamel)"/><path d="M8 15C7 11 6 7 4 3" stroke="var(--enamel-lo)" stroke-width="1.4" fill="none" stroke-linecap="round"/></svg>basil</span>
  <button id="track" hidden aria-label="The plan"></button>
  <nav id="nav" aria-label="More"></nav>
</header>
<main id="quest" aria-live="polite"></main>
<div id="scene" aria-hidden="true"></div>
<footer>
  <button id="pilot" data-mode="asleep" aria-label="Talk to Basil">
    <svg viewBox="-50 -56 100 106" aria-hidden="true">
      <circle class="halo-ring" cx="0" cy="0" r="44"/>
      <g class="body">
        <path class="leaf" d="M0 46 C-34 40 -46 10 -40 -18 C-36 -38 -14 -50 4 -52 C30 -46 44 -24 42 2 C40 28 22 44 0 46 Z"/>
        <path class="leaf-hi" d="M-30 -20 C-26 -36 -12 -44 2 -46 C-12 -38 -22 -28 -26 -12 Z" opacity=".6"/>
        <path class="vein" d="M0 44 C2 30 2 14 4 -4"/>
        <ellipse class="cheek" cx="-24" cy="6" rx="7" ry="4.5"/>
        <ellipse class="cheek" cx="26" cy="6" rx="7" ry="4.5"/>
        <g><ellipse class="eye" cx="-13" cy="-12" rx="9" ry="11"/><circle class="pupil" cx="-12" cy="-10" r="5"/></g>
        <g><ellipse class="eye" cx="15" cy="-12" rx="9" ry="11"/><circle class="pupil" cx="16" cy="-10" r="5"/></g>
        <rect class="lids" x="-24" y="-25" width="50" height="26" rx="11"/>
        <path class="shut" d="M-21 -11 Q-13 -4 -5 -11 M7 -11 Q15 -4 23 -11"/>
        <path class="mouth" id="mouth" d="M-8 8 Q1 10 10 8 Q9 18 1 18 Q-7 18 -8 8 Z"/>
      </g>
      <text class="zz" x="26" y="-38">z</text><text class="zz" x="26" y="-38">z</text>
      <g class="dots"><circle cx="30" cy="-44" r="4"/><circle cx="40" cy="-50" r="4"/><circle cx="50" cy="-56" r="4"/></g>

    </svg>
  </button>
  <div id="lines">
    <p class="line" id="status" hidden></p>
    <p class="bubble" id="you" hidden></p>
    <p class="bubble" id="basil" hidden><span></span></p>
  </div>
  <span class="keys" id="keys"></span>

<script src="/core.js"></script>
<script>
// ---------- the scene ----------
// The camera looks at the range from the front and a little above: across stays across, depth is squashed by K,
// and height goes straight up. So a burner is an ellipse, a pot is a cylinder, and the oven door faces you.
const K = 0.5;
const W = 1100, H = 900;
const RANGE = { x: 30, w: 700, guard: 64, top: 150, depth: 320, lip: 18, front: 360 };
const TOP_Y = RANGE.top, FRONT_Y = RANGE.top + RANGE.depth + RANGE.lip, FLOOR_Y = FRONT_Y + RANGE.front;
const COUNTER = { x: RANGE.x + RANGE.w, w: 340 };

const ellipsePath = (cx, cy, rx, ry) => `M${cx} ${cy - ry}A${rx} ${ry} 0 1 1 ${cx} ${cy + ry}A${rx} ${ry} 0 1 1 ${cx} ${cy - ry}`;
const cylinder = (cx, cy, rx, ry, hgt) => `M${cx - rx} ${cy - hgt}L${cx - rx} ${cy}A${rx} ${ry} 0 0 0 ${cx + rx} ${cy}L${cx + rx} ${cy - hgt}Z`;
const cookColor = (i) => `var(--c${(i ?? 0) % 4})`;
const HIGH = /\b(sear|boil|fry|brown|char|blanch|stir-fry|scorch|toast)\b/i;
const LOW = /\b(simmer|low|warm|melt|poach|gentle|reduce)\b/i;

function burnerGrid(B) {
  const rows = B > 2 ? 2 : 1, cols = Math.ceil(B / rows);
  const x0 = RANGE.x + 30, w = RANGE.w - 60, d = RANGE.depth - 20;
  const cw = w / cols, rh = d / rows;
  const r = Math.min(cw * 0.4, (rh / K) * 0.38, 130);
  return Array.from({ length: B }, (_, b) => {
    const row = rows === 1 ? 0 : b < cols ? 0 : 1, col = rows === 1 ? b : b % cols;
    const name = [rows > 1 ? (row ? "front" : "back") : "", cols === 1 ? "" : cols === 2 ? ["left", "right"][col] : col === 0 ? "left" : col === cols - 1 ? "right" : "middle"].filter(Boolean).join("-");
    return { b, row, col, r, cx: x0 + cw * (col + 0.5), cy: TOP_Y + 10 + rh * (row + 0.5), name: name || "the" };
  });
}

function petals(cx, cy, rx, ry, n, front) {
  const g = s("g", { class: "flames" });
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2, x = cx + Math.cos(a) * rx, y = cy + Math.sin(a) * ry;
    if ((Math.sin(a) > 0) !== front) continue;
    const scale = 0.9 + 0.25 * Math.sin(a * 3 + 1);
    g.append(s("g", { transform: `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${scale.toFixed(2)})` },
      s("g", { class: "petal-g", style: `--t: ${(0.32 + ((i * 37) % 10) / 40).toFixed(2)}s; --dl: ${(-((i * 53) % 10) / 20).toFixed(2)}s` },
        s("path", { class: "petal", d: "M0 0C-7 -2 -7 -12 0 -26C7 -12 7 -2 0 0Z" }),
        s("path", { class: "petal core", d: "M0 -1C-3 -2 -3 -7 0 -13C3 -7 3 -2 0 -1Z" }))));
  }
  return g;
}

function cookToken(x, y, i) {
  const name = state.cooks[i] || "";
  return s("g", { style: `--cook: ${cookColor(i)}`, transform: `translate(${x} ${y})` },
    s("g", { class: "cook-tok" },
      s("path", { class: "hat", d: "M-14 -24 C-22 -26 -22 -40 -12 -40 C-10 -48 10 -48 12 -40 C22 -40 22 -26 14 -24 Z" }),
      s("circle", { class: "head", cx: 0, cy: 0, r: 22 }),
      s("text", { y: 6 }, (name[0] || "?").toUpperCase())));
}

// Where the thing to do now is: a big arrow, hovering.
function marker(x, y, alarm) {
  return s("g", { class: `marker${alarm ? " alarm" : ""}`, transform: `translate(${x} ${y})` },
    s("g", {}, s("path", { class: "arrow", d: "M-22 -44 L22 -44 L22 -18 L36 -18 L0 14 L-36 -18 L-22 -18 Z" })));
}

function timeText(tm, x, y, cls, fallback) {
  if (!tm) return s("text", { class: cls, x, y }, fallback);
  if (tm.paused) return s("text", { class: cls, x, y }, clock(tm.left));
  return s("text", { class: cls, x, y, "data-until": tm.until, "data-clock": "" }, clock((tm.until - Date.now()) / 1000));
}
const ringAttrs = (tm) => tm && { "data-ring": "", "data-until": tm.paused ? "" : tm.until, "data-total": tm.total, "data-left": tm.left ?? "", pathLength: 100,
  "stroke-dasharray": 100, "stroke-dashoffset": (100 * (1 - remaining(tm))).toFixed(2) };

// A pot (lid on, for boiling and simmering) or a pan (open, with a long handle, for everything else).
function vessel(g, pan, primary) {
  const { cx, cy, r } = g, st = pan.step;
  const rx = r * 0.86, ry = rx * K, isPot = pan.pot, hgt = isPot ? rx * 0.5 : rx * 0.2;
  const heat = st.status === "in_progress" && !(st.hands_on && !pan.timing && false);
  const words = `${st.title} ${st.text}`;
  const level = HIGH.test(words) ? "high" : LOW.test(words) ? "low" : "mid";
  const due = st.status === "pending";
  const cls = ["vessel", "burner", heat && "on", heat && level === "low" && "low", pan.rung && "rung", due && "due", pan.viewing && "viewing"].filter(Boolean).join(" ");
  const top = cy - hgt;
  const el = s("g", { class: cls, style: `--dish: ${dishColor(st.dish)}; --i: ${g.b}; --rest: ${heat ? 1 : 0}`, "data-key": pan.key, onclick: () => view(st.id) });
  el.append(petals(cx, cy, rx * 1.06, ry * 1.06, 22, false));
  const w = s("g", { class: "wobble" });
  w.append(s("ellipse", { class: "shadow", cx: cx + 8, cy: cy + 6, rx: rx * 1.02, ry: ry * 1.02 }));
  if (!isPot) w.append(s("line", { class: "handle-bar", x1: cx + rx * 0.9, y1: top + 4, x2: cx + rx + r * 0.75, y2: top + ry * 0.9 }));
  else for (const side of [-1, 1]) w.append(s("rect", { class: "lug", x: side < 0 ? cx - rx - 16 : cx + rx - 4, y: top + hgt * 0.18, width: 20, height: 14, rx: 7 }));
  w.append(s("path", { class: "body", d: cylinder(cx, cy, rx, ry, hgt) }), s("path", { class: "shine", d: cylinder(cx, cy, rx, ry, hgt) }));
  if (isPot) {
    w.append(s("ellipse", { class: "lid", cx, cy: top, rx, ry }), s("ellipse", { class: "lid-rim", cx, cy: top, rx: rx - 3, ry: ry - 2 }),
      s("ellipse", { class: "gloss", cx, cy: top, rx, ry }));
  } else {
    w.append(s("ellipse", { class: "lid", cx, cy: top, rx, ry }), s("ellipse", { class: "well", cx, cy: top + 2, rx: rx - 12, ry: ry - 7 }));
  }
  // The time left goes round the rim; the time itself, and the dish, are written on top.
  const tm = pan.timing;
  if (tm) w.append(s("path", { class: "track", d: ellipsePath(cx, top, rx - 9, ry - 5) }), s("path", { class: "bar", d: ellipsePath(cx, top, rx - 9, ry - 5), ...ringAttrs(tm) }));
  const big = Math.min(44, rx * 0.4);
  w.append(s("text", { class: "small", x: cx, y: top - big * 0.62 }, abbreviate(st.dish, Math.round(rx / 7.5))));
  if (pan.rung) w.append(s("text", { class: "big", x: cx, y: top + big * 0.42, style: `font-size: ${big}px` }, "Done!"));
  else if (tm) { const t = timeText(tm, cx, top + big * 0.42, "big"); t.setAttribute("style", `font-size: ${big}px`); w.append(t); }
  else w.append(s("text", { class: "word", x: cx, y: top + big * 0.3, style: `font-size: ${Math.min(22, rx * 0.2)}px` }, due ? "Start" : abbreviate(st.title, Math.round(rx / 8))));
  if (heat && isPot) {
    const puff = s("g", { class: "puff" });
    [[-0.3, 0], [0.1, 0.9], [0.35, 1.7]].forEach(([dx, dl]) => puff.append(s("circle", { cx: cx + rx * dx, cy: top - ry * 0.5, r: rx * 0.16, style: `animation-delay: ${dl}s` })));
    w.append(puff);
  }
  el.append(w, petals(cx, cy, rx * 1.06, ry * 1.06, 22, true));
  if (st.hands_on && st.cook != null && state.cooks.length > 1) el.append(cookToken(cx - rx + 6, cy + ry * 0.55, st.cook));
  if (pan.rung) el.append(s("g", { class: "alert", transform: `translate(${cx + rx * 0.75 * (g.col === 0 ? -1 : 1)} ${top - ry - 10})` }, s("g", {}, s("circle", { r: 26 }), s("text", { y: 12 }, "!"))));
  if (primary) el.append(marker(cx, top - ry - (pan.rung ? 60 : 24), pan.rung));
  return el;
}

function emptyBurner(g, ghost) {
  const { cx, cy, r } = g;
  const el = s("g", { class: "burner", style: `--i: ${g.b}` });
  el.append(petals(cx, cy, r * 0.42, r * 0.42 * K, 14, false), petals(cx, cy, r * 0.42, r * 0.42 * K, 14, true));
  if (ghost) {
    const rx = r * 0.86;
    el.append(s("ellipse", { class: "ghost-pan", cx, cy: cy - 8, rx, ry: rx * K }),
      s("text", { class: "ghost-when", x: cx, y: cy - 2, "data-until": ghost.at, "data-in": "" }, `in ${hours((ghost.at - Date.now()) / 60000)}`),
      s("text", { class: "ghost-text", x: cx, y: cy + 22 }, abbreviate(ghost.step.title, 22)));
    el.style.cursor = "pointer";
    el.addEventListener("click", () => view(ghost.step.id));
  }
  return el;
}

function grate(g) {
  const { cx, cy, r } = g;
  const out = s("g", {});
  out.append(s("ellipse", { class: "bowl", cx, cy, rx: r, ry: r * K }));
  for (const a of [0.25, 0.75, 1.25, 1.75]) {
    const t = a * Math.PI;

  return h("div", { class: "next" }, h("h2", {}, "Up next"), next.map((x) => h("button", { style: `--dish: ${dishColor(x.dish)}`, onclick: () => view(x.id) },
    h("small", { "data-until": stateAt + x.start * 60000, "data-in": "" }, `in ${hours(x.start)}`), h("i"),
    h("span", {}, cookName(x) && h("span", { class: "by" }, `${cookName(x)} · `), x.title))));
}
const IDEAS = ["Salmon and rice for two, at 7", "Something with what's in the fridge", "How do I use a moka pot?"];
function helloCard() {
  if (busyWith) return h("section", { class: "card" }, h("p", { class: "hello working", "data-busy": "" }, busyText()));
  const asleep = !ws;
  return h("section", { class: "card", "data-key": "hello" },
    h("p", { class: "hello" }, hello()),
    asleep ? h("p", { class: "sub" }, "Light the stove and tell Basil.") : h("p", { class: "sub" }, "Basil's listening. Just say it."),
    !asleep && h("div", { class: "ideas" }, IDEAS.map((t) => h("span", {}, t))),
    asleep && h("div", { class: "act" }, h("button", { class: "go light", onclick: (e) => { press(e.currentTarget); talkPress(); } }, "Light the stove", h("kbd", {}, "Space"))));
}

let lastCards = new Set();
function drawQuest() {
  const box = $("quest");
  const objs = objectives();
  const keys = new Set(objs.map((o) => o.key));
  const enter = (k) => !lastCards.has(k) && !reduced();
  let cards;
  if (!objs.length) cards = [helloCard()];
  else {
    const [first, ...rest] = objs;
    const others = rest.filter((o) => o.s).slice(0, 2);
    cards = [bigCard(first, enter(first.key)), ...others.map((o) => smallCard(o, enter(o.key)))];
    if (!viewing) cards.push(nextList(others.length ? 2 : 3));
  }
  lastCards = keys;
  box.replaceChildren(...cards.filter(Boolean));
}

// ---------- chrome: nav, keys, captions ----------
let doneBefore = null; // the steps done at the last draw; a newly done one pops
function drawTrack() {
  const el = $("track"), steps = plan().steps;
  el.hidden = !steps.length;
  if (!steps.length) return;
  const sorted = [...steps].sort((a, b) => dishIndex(a.dish) - dishIndex(b.dish));
  const done = steps.filter((x) => x.status === "done").length;
  const now = new Set(steps.filter((x) => x.status === "done").map((x) => x.id));
  el.replaceChildren(
    h("span", { class: "segs" }, sorted.map((x) => h("i", { class: `seg${x.status === "done" ? " done" : x.status === "in_progress" ? " now" : ""}${x.status === "done" && doneBefore && !doneBefore.has(x.id) ? " pop" : ""}`,
      style: `--dish: ${dishColor(x.dish)}` }))),
    h("b", {}, `${done}`, h("small", {}, ` / ${steps.length}`)));
  doneBefore = now;
  el.onclick = () => { sound.tap(); openSheet(sheetView === "plan" ? "nothing" : "plan"); };
}
function drawNav() {
  $("nav").replaceChildren(...navItems().map(({ view: v, label, flag, busy }) =>
    h("button", { class: [flag && "flag", busy && "busy"].filter(Boolean).join(" "), "aria-expanded": String(sheetView === v),
      onclick: () => { sound.tap(); openSheet(sheetView === v ? "nothing" : v); } }, label)));
}
function drawKeys() {
  const talk = pushToTalk ? "hold to talk" : ws ? "mute" : "light";
  const done = objectives()[0] && objectiveAction(objectives()[0]);
  $("keys").replaceChildren(...[
    h("span", {}, h("kbd", {}, "Space"), talk),
    done && h("span", {}, h("kbd", {}, "⏎"), done.label.toLowerCase()),
    plan().steps.length > 0 && h("span", {}, h("kbd", {}, "← →"), "look"),
  ].filter(Boolean));
}

View.render = () => { drawScene(); drawQuest(); drawTrack(); drawNav(); drawKeys(); };
View.tick = (now) => {
  for (const el of document.querySelectorAll("[data-ring]")) {
    const until = Number(el.dataset.until), total = Number(el.dataset.total) || 1;
    const rem = el.dataset.until ? Math.max(0, Math.min(1, (until - now) / 1000 / total)) : Math.max(0, Math.min(1, Number(el.dataset.left) / total));
    el.setAttribute("stroke-dashoffset", (100 * (1 - rem)).toFixed(2));
  }
  for (const el of document.querySelectorAll("[data-now]")) el.textContent = atClock(now).replace(/\s?[AP]M$/i, "");
};
let mouthRaf = null;
View.pilot = (mode) => {
  const p = $("pilot");
  p.dataset.mode = mode;
  p.setAttribute("aria-label", mode === "asleep" ? "Light the stove: talk to Basil" : mode === "off" ? "Unmute" : "Mute");
  cancelAnimationFrame(mouthRaf);
  const mouth = $("mouth");
  if (mode === "talking" && !reduced()) {
    const loop = () => { mouth.style.transform = `scaleY(${(0.4 + Math.min(1, voiceLevel() * 3.2) * 1.4).toFixed(2)})`; mouthRaf = requestAnimationFrame(loop); };
    loop();
  } else mouth.style.transform = mode === "asleep" ? "scaleY(.25)" : "scaleY(.55)";
  drawStatus();
  if (state) drawKeys();
};
function drawStatus() {
  const st = $("status");
  const text = busyWith ? busyText() : pilotMode === "thinking" ? "Basil's thinking…" : "";
  st.hidden = !text; st.textContent = text; st.classList.toggle("working", !!text);
  if (busyWith) st.setAttribute("data-busy", ""); else st.removeAttribute("data-busy");
}
View.said = (who, text, live) => {
  if (who === "you") {
    const el = $("you");
    el.hidden = !text; el.textContent = text; el.classList.toggle("live", !!live);
  } else {
    const el = $("basil");
    el.hidden = !text && !live; el.firstChild.textContent = text; el.classList.toggle("pondering", !!live && !text);
    if (!text && live) el.firstChild.textContent = "…";
  }
};
View.stream = (piece, all) => {
  const el = $("basil");
  el.hidden = false; el.classList.remove("pondering");
  const span = el.firstChild;
  if (span.textContent === "…") span.textContent = "";
  span.append(h("i", {}, piece));
};
// Basil arrives: every burner catches, the knobs twist, the leaf hops.
View.ignite = () => {
  const scene = $("scene");
  scene.classList.add("ignite");
  scene.querySelector("svg")?.classList.add("ignite");
  $("pilot").classList.add("hop");
  setTimeout(() => { scene.classList.remove("ignite"); scene.querySelector("svg")?.classList.remove("ignite"); $("pilot").classList.remove("hop"); }, 2200);
  if (state) View.render();
};
View.pressed = (o) => { const b = document.querySelector("#quest .go"); if (b) press(b, o); };

// A press: the key goes down, and a done step throws confetti.
function press(btn, o) {
  btn.classList.add("pressed");
  setTimeout(() => btn.classList.remove("pressed"), 140);
  const a = o && objectiveAction(o);
  if (!a || reduced() || !(a.status === "done" || o.kind === "rang" || o.kind === "eat")) return;
  const r = btn.getBoundingClientRect(), colors = ["var(--d0)", "var(--d1)", "var(--d2)", "var(--d3)", "var(--gold)", "var(--go)"];
  for (let i = 0; i < 26; i++) {
    const bit = h("i", { class: "bit", style: `left: ${r.left + r.width / 2}px; top: ${r.top + r.height / 2}px; background: ${colors[i % colors.length]}` });
    document.body.append(bit);
    const ang = -Math.PI / 2 + (Math.random() - 0.5) * 2.2, v = 180 + Math.random() * 220;
    bit.animate([
      { transform: "translate(-50%, -50%) rotate(0)", opacity: 1 },
      { transform: `translate(${Math.cos(ang) * v}px, ${Math.sin(ang) * v + 140}px) rotate(${Math.random() * 720 - 360}deg)`, opacity: 0 },
    ], { duration: 900 + Math.random() * 400, easing: "cubic-bezier(.2,.7,.4,1)" }).onfinish = () => bit.remove();
  }
}

bindTalk($("pilot"));
// Space lights the stove (or mutes); in hold-to-talk, core.js holds it.
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.repeat || pushToTalk || e.target.matches?.("input, textarea, button, a") || sheetView) return;
  e.preventDefault(); talkPress();
});
startBasil();
</script>
</body>
