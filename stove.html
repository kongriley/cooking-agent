<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='6' fill='none' stroke='%234d7cff' stroke-width='2.5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,700&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
  /* The stove: the screen is the cook's own range, seen from above. What to do now is written on the glass to the
     left, in type you can read across the room; the burners, oven and counter on the right show everything that's
     cooking, where, and for how long. Basil is the pilot light. */
  :root {
    --bg: #ebe7dd; --top: #f6f4ee; --line: #cdc7b9; --line-2: #b9b2a2; --ink: #161714; --muted: #77746b;
    --pan: #262826; --pan-2: #323532; --pan-ink: #f4f1e8; --pan-muted: #9c9a92;
    --flame: #3d6df2; --flame-2: #86a6ff; --hot: #f07a2a; --alarm: #e5432a; --glow: #ff9a4a;
    --d0: #c8673d; --d1: #2f8a76; --d2: #b48a1c; --d3: #7a62c2; --d4: #3a72c0; --d5: #b8507a; --d6: #5f8f33; --d7: #8f6c4f;
    --display: "Bricolage Grotesque", ui-rounded, "Avenir Next", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
    --ease: cubic-bezier(.2, .9, .25, 1); --spring: cubic-bezier(.3, 1.5, .5, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0b0c0b; --top: #121412; --line: #262a26; --line-2: #343934; --ink: #f2eee4; --muted: #8b8f87;
      --pan: #262926; --pan-2: #303430; --pan-ink: #f4f1e8; --pan-muted: #8f938b;
      --flame: #4f7fff; --flame-2: #9db6ff; --hot: #ff8a3a; --alarm: #ff5436; --glow: #ff9a4a;
      --d0: #e58c66; --d1: #6dbaa7; --d2: #d9b456; --d3: #a593e6; --d4: #7eaaea; --d5: #df7fa3; --d6: #96c56e; --d7: #c7a283;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0c0b; --top: #121412; --line: #262a26; --line-2: #343934; --ink: #f2eee4; --muted: #8b8f87;
    --pan: #262926; --pan-2: #303430; --pan-ink: #f4f1e8; --pan-muted: #8f938b;
    --flame: #4f7fff; --flame-2: #9db6ff; --hot: #ff8a3a; --alarm: #ff5436; --glow: #ff9a4a;
    --d0: #e58c66; --d1: #6dbaa7; --d2: #d9b456; --d3: #a593e6; --d4: #7eaaea; --d5: #df7fa3; --d6: #96c56e; --d7: #c7a283;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden;
    display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 6fr); grid-template-rows: auto minmax(0, 1fr) auto;
    column-gap: clamp(24px, 4vw, 64px);
    padding-block: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-bottom));
    padding-inline: clamp(16px, 4vw, 56px); user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible, a:focus-visible { outline: 2px solid var(--flame); outline-offset: 4px; border-radius: 10px; }
  [hidden] { display: none !important; }
  .mono { font-family: var(--mono); }

  /* ---------- top bar: the wordmark, the time to eat, and the three ways into everything else ---------- */
  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 24px; min-height: 40px; }
  .wordmark { font-size: 22px; font-weight: 700; letter-spacing: -.045em; line-height: 1; font-variation-settings: "opsz" 96; }
  .wordmark i { font-style: normal; color: var(--flame); }
  #serve { margin-left: auto; display: flex; align-items: baseline; gap: 10px; padding: 6px 12px; margin-right: -12px; border-radius: 12px;
    font: 500 13px var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  #serve:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  #serve b { font: 700 22px var(--mono); letter-spacing: -.02em; color: var(--ink); text-transform: none; font-variant-numeric: tabular-nums; }
  #serve .late { color: var(--alarm); }
  nav { display: flex; gap: 4px; }
  nav button { position: relative; padding: 8px 12px; border-radius: 10px; font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  nav button:hover, nav button[aria-expanded="true"] { color: var(--ink); background: color-mix(in srgb, var(--ink) 6%, transparent); }
  nav button.dot::after { content: ""; position: absolute; top: 6px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: var(--hot); }
  nav button.busy::after { animation: breathe 1.2s ease-in-out infinite; }
  #serve:not(:empty) + nav { margin-left: 8px; }
  nav:first-child, #serve:empty + nav { margin-left: auto; }

  /* ---------- the HUD: what to do now, written on the glass ---------- */
  #hud { grid-column: 1; grid-row: 2; min-height: 0; display: flex; flex-direction: column; justify-content: center; gap: 28px;
    padding-block: 12px; overflow-y: auto; scrollbar-width: none; }
  .obj { display: grid; gap: 14px; justify-items: start; }
  .obj.enter { animation: obj-in .42s var(--ease) both; }
  .obj.leave { animation: obj-out .22s ease-in both; }
  @keyframes obj-in { from { transform: translateY(18px); opacity: 0; } }
  @keyframes obj-out { to { transform: translateY(-14px); opacity: 0; } }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; font: 500 12px/1.2 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .meta .dish { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .meta .dish::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--dish, var(--muted)); }
  .who { display: inline-flex; align-items: center; height: 22px; padding: 0 9px; border-radius: 999px; background: var(--ink); color: var(--bg);
    font: 700 11px/1 var(--mono); letter-spacing: .1em; text-transform: uppercase; }
  .who.c1 { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); }
  .who.c2 { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--ink); border-radius: 4px; }
  .obj h1 { margin: 0; font-weight: 700; font-size: clamp(40px, 5.2vw, 84px); line-height: .98; letter-spacing: -.04em; text-wrap: balance; font-variation-settings: "opsz" 96; }
  .instruction { margin: 0; display: grid; gap: .4em; max-width: 26ch; font-size: clamp(21px, 2.1vw, 30px); line-height: 1.25; text-wrap: pretty; }
  .instruction p { margin: 0; }
  .instruction b { font-weight: 700; }
  .instruction .cue { color: var(--muted); }
  .uses { display: flex; flex-wrap: wrap; gap: 6px 16px; margin: 0; padding: 0; list-style: none; font: 500 13px var(--mono); letter-spacing: .02em; color: var(--muted); }
  .uses .amt { color: var(--ink); margin-right: 6px; }
  .uses .out { color: var(--alarm); }
  .uses .out .amt { color: var(--alarm); }
  .act { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-top: 8px; }
  .go { position: relative; display: inline-flex; align-items: center; gap: 14px; height: 64px; padding: 0 16px 0 34px; border-radius: 999px;
    background: var(--ink); color: var(--bg); font-weight: 700; font-size: 22px; letter-spacing: -.01em;
    transition: transform .14s var(--spring), background .2s; }
  .go:hover { transform: translateY(-1px); }
  .go:active { transform: scale(.95); }
  .go kbd { display: grid; place-items: center; min-width: 32px; height: 32px; padding: 0 8px; border-radius: 9px; font: 500 15px var(--mono);
    background: color-mix(in srgb, var(--bg) 16%, transparent); }
  .go.alarm { background: var(--alarm); color: #fff; }
  .go.pressed { animation: press .32s var(--spring); }
  @keyframes press { 40% { transform: scale(.92); } }
  .ghost { height: 52px; padding: 0 24px; border-radius: 999px; font-weight: 500; font-size: 18px; box-shadow: inset 0 0 0 1.5px var(--line-2); transition: box-shadow .15s, transform .14s var(--spring); }
  .ghost:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  .ghost:active { transform: scale(.95); }
  .when { font: 500 clamp(28px, 3vw, 40px)/1 var(--mono); letter-spacing: -.03em; font-variant-numeric: tabular-nums; }
  .when small { margin-left: 10px; font: 500 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .obj.alarm h1 { color: var(--alarm); }
  .obj.alarm .meta { color: var(--alarm); }
  .back { font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); padding: 6px 0; }
  .back:hover { color: var(--ink); }
  /* Everyone else's work, small, under the main objective. */
  .obj.small { gap: 10px; padding-top: 22px; border-top: 1px solid var(--line); width: 100%; }
  .obj.small h1 { font-size: clamp(26px, 2.6vw, 36px); letter-spacing: -.03em; }
  .obj.small .instruction { font-size: 18px; max-width: 34ch; }
  .obj.small .go { height: 48px; font-size: 17px; padding: 0 12px 0 24px; }
  .obj.small .go kbd { display: none; }
  .obj.small .ghost { height: 44px; font-size: 16px; padding: 0 18px; }
  .row-small { display: flex; align-items: flex-end; justify-content: space-between; gap: 18px; width: 100%; }
  .row-small > div { display: grid; gap: 8px; min-width: 0; }
  /* What's coming, so the wait shows what it's for. */
  .next { list-style: none; margin: 0; padding: 18px 0 0; border-top: 1px solid var(--line); display: grid; gap: 4px; width: 100%; }
  .next button { width: 100%; display: grid; grid-template-columns: 5.5em 10px minmax(0, 1fr); align-items: center; gap: 12px; padding: 6px 0; text-align: left; font-size: 17px; color: var(--muted); }
  .next button:hover { color: var(--ink); }
  .next small { font: 500 13px var(--mono); font-variant-numeric: tabular-nums; color: var(--muted); }
  .next i { width: 8px; height: 8px; border-radius: 50%; background: var(--dish); }
  .next span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* An empty stove: the question, large. */
  .hello { margin: 0; font-size: clamp(40px, 5vw, 76px); font-weight: 700; line-height: 1; letter-spacing: -.04em; text-wrap: balance; }
  .hello.working { color: var(--muted); animation: breathe 1.6s ease-in-out infinite; }
  .hello + .sub { margin: 0; font: 500 13px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }

  /* ---------- the world: burners, oven, counter ---------- */
  #world { grid-column: 2; grid-row: 2; min-height: 0; position: relative; display: grid; place-items: center; }
  #world svg.stove { width: 100%; height: 100%; overflow: visible; }
  .surface { fill: var(--top); stroke: var(--line); stroke-width: 1.5; }
  .grate { stroke: var(--line-2); stroke-width: 7; stroke-linecap: round; fill: none; }
  .cap { fill: var(--line); }
  .ring-port { fill: none; stroke: var(--line-2); stroke-width: 1.5; stroke-dasharray: 2 7; }
  .draw { stroke-dasharray: var(--len) var(--len); stroke-dashoffset: var(--len); animation: draw .9s var(--ease) forwards; animation-delay: var(--d, 0s); }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  .fade-in { animation: fade .6s ease-out both; animation-delay: var(--d, 0s); }
  @keyframes fade { from { opacity: 0; } }

  .flame { fill: var(--flame); opacity: 0; transition: opacity .5s, fill .4s; }
  .flame.core { fill: var(--flame-2); }
  .on .flame { opacity: .95; animation: flick var(--t, .5s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
  .on .flame.core { opacity: .9; }
  .on .flame.out { opacity: .55; fill: var(--line-2); animation: none; }
  .on .flame.core.out { opacity: 0; }
  .low .flame { fill: var(--hot); }
  .low .flame.core { fill: #ffd08a; }
  .alarm .flame { fill: var(--alarm); }
  .alarm .flame.core { fill: #ffb199; }
  .paused .flame { opacity: .25; animation: none; }
  @keyframes flick { from { transform: scale(1, .82); } to { transform: scale(1.06, 1.1); } }
  .halo { fill: url(#halo); opacity: 0; transition: opacity .6s; }
  .on .halo { opacity: 1; }
  .alarm .halo { fill: url(#halo-hot); }

  .pan { cursor: pointer; }
  .pan .body { fill: var(--pan); }
  .pan .well { fill: var(--pan-2); }
  .pan .rim { fill: none; stroke: var(--dish); stroke-width: 3; opacity: .9; }
  .pan .handle { fill: var(--pan); }
  .pan .label { font: 700 12px var(--mono); letter-spacing: .14em; text-transform: uppercase; fill: var(--pan-muted); text-anchor: middle; }
  .pan .big { font: 500 38px var(--mono); letter-spacing: -.03em; fill: var(--pan-ink); text-anchor: middle; font-variant-numeric: tabular-nums; }
  .pan .big.word { font: 700 22px var(--display); letter-spacing: -.02em; }
  .pan .pic { opacity: .55; }
  .pan .shade { fill: url(#shade); }
  .pan-in { transform-box: fill-box; transform-origin: center; animation: pan-in .5s var(--spring) both; }
  @keyframes pan-in { from { transform: translateY(-26px) scale(.7); opacity: 0; } }
  .pan-out { transform-box: fill-box; transform-origin: center; animation: pan-out .32s ease-in both; }
  @keyframes pan-out { to { transform: translateY(14px) scale(.85); opacity: 0; } }
  .pop { transform-box: fill-box; transform-origin: center; animation: pop .34s var(--spring); }
  @keyframes pop { 40% { transform: scale(1.08); } }
  .rattle { transform-box: fill-box; transform-origin: center; animation: rattle .5s ease-in-out infinite; }
  @keyframes rattle { 25% { transform: rotate(-2.2deg); } 75% { transform: rotate(2.2deg); } }
  .steam path { fill: none; stroke: var(--muted); stroke-width: 3; stroke-linecap: round; opacity: 0; animation: steam 2.4s ease-out infinite; }
  @keyframes steam { 0% { opacity: 0; transform: translateY(6px); } 30% { opacity: .55; } 100% { opacity: 0; transform: translateY(-34px); } }
  .ghost-pan { fill: var(--top); stroke: var(--line-2); stroke-width: 2; stroke-dasharray: 3 9; stroke-linecap: round; }
  .ghost-text { font: 500 13px var(--mono); letter-spacing: .1em; text-transform: uppercase; fill: var(--muted); text-anchor: middle; }
  .ghost-when { font: 500 26px var(--mono); letter-spacing: -.02em; fill: var(--muted); text-anchor: middle; font-variant-numeric: tabular-nums; }
  .reticle { fill: none; stroke: var(--ink); stroke-width: 2.5; stroke-dasharray: 10 14; stroke-linecap: round; animation: march 1.2s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -24; } }
  .badge rect { fill: var(--ink); }
  .badge text { font: 700 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; fill: var(--bg); text-anchor: middle; }
  .badge.c1 rect, .badge.c2 rect { fill: var(--top); stroke: var(--ink); stroke-width: 2; }
  .badge.c1 text, .badge.c2 text { fill: var(--ink); }

  .oven-body { fill: var(--top); stroke: var(--line); stroke-width: 1.5; }
  .oven-window { fill: var(--pan); }
  .oven-glow { fill: url(#oven-glow); opacity: 0; transition: opacity 1.2s; }
  .oven-element { fill: none; stroke: var(--line-2); stroke-width: 3; stroke-linejoin: round; transition: stroke .8s; }
  .oven.hot .oven-element { stroke: var(--hot); filter: drop-shadow(0 0 4px var(--hot)); }
  .oven-rack { stroke: var(--pan-2); stroke-width: 3; }
  .oven-label { font: 700 12px var(--mono); letter-spacing: .16em; text-transform: uppercase; fill: var(--muted); }
  .oven-read { font: 500 26px var(--mono); letter-spacing: -.02em; fill: var(--ink); text-anchor: end; font-variant-numeric: tabular-nums; }
  .oven-handle { fill: var(--line-2); }
  .tray .body { fill: var(--pan-2); stroke: var(--dish); stroke-width: 2.5; }
  .tray text { fill: var(--pan-ink); }

  .counter-line { stroke: var(--line); stroke-width: 1.5; }
  .board .body { fill: var(--top); stroke: var(--line-2); stroke-width: 1.5; }
  .board .tick-ring { fill: none; stroke: var(--line); stroke-width: 4; }
  .board .tick-arc { fill: none; stroke: var(--hot); stroke-width: 4; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .board .label { font: 700 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; fill: var(--muted); }
  .board .title { font: 500 17px var(--display); fill: var(--ink); }
  .board .big { font: 500 24px var(--mono); letter-spacing: -.02em; fill: var(--ink); font-variant-numeric: tabular-nums; }
  .board.alarm .body { stroke: var(--alarm); stroke-width: 2.5; }
  .board.alarm .big { fill: var(--alarm); }
  .board.paused { opacity: .55; }
  .board .dot { fill: var(--dish); }

  /* ---------- bottom: Basil, the pilot light ---------- */
  footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; min-height: 76px; }
  #pilot { position: relative; flex: none; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center;
    background: var(--top); box-shadow: inset 0 0 0 1.5px var(--line-2); transition: box-shadow .3s, transform .15s var(--spring); touch-action: none; }
  #pilot:hover { box-shadow: inset 0 0 0 1.5px var(--ink); }
  #pilot:active { transform: scale(.94); }
  #pilot svg { width: 64px; height: 64px; overflow: visible; }
  #pilot .tick { stroke: var(--line-2); stroke-width: 2; stroke-linecap: round; }
  #pilot .fl { transform-box: fill-box; transform-origin: 50% 100%; transition: opacity .3s; }
  #pilot .fl-out { fill: var(--flame); }
  #pilot .fl-in { fill: var(--flame-2); }
  #pilot[data-mode="talking"] .fl-out, #pilot[data-mode="thinking"] .fl-out { fill: var(--hot); }
  #pilot[data-mode="talking"] .fl-in, #pilot[data-mode="thinking"] .fl-in { fill: #ffd08a; }
  #pilot[data-mode="asleep"] .fl, #pilot[data-mode="off"] .fl, #pilot[data-mode="ready"] .fl { opacity: 0; }
  #pilot[data-mode="ready"] .fl.pilot-only { opacity: 1; }
  #pilot .slash { stroke: var(--muted); stroke-width: 2; stroke-linecap: round; opacity: 0; }
  #pilot[data-mode="off"] .slash { opacity: 1; }
  #pilot .spark { fill: var(--hot); opacity: 0; }
  #pilot[data-mode="asleep"] { animation: invite 2.6s ease-in-out infinite; }
  @keyframes invite { 50% { box-shadow: inset 0 0 0 1.5px var(--line-2), 0 0 0 7px color-mix(in srgb, var(--flame) 14%, transparent); } }
  #pilot[data-mode="you"] { box-shadow: inset 0 0 0 2px var(--flame), 0 0 0 8px color-mix(in srgb, var(--flame) 18%, transparent); }
  #lines { min-width: 0; flex: 1; display: grid; gap: 2px; }
  .line { margin: 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #you { font-size: 15px; color: var(--muted); }
  #you.live { color: var(--ink); }
  #basil { font-size: clamp(18px, 1.7vw, 22px); line-height: 1.35; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #basil i { font-style: normal; animation: fade .3s ease-out; }
  #basil.pondering { color: var(--muted); }
  #status { font: 500 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  #status.working { color: var(--ink); animation: breathe 1.6s ease-in-out infinite; }
  .hint-key { margin-left: auto; flex: none; font: 500 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
  .hint-key kbd { display: inline-grid; place-items: center; min-width: 22px; height: 22px; padding: 0 6px; margin: 0 4px; border-radius: 6px; box-shadow: inset 0 0 0 1px var(--line-2); font: inherit; }
  @keyframes breathe { 50% { opacity: .45; } }

  /* ---------- toasts ---------- */
  #toast { position: fixed; z-index: 6; left: 50%; bottom: max(100px, calc(env(safe-area-inset-bottom) + 100px)); transform: translateX(-50%);
    display: flex; align-items: center; gap: 14px; padding: 10px 12px 10px 18px; border-radius: 999px; background: var(--ink); color: var(--bg);
    font-size: 15px; animation: toast .3s var(--spring); max-width: calc(100% - 32px); }
  #toast b { font-weight: 700; }
  #toast a, #toast button { padding: 6px 14px; border-radius: 999px; font-weight: 700; font-size: 14px; color: var(--ink); background: var(--bg); text-decoration: none; }
  #toast button.x { background: none; color: inherit; opacity: .6; padding: 6px; }
  @keyframes toast { from { transform: translate(-50%, 12px); opacity: 0; } }

  /* ---------- sheets: a drawer on the glass ---------- */
  #veil { position: fixed; inset: 0; z-index: 4; background: color-mix(in srgb, var(--bg) 55%, transparent); backdrop-filter: blur(3px); animation: fade .2s; }
  #sheet { position: fixed; z-index: 5; top: 12px; right: 12px; bottom: 12px; width: min(520px, calc(100% - 24px)); padding: 24px 26px 28px; overflow-y: auto;

<body>
<header>
  <span class="wordmark" aria-label="Basil">basil<i>.</i></span>
  <button id="serve" hidden aria-label="The plan"></button>
  <nav id="nav" aria-label="More"></nav>
</header>
<main id="hud" aria-live="polite"></main>
<div id="world" aria-hidden="true"></div>
<footer>
  <button id="pilot" data-mode="asleep" aria-label="Talk to Basil">
    <svg viewBox="-32 -32 64 64" aria-hidden="true">
      <g id="pilot-ticks"></g>
      <g class="fl" id="fl-outer"><path class="fl-out" d="M0 10 C-9 10 -11 2 -8 -4 C-6 -8 -3 -10 -2 -16 C2 -12 4 -10 7 -5 C10 1 9 10 0 10 Z"/></g>
      <g class="fl" id="fl-inner"><path class="fl-in" d="M0 10 C-4 10 -5 5 -3 1 C-2 -1 -1 -3 0 -6 C2 -3 3 -1 4 2 C5 6 4 10 0 10 Z"/></g>
      <path class="slash" d="M-12 -12 L12 12"/>
    </svg>
  </button>
  <div id="lines">
    <p class="line" id="status" hidden></p>
    <p class="line" id="you" hidden></p>
    <p class="line" id="basil" hidden></p>
  </div>
  <span class="hint-key" id="hint-key"></span>
</footer>
<div id="toast" role="status" hidden></div>
<div id="veil" hidden></div>
<aside id="sheet" hidden></aside>
<div id="howto" hidden></div>

<script>
const $ = (id) => document.getElementById(id);
// Text always goes in via textContent, so nothing the model writes can inject markup.
function h(tag, attrs = {}, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === false || v == null) continue;
    k.startsWith("on") ? el.addEventListener(k.slice(2), v) : el.setAttribute(k, v === true ? "" : v);
  }
  el.append(...kids.flat().filter((k) => k != null && k !== false));

}
const NS = "http://www.w3.org/2000/svg";

  for (const [k, v] of Object.entries(attrs)) {

    k.startsWith("on") ? el.addEventListener(k.slice(2), v) : el.setAttribute(k, v);

const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const RATE = 16000, FRAME = 320; // 20 ms frames; the API rejects chunks over 40 ms
let ws = null, screen = null, ctx, mic, muted = false, state = null, stateAt = 0;
let talking = false, hearing = false, thinking = false, consulting = false, playhead = 0;
const playing = new Set();
const rang = new Map(); // timer label -> {at, step_id}
let closedBecause = "";
let viewing = null; // a step the cook tapped to look at; null follows what's due

// ---------- connection, audio ----------
// Two connections: the screen's own, always open, which shows the saved kitchen and takes taps; and the conversation
// with Basil, which starts only from the pilot light. While a conversation is open, it carries both.
function connectScreen() {
  screen = new WebSocket(`ws://${location.host}/ws?talk=0`);
  screen.onopen = refresh;
  screen.onmessage = (e) => { if (!ws) onEvent(JSON.parse(e.data)); };
  screen.onclose = () => setTimeout(connectScreen, 1000);
}
function refresh() { if (screen?.readyState === 1) screen.send(JSON.stringify({ type: "refresh" })); }
connectScreen();

// How Basil listens: always on, tap to start and mute, or hold (the pilot or Space) to talk.
const ALWAYS_KEY = "basil.alwaysOn", HOLD_KEY = "basil.pushToTalk";
let alwaysOn = false, pushToTalk = false, holding = false, retryMs = 1000;
const stayConnected = () => alwaysOn || pushToTalk;
try { alwaysOn = localStorage.getItem(ALWAYS_KEY) === "1"; pushToTalk = !alwaysOn && localStorage.getItem(HOLD_KEY) === "1"; } catch {}
function setListen(how) {
  const wasHold = pushToTalk;
  alwaysOn = how === "always"; pushToTalk = how === "hold";
  try { localStorage.setItem(ALWAYS_KEY, alwaysOn ? "1" : "0"); localStorage.setItem(HOLD_KEY, pushToTalk ? "1" : "0"); } catch {}
  if (ws && wasHold !== pushToTalk) ws.close();
  else if (stayConnected() && !ws) wake(true);
  pilot($("pilot").dataset.mode);
  renderSheet();
}
const setAlwaysOn = (on) => setListen(on ? "always" : "tap");
function hold(on) {
  holding = on;
  mic?.getAudioTracks().forEach((t) => (t.enabled = on));
  refreshPilot();
}
document.addEventListener("pointerdown", () => {
  sfxUnlock();
  if (ctx?.state === "suspended") ctx.resume();
  if (dictationBlocked && ws?.readyState === 1) { dictationBlocked = false; try { recognizer?.start(); } catch {} }
});

let outLevel = null, inLevel = null; // analysers: Basil's voice and the cook's, to move the pilot flame
async function wake(quiet = false) {
  if (ws) return;
  ctx ||= new AudioContext({ sampleRate: RATE });
  if (!outLevel) {
    outLevel = ctx.createAnalyser(); outLevel.fftSize = 256; outLevel.connect(ctx.destination);
  }
  muted = false;
  const opened = Date.now();
  const query = [quiet && "quiet=1", pushToTalk && "ptt=1"].filter(Boolean).join("&");
  ws = new WebSocket(`ws://${location.host}/ws${query ? `?${query}` : ""}`);
  ws.onmessage = (e) => onEvent(JSON.parse(e.data));
  ws.onopen = () => ignite();
  ws.onclose = () => {
    ws = null; talking = hearing = thinking = consulting = false; busyWith = null; renderBusy(); hush();
    recognizer?.abort(); mic?.getTracks().forEach((t) => t.stop()); mic = null; inLevel = null;
    pilot("asleep");
    if (closedBecause) toast(h("span", {}, closedBecause));
    refresh();
    if (stayConnected()) {
      retryMs = Date.now() - opened < 15000 ? Math.min(retryMs * 2, 60000) : 1000;
      setTimeout(() => stayConnected() && !ws && wake(true), retryMs);
    }
    closedBecause = "";
  };
  pilot("listening");
  try { await startMic(); startDictation(); } catch { pilot("off"); toast(h("span", {}, "No microphone")); }
}

let worklet = null;
async function startMic() {
  mic = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, channelCount: 1 } });
  const src = `registerProcessor("mic", class extends AudioWorkletProcessor {
    constructor() { super(); this.buf = new Int16Array(${FRAME}); this.n = 0; }
    process([input]) {
      for (const s of input[0] || []) {
        this.buf[this.n++] = Math.max(-1, Math.min(1, s)) * 0x7fff;
        if (this.n === ${FRAME}) { this.port.postMessage(this.buf.slice().buffer); this.n = 0; }
      }
      return true;
    }

  worklet ||= ctx.audioWorklet.addModule(URL.createObjectURL(new Blob([src], { type: "text/javascript" })));

  node.port.onmessage = (e) => {
    if (muted || ws?.readyState !== 1) return;
    let str = "";
    for (const b of new Uint8Array(e.data)) str += String.fromCharCode(b);
    ws.send(JSON.stringify({ type: "audio", audio: btoa(str) }));
  };
  const source = ctx.createMediaStreamSource(mic);
  source.connect(node);
  inLevel = ctx.createAnalyser(); inLevel.fftSize = 256; source.connect(inLevel);

  refreshPilot();
}

// The pilot: tap to start Basil (and then to mute); in hold mode, hold it or Space.
$("pilot").onclick = () => {
  if (pushToTalk) return;
  if (!ws) return wake(); if (!mic) return; muted = !muted; mic.getAudioTracks().forEach((t) => (t.enabled = !muted)); refreshPilot();
};
$("pilot").addEventListener("pointerdown", (e) => {
  if (!pushToTalk) return;
  $("pilot").setPointerCapture(e.pointerId);
  hold(true);
  if (!ws) wake();
});
for (const end of ["pointerup", "pointercancel", "lostpointercapture"]) $("pilot").addEventListener(end, () => pushToTalk && holding && hold(false));

function play(audio) {
  const bin = atob(audio), n = bin.length >> 1, buf = ctx.createBuffer(1, n, RATE), out = buf.getChannelData(0);
  for (let i = 0; i < n; i++) { const v = bin.charCodeAt(2 * i) | (bin.charCodeAt(2 * i + 1) << 8); out[i] = (v > 32767 ? v - 65536 : v) / 32768; }

  node.start(playhead); playhead += buf.duration;
  playing.add(node); node.onended = () => playing.delete(node);
}
function hush() { playing.forEach((n) => n.stop()); playing.clear(); playhead = 0; }

// Live words while the cook talks: the browser's own recognition fills the gap before Phonic's transcript.
let recognizer = null, dictationBlocked = false;

  recognizer.onend = () => { if (ws?.readyState === 1 && !dictationBlocked) setTimeout(() => recognizer?.start(), 250); };

}

const SLOW_TOOLS = ["think_it_through", "plan_dish"];
let busyWith = null, busySince = 0, busyTicker = null;
function busyLabel(tool, parameters = {}) {

}

}

function onEvent(m) {
  switch (m.type) {
    case "audio_chunk": play(m.audio); if (m.text) stream(m.text); break;
    case "input_text": said("you", m.text, false); break;
    case "tool_started":
      if (SLOW_TOOLS.includes(m.tool_name)) { consulting = true; busyWith = busyLabel(m.tool_name, m.parameters); renderBusy(); }
      break;
    case "tool_result":
      if (m.silent) setThinking(false);
      if (m.tool_name === "show_on_screen" && m.output.ok) showOnScreen(m.output);
      if (m.tool_name === "set_listening" && m.output.ok) setAlwaysOn(m.output.always);
      if (SLOW_TOOLS.includes(m.tool_name)) { consulting = false; busyWith = null; renderBusy(); }
      break;
    case "assistant_started_speaking": talking = true; setThinking(false); said("basil", "", true); break;
    case "assistant_finished_speaking": talking = false; break;
    case "interrupted_response": talking = false; hush(); break;
    case "user_started_speaking": hearing = true; hush(); said("you", "", true); break;
    case "user_finished_speaking": hearing = false; $("you").classList.remove("live"); setThinking(true); break;
    case "timer_fired": ring(m.label); break;
    case "phonic_closed": closedBecause = m.reason; break;
    case "state":
      state = m; stateAt = Date.now();
      if (!hearing && (m.said.cook || "") !== $("you").textContent) said("you", m.said.cook || "", false);
      if (!talking && !consulting && (m.said.basil || "") !== basilText) said("basil", m.said.basil || "", false);
      for (const [label, r] of rang) if (r.step_id && m.steps.find((x) => x.id === r.step_id)?.status === "done") rang.delete(label);
      render();
      break;
  }
  refreshPilot();
}

let basilText = "";

  basilText += text;
  $("basil").append(h("i", {}, text));
  $("basil").hidden = false;
}

function pilot(mode) {

  $("pilot").setAttribute("aria-label", pushToTalk ? "Hold to talk to Basil" : mode === "asleep" ? "Talk to Basil" : "Mute or unmute");
  $("pilot").title = pushToTalk ? "Hold to talk, or hold Space" : mode === "asleep" ? "Light the stove: talk to Basil" : "";

}

  pilot(muted ? "off" : holding ? "you" : talking ? "talking" : hearing ? "you" : thinking || consulting ? "thinking" : idle);

// The pilot flame moves with whoever's talking: steady and small while listening, tall with your voice, orange
// and dancing with Basil's.
const levelBuf = new Uint8Array(256);
const level = (an) => { if (!an) return 0; an.getByteTimeDomainData(levelBuf); let m = 0; for (const v of levelBuf) m = Math.max(m, Math.abs(v - 128)); return m / 128; };

function animatePilot(t) {
  const mode = $("pilot").dataset.mode;
  let target = 0.55;
  if (mode === "you") target = 0.75 + level(inLevel) * 2.2;
  else if (mode === "talking") target = 0.8 + level(outLevel) * 2.4;
  else if (mode === "thinking") target = 0.5 + 0.18 * Math.sin(t / 140) + 0.1 * Math.sin(t / 57);
  else if (mode === "listening") target = 0.6 + 0.04 * Math.sin(t / 600);
  target = Math.min(target, 1.6);
  flameY += (target - flameY) * 0.25;
  flameX = 1 + 0.06 * Math.sin(t / 90);
  $("fl-outer").style.transform = `scale(${flameX}, ${flameY})`;
  $("fl-inner").style.transform = `scale(${2 - flameX}, ${Math.max(0.3, flameY * 0.9)})`;
  requestAnimationFrame(animatePilot);
}
for (let i = 0; i < 24; i++) {
  const a = (i / 24) * 2 * Math.PI, r1 = 27, r2 = i % 6 ? 29 : 30.5;
  $("pilot-ticks").append(s("line", { class: "tick", x1: r1 * Math.sin(a), y1: -r1 * Math.cos(a), x2: r2 * Math.sin(a), y2: -r2 * Math.cos(a) }));
}

// Small, quiet sounds, all made here: a click for a tap, a tock for done, the igniter for Basil arriving.

  start: () => { if (!sfx) return; click(0); click(0.07); woosh(0.12, 0.6); },
  ignite: () => { if (!sfx) return; click(0, 3600, 0.07); click(0.11, 3600, 0.07); click(0.22, 3600, 0.07); woosh(0.3, 0.9); },
  ring: () => { if (!sfx) return; [[880, 0], [1175, 0.16], [880, 0.5], [1175, 0.66]].forEach(([f, at]) => tone(f, at, 0.07, 0.5)); },

// ---------- helpers ----------
function hello() {

  if (hour >= 5 && hour < 11) return "Morning. What are we making?";
  if (hour >= 11 && hour < 15) return "What's for lunch?";

function act(action, extra = {}) {

function hours(m) {

// Short durations for small spaces: "12m", "1h 20".

const none = (have) => have != null && /^(none|no|0|out|nothing)\b/i.test(String(have).trim());

// ---------- the plan ----------
const READY_FOR_MS = 20 * 60 * 1000;
function plan() {
  const finished = state?.finished_at != null;
  const eating = finished && Date.now() - state.finished_at * 1000 < READY_FOR_MS;
  const steps = finished && !eating ? [] : state?.steps || [];
  const open = steps.filter((x) => x.status !== "done");
  const ready = open.filter((x) => x.status === "pending" && x.start === 0);
  const hands = (state?.cooks || [null]).map((_, i) =>
    ready.find((x) => x.hands_on && (x.cook ?? 0) === i) || open.find((x) => x.hands_on && x.status === "in_progress" && (x.cook ?? 0) === i));
  const current = (hands[0]?.status === "pending" && hands[0]) || ready.find((x) => !x.hands_on) || hands[0] || hands.find(Boolean);
  const running = open.find((x) => x.status === "in_progress");
  const upcoming = open.filter((x) => x.status === "pending" && x.start > 0).sort((a, b) => a.start - b.start)[0];
  const shown = steps.find((x) => x.id === viewing) || current || running || upcoming;
  return { steps, open, ready, hands, current, running, upcoming, shown, eating };
}
const LATE_AFTER = 5;
const readyAt = () => stateAt + Math.max(0, ...plan().open.map((x) => x.end ?? 0)) * 60000;
const lateBy = () => (state?.serve_at && plan().open.length ? (readyAt() - state.serve_at * 1000) / 60000 : 0);

// What the HUD shows, most urgent first: a timer that's gone off, then each cook's work, then what can be started.
// With nothing to do yet, the next thing coming.
function objectives() {
  const out = [];
  for (const [label, r] of rang) out.push({ kind: "rang", key: `rang:${label}`, label, r });
  const { steps, open, ready, hands, current, upcoming, shown, eating } = plan();
  if (viewing && shown) return [...out, { kind: "step", key: shown.id, s: shown, viewing: true }];
  const many = (state?.cooks?.length || 1) > 1;
  if (many) {
    const nextFor = (i) => open.filter((x) => x.hands_on && x.status === "pending" && (x.cook ?? 0) === i && unblocked(x)).sort((a, b) => a.start - b.start)[0];
    hands.forEach((x, i) => { const st = x || nextFor(i); if (st && !out.some((o) => o.s === st)) out.push({ kind: "step", key: st.id, s: st, cook: i }); });
    for (const st of ready.filter((x) => !x.hands_on && !out.some((o) => o.s === x)).slice(0, 1)) out.push({ kind: "step", key: st.id, s: st, anyone: true });
  } else if (current) out.push({ kind: "step", key: current.id, s: current });
  if (!out.some((o) => o.kind === "step") && upcoming) out.push({ kind: "step", key: upcoming.id, s: upcoming });
  if (!out.length && eating && steps.length) out.push({ kind: "eat", key: "eat" });
  return out;
}

const setAside = new Set();

function link(url, label, cls) { return h("a", { class: cls, href: url, target: "_blank", rel: "noopener" }, label); }

// Which burner each burner step is on. A dish keeps its pan where it was (sear, deglaze, braise in one pan), steps
// already going keep their burner, and upcoming steps take the burner that frees up first.
function assignBurners(steps) {
  const B = geometry.B;
  const taken = new Array(B).fill(null); // what's on each burner now
  const freeAt = new Array(B).fill(0); // when each burner frees up (minutes from now)
  const active = (x) => x.status === "in_progress" || (x.status === "pending" && x.start === 0);
  const burnerSteps = steps.filter((x) => x.equipment === "burner");
  const lastFor = (dish) => { // the burner this dish's latest burner step was on
    for (const x of [...burnerSteps].reverse()) if (x.dish === dish && x.status === "done" && burnerOf.has(x.id)) return burnerOf.get(x.id);
    return null;
  };
  const place = (x, from) => {
    const want = [burnerOf.get(x.id), lastFor(x.dish)].filter((b) => b != null && b < B);
    for (const b of want) if (from(b)) return b;
    for (let b = 0; b < B; b++) if (from(b)) return b;
    return null;
  };
  const now = burnerSteps.filter(active).sort((a, b) => (a.status === "in_progress" ? 0 : 1) - (b.status === "in_progress" ? 0 : 1));
  // A step that follows straight on from one still in a pan (finish the sauce after the braise) is that pan's next
  // step, not a second pan.
  const inPan = (x) => taken.some((t) => t && t.dish === x.dish && x.after.includes(t.id));
  for (const x of now) {
    if (inPan(x)) continue;
    const b = place(x, (b) => !taken[b]);
    if (b == null) continue;
    taken[b] = x; freeAt[b] = x.end ?? 0; burnerOf.set(x.id, b);
  }
  // The next step for each empty burner, shown as a ghost
  const ghosts = new Array(B).fill(null);
  const later = burnerSteps.filter((x) => x.status === "pending" && x.start > 0).sort((a, b) => a.start - b.start);
  for (const x of later) {
    const b = place(x, (b) => freeAt[b] <= x.start + 0.01);
    if (b == null) continue;
    if (!taken[b] && !ghosts[b]) ghosts[b] = x;
    freeAt[b] = x.end ?? x.start + x.minutes; burnerOf.set(x.id, b);
  }
  return { taken, ghosts };
}

const POT_WORDS = /\b(boil|blanch|simmer|braise|stock|pasta|poach|pot|soup|potatoes|water|beans)\b/i;
function timerFor(st) { return (state.timers || []).find((t) => t.step_id === st.id && t.kind !== "reminder"); }

function timing(st) {

  if (st.status === "in_progress" && !st.hands_on && st.end != null) return { until: stateAt + st.end * 60000, total: st.minutes * 60 };

  }
  for (const el of document.querySelectorAll(".oven-glow[data-until]")) {
    const left = (el.dataset.until - now) / 1000, frac = 1 - Math.max(0, Math.min(1, left / (Number(el.dataset.total) || 1)));
    el.style.opacity = 0.15 + 0.75 * frac;
  }
  for (const el of document.querySelectorAll(".tick-arc[data-until]")) {
    const left = (el.dataset.until - now) / 1000, frac = Math.max(0, Math.min(1, left / (Number(el.dataset.total) || 1)));
    el.setAttribute("stroke-dashoffset", 2 * Math.PI * 24 * (1 - frac));
  }
  if (now % 2000 < 1000) for (const el of document.querySelectorAll("img[data-live]")) el.src = `/shopper-frame?${now}`;
  for (const el of document.querySelectorAll("[data-until]:not(.flames):not(.oven-glow):not(.tick-arc)")) {
    const sec = (el.dataset.until - now) / 1000;
    el.textContent = "in" in el.dataset ? `in ${hours(sec / 60)}` : "short" in el.dataset ? short(sec / 60) : clock(sec);
  }
}
setInterval(tick, 1000);
pilot("asleep");
if (stayConnected()) wake(true);
</script>
</body>
