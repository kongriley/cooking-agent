<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Basil</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath d='M8 15C3 13 2 7 4 3c3 0 9 2 9 7 0 3-2 5-5 5z' fill='%232f8f5b'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700;800&display=swap">
<style>
  /* The stove: the cook's range, seen from the front and a little above. Each dish is a pot in its own colour on the
     burner it's using; the card beside it is the one thing to do now. Basil is the leaf. */
  :root {
    --bg: #f1ebe1; --top: #fffbf5; --ink: #211b14; --muted: #8b8070; --line: #e6dccc; --line-2: #d4c7b3;
    --enamel: #2f8f5b; --enamel-lo: #23714a; --steel: #24272a; --bowl: #1a1c1e;
    --flame: #3f7bff; --flame-2: #a9c4ff; --hot: #ff8a2a; --alarm: #ee3d2c;
    --go: #2f8f5b; --go-lo: #1f6a42;
    --d0: #f0692c; --d1: #2f6fd6; --d2: #e9ad1c; --d3: #d63a63; --d4: #8a5cdc; --d5: #17a2a0; --d6: #ef8fb2; --d7: #a06c42;
    --c0: #ff5a4e; --c1: #3d8bff; --c2: #f0a81a; --c3: #a96bff;
    --display: "Rubik", ui-rounded, system-ui, sans-serif; --mono: var(--display);
    --ease: cubic-bezier(.2, .9, .25, 1); --spring: cubic-bezier(.34, 1.56, .5, 1);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #121419; --top: #1d2027; --ink: #f2eee6; --muted: #8d939f; --line: #2a2e37; --line-2: #3a404c; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #121419; --top: #1d2027; --ink: #f2eee6; --muted: #8d939f; --line: #2a2e37; --line-2: #3a404c; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--ink); font-family: var(--display); overflow: hidden;
    display: grid; grid-template-columns: minmax(320px, 2fr) minmax(0, 3fr); grid-template-rows: auto minmax(0, 1fr) auto;
    column-gap: clamp(24px, 4vw, 72px);
    padding-block: max(18px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-bottom));
    padding-inline: clamp(16px, 4vw, 64px); user-select: none; -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
  button:focus-visible { outline: 3px solid var(--flame); outline-offset: 4px; border-radius: 12px; }
  [hidden] { display: none !important; }

  header { grid-column: 1 / -1; display: flex; align-items: center; min-height: 40px; }
  .wordmark { font-size: 22px; font-weight: 800; letter-spacing: -.04em; }
  nav { margin-left: auto; display: flex; gap: 4px; }
  nav button { position: relative; padding: 8px 14px; border-radius: 999px; font-weight: 500; font-size: 15px; color: var(--muted); }
  nav button:hover, nav button[aria-expanded="true"] { color: var(--ink); background: color-mix(in srgb, var(--ink) 7%, transparent); }
  nav button.flag::after { content: ""; position: absolute; top: 6px; right: 6px; width: 7px; height: 7px; border-radius: 50%; background: var(--hot); }

  /* ---------- the card: what to do now ---------- */
  #quest { grid-column: 1; grid-row: 2; min-height: 0; display: flex; flex-direction: column; justify-content: safe center; gap: 28px; overflow-y: auto; scrollbar-width: none; }
  .now { display: grid; gap: 18px; justify-items: start; }
  .now.enter { animation: rise .45s var(--ease) both; }
  @keyframes rise { from { transform: translateY(20px); opacity: 0; } }
  .meta { display: flex; align-items: center; gap: 10px; font-weight: 500; font-size: 15px; color: var(--muted); }
  .meta .dish { display: flex; align-items: center; gap: 8px; color: var(--ink); }
  .meta .dish::before { content: ""; width: 12px; height: 12px; border-radius: 4px; background: var(--dish); }
  .meta .who { color: var(--cook); font-weight: 700; }
  .meta .alarm { color: var(--alarm); font-weight: 700; }
  .now h1 { margin: 0; font-weight: 800; font-size: clamp(40px, 4.6vw, 76px); line-height: .98; letter-spacing: -.035em; text-wrap: balance; }
  .now.rung h1 { color: var(--alarm); }
  .instruction { margin: 0; display: grid; gap: .35em; max-width: 30ch; font-size: clamp(19px, 1.7vw, 25px); line-height: 1.3; text-wrap: pretty; }
  .instruction p { margin: 0; }
  .instruction b { font-weight: 700; }
  .instruction .cue { color: var(--muted); }
  .uses { margin: 0; font-size: 15px; color: var(--muted); }
  .uses .out { color: var(--alarm); }
  .act { display: flex; align-items: center; gap: 12px; margin-top: 6px; }
  .go { height: 64px; padding: 0 36px; border-radius: 20px; background: var(--go); color: #fff; font-weight: 700; font-size: 23px;
    box-shadow: 0 6px 0 var(--go-lo); transition: transform .08s, box-shadow .08s; }
  .go:active, .go.pressed { transform: translateY(6px); box-shadow: 0 0 0 var(--go-lo); }
  .go.alarm { --go: var(--alarm); --go-lo: #a8251a; }
  .quiet { height: 52px; padding: 0 20px; border-radius: 16px; font-weight: 500; font-size: 17px; color: var(--muted); box-shadow: inset 0 0 0 2px var(--line-2); }
  .quiet:hover { color: var(--ink); }
  .when { font-weight: 700; font-size: clamp(28px, 2.6vw, 38px); letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .back { font-weight: 500; font-size: 15px; color: var(--muted); }
  .hello { margin: 0; font-size: clamp(40px, 4.4vw, 68px); font-weight: 800; line-height: 1; letter-spacing: -.04em; text-wrap: balance; }
  .hello.working { color: var(--muted); animation: blink 1.6s ease-in-out infinite; }
  .sub { margin: 0; font-size: 18px; color: var(--muted); }
  /* Everyone else, and anything on the counter: one line each. */
  .also { display: grid; gap: 2px; padding-top: 18px; border-top: 2px solid var(--line); }
  .also .row { display: flex; align-items: center; gap: 12px; min-height: 44px; font-size: 18px; }
  .also .row > span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .also .who { font-weight: 700; color: var(--cook); }
  .also .t { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .also .rung .t { color: var(--alarm); }
  .also button { padding: 8px 16px; border-radius: 12px; font-weight: 700; font-size: 15px; background: color-mix(in srgb, var(--ink) 7%, transparent); }
  .also button:hover { background: color-mix(in srgb, var(--ink) 12%, transparent); }

  /* ---------- the stove ---------- */
  #scene { grid-column: 2; grid-row: 2; min-height: 0; display: grid; place-items: center; }
  #scene > svg { width: 100%; height: 100%; max-height: 760px; overflow: visible; }
  .cooktop { fill: var(--steel); }
  .front { fill: var(--enamel); }
  .front-lo { fill: var(--enamel-lo); }
  .lip { fill: #c9ccc6; }
  .bowl { fill: var(--bowl); }
  .cap { fill: #34383b; }
  .flames { opacity: 0; transition: opacity .4s; }
  .on > .flames, .ignite .flames { opacity: 1; }
  .petal { fill: var(--flame); }
  .petal-g { transform-box: fill-box; transform-origin: 50% 100%; animation: flick var(--t, .45s) ease-in-out infinite alternate; animation-delay: var(--dl, 0s); }
  @keyframes flick { from { transform: scale(.9, .72); } to { transform: scale(1.05, 1.1); } }
  .low .petal-g { scale: .7; }
  .rung .petal { fill: var(--alarm); }
  .ignite .flames { animation: catch 1.3s var(--ease) both; animation-delay: calc(var(--i) * .12s); }
  @keyframes catch { 0% { opacity: 0; } 20%, 70% { opacity: 1; } 100% { opacity: var(--rest, 0); } }

  .pot { cursor: pointer; }
  .pot .body, .pot .lid { fill: var(--dish); }
  .pot .shade { fill: url(#shade); pointer-events: none; }
  .pot .rim { fill: none; stroke: color-mix(in srgb, var(--dish) 72%, #000); stroke-width: 4; }
  .pot .well { fill: #2a2b2c; }
  .pot .handle { stroke: #2d2e2f; stroke-width: 16; stroke-linecap: round; }
  .pot .track { fill: none; stroke: rgb(0 0 0 / .2); stroke-width: 7; }
  .pot .bar { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .pot .big { font: 700 38px var(--display); fill: #fff; text-anchor: middle; font-variant-numeric: tabular-nums; }
  .pot .word { font: 700 20px var(--display); fill: #fff; text-anchor: middle; }
  .pot .focus { fill: none; stroke: var(--ink); stroke-width: 4; stroke-dasharray: 10 10; animation: march 1.2s linear infinite; }
  @keyframes march { to { stroke-dashoffset: -20; } }
  .wobble { transform-box: fill-box; transform-origin: 50% 100%; }
  .rung .wobble { animation: rattle .32s ease-in-out infinite; }
  @keyframes rattle { 25% { transform: rotate(-2.5deg) translateY(-3px); } 75% { transform: rotate(2.5deg); } }
  .rung .bar { stroke: var(--alarm); }
  .drop { transform-box: fill-box; transform-origin: 50% 100%; animation: drop .5s var(--spring) both; }
  @keyframes drop { from { transform: translateY(-80px); opacity: 0; } 50% { opacity: 1; } }
  .ghost { fill: none; stroke: #5d6166; stroke-width: 3; stroke-dasharray: 2 10; stroke-linecap: round; }
  .ghost-text { font: 500 20px var(--display); fill: #9aa0a6; text-anchor: middle; font-variant-numeric: tabular-nums; }
  .cook circle { fill: var(--cook); stroke: var(--steel); stroke-width: 4; }
  .cook text { font: 800 17px var(--display); fill: #fff; text-anchor: middle; }

  .window { fill: #141516; }
  .glow { fill: url(#glow); opacity: 0; transition: opacity 1.2s; }
  .oven.hot .glow { opacity: 1; }
  .handlebar { fill: #c9ccc6; }
  .tray { cursor: pointer; }
  .tray text { font: 700 22px var(--display); fill: #fff; }
  .tray .t { text-anchor: end; font-variant-numeric: tabular-nums; }
  .tray .track { stroke: rgb(255 255 255 / .2); stroke-width: 5; stroke-linecap: round; }
  .tray .bar { stroke: #fff; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 1s linear; }
  .tray.rung text { fill: #ffd2c9; }
  .tray .focus { fill: none; stroke: #fff; stroke-width: 3; stroke-dasharray: 8 8; animation: march 1.2s linear infinite; }

  /* ---------- Basil ---------- */
  footer { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; min-height: 80px; }
  #pilot { flex: none; width: 64px; height: 64px; touch-action: none; transition: transform .15s var(--spring); }
  #pilot:active { transform: scale(.92); }
  #pilot svg { width: 100%; height: 100%; overflow: visible; }
  #pilot .leaf { fill: var(--enamel); }
  #pilot .eye { fill: #fff; }
  #pilot .pupil { fill: var(--ink); transition: transform .3s var(--spring); }
  #pilot .shut { fill: none; stroke: #fff; stroke-width: 4; stroke-linecap: round; opacity: 0; }
  #pilot .open { transition: opacity .2s; }
  #pilot .mouth { fill: #1d3b2a; transform-box: fill-box; transform-origin: 50% 0; transition: transform .08s; }
  #pilot .ring { fill: none; stroke: var(--flame); stroke-width: 4; opacity: 0; transform-box: fill-box; transform-origin: center; }
  #pilot .body { transform-box: fill-box; transform-origin: 50% 100%; }
  #pilot[data-mode="asleep"] .open, #pilot[data-mode="off"] .open { opacity: 0; }
  #pilot[data-mode="asleep"] .shut, #pilot[data-mode="off"] .shut { opacity: 1; }
  #pilot[data-mode="asleep"] .body { animation: snooze 3s ease-in-out infinite; }
  @keyframes snooze { 50% { transform: scale(1.03, .97); } }
  #pilot[data-mode="you"] .ring { opacity: 1; animation: ping 1.2s ease-out infinite; }
  @keyframes ping { from { transform: scale(.9); opacity: .9; } to { transform: scale(1.3); opacity: 0; } }
  #pilot[data-mode="thinking"] .pupil { transform: translate(2px, -3px); }
  #pilot[data-mode="talking"] .body { animation: talk .5s ease-in-out infinite; }
  @keyframes talk { 50% { transform: translateY(-2px); } }
  #pilot.hop .body { animation: hop .6s var(--spring); }
  @keyframes hop { 30% { transform: translateY(-16px) rotate(-6deg); } }
  #lines { min-width: 0; flex: 1; display: grid; gap: 4px; }
  .line { margin: 0; min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  #you { font-size: 15px; color: var(--muted); }
  #you.live { color: var(--ink); }
  #basil { font-size: clamp(18px, 1.6vw, 22px); line-height: 1.35; white-space: normal; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  #basil.pondering { color: var(--muted); }
  #basil i { font-style: normal; animation: b-fade .25s ease-out; }
  #status { font-weight: 500; font-size: 14px; color: var(--muted); animation: blink 1.6s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .45; } }

  @media (max-width: 960px), (max-aspect-ratio: 1/1) {
    body { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto auto minmax(0, 1fr) auto; row-gap: 16px; }
    #quest { grid-row: 2; justify-content: start; overflow: visible; gap: 16px; }
    #scene { grid-column: 1; grid-row: 3; }
    .now { gap: 12px; }
    .now h1 { font-size: clamp(32px, 8vw, 52px); }
    .instruction { font-size: clamp(17px, 4.3vw, 21px); max-width: none; }
  }
  @media (max-width: 640px) {
    html, body { height: auto; min-height: 100%; }
    body { overflow-y: auto; grid-template-rows: auto auto auto auto; }
    #scene > svg { height: auto; }
    footer { position: sticky; bottom: 0; margin-inline: -16px; padding: 8px 16px; background: var(--bg); min-height: 64px; }
    #pilot { width: 52px; height: 52px; }
    .go { height: 56px; font-size: 20px; }
    .uses { display: none; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <span class="wordmark">basil</span>
  <nav id="nav" aria-label="More"></nav>
</header>
<main id="quest" aria-live="polite"></main>
<div id="scene" aria-hidden="true"></div>
<footer>
  <button id="pilot" data-mode="asleep" aria-label="Talk to Basil">
    <svg viewBox="-46 -52 92 100" aria-hidden="true">
      <circle class="ring" cx="0" cy="0" r="42"/>
      <g class="body">
        <path class="leaf" d="M0 44 C-32 38 -44 10 -38 -16 C-34 -36 -14 -48 4 -50 C28 -44 42 -22 40 2 C38 26 22 42 0 44 Z"/>
        <g class="open">
          <ellipse class="eye" cx="-12" cy="-10" rx="8" ry="10"/><circle class="pupil" cx="-11" cy="-8" r="4.5"/>
          <ellipse class="eye" cx="14" cy="-10" rx="8" ry="10"/><circle class="pupil" cx="15" cy="-8" r="4.5"/>
        </g>
        <path class="shut" d="M-19 -9 Q-12 -3 -5 -9 M7 -9 Q14 -3 21 -9"/>
        <path class="mouth" id="mouth" d="M-7 9 Q1 11 9 9 Q8 17 1 17 Q-6 17 -7 9 Z"/>
      </g>
    </svg>
  </button>
  <div id="lines">
    <p class="line" id="status" hidden></p>
    <p class="line" id="you" hidden></p>
    <p class="line" id="basil" hidden></p>
  </div>
</footer>

<script src="/core.js"></script>
<script>
// ---------- the stove ----------
// Seen from the front and a little above: across stays across, depth is squashed by K, height goes straight up. A
// burner is an ellipse, a pot a cylinder, and the oven door faces you.
const K = 0.5;
const RX = 0, RW = 700, TOP = 0, DEPTH = 300, LIP = 14;
const FRONT = TOP + DEPTH + LIP, BOTTOM = FRONT + 300;

const ellipsePath = (cx, cy, rx, ry) => `M${cx} ${cy - ry}A${rx} ${ry} 0 1 1 ${cx} ${cy + ry}A${rx} ${ry} 0 1 1 ${cx} ${cy - ry}`;
const cylinder = (cx, cy, rx, ry, hgt) => `M${cx - rx} ${cy - hgt}L${cx - rx} ${cy}A${rx} ${ry} 0 0 0 ${cx + rx} ${cy}L${cx + rx} ${cy - hgt}Z`;
const cookColor = (i) => `var(--c${(i ?? 0) % 4})`;
const LOW = /\b(simmer|low|warm|melt|poach|gentle)\b/i;

function burnerGrid(B) {
  const rows = B > 2 ? 2 : 1, cols = Math.ceil(B / rows);
  const cw = (RW - 40) / cols, rh = (DEPTH - 20) / rows;
  const r = Math.min(cw * 0.4, (rh / K) * 0.38, 130);
  return Array.from({ length: B }, (_, b) => {
    const row = rows === 1 ? 0 : b < cols ? 0 : 1, col = rows === 1 ? b : b % cols;
    return { b, row, r, cx: RX + 20 + cw * (col + 0.5), cy: TOP + 10 + rh * (row + 0.5) };
  });
}

function petals(cx, cy, rx, ry, front) {
  const g = s("g", { class: "flames" }), n = 20;
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    if ((Math.sin(a) > 0) !== front) continue;
    g.append(s("g", { transform: `translate(${(cx + Math.cos(a) * rx).toFixed(1)} ${(cy + Math.sin(a) * ry).toFixed(1)})` },
      s("path", { class: "petal petal-g", d: "M0 0C-6 -2 -6 -11 0 -22C6 -11 6 -2 0 0Z", style: `--t: ${(0.32 + ((i * 37) % 10) / 40).toFixed(2)}s; --dl: ${(-((i * 53) % 10) / 20).toFixed(2)}s` })));
  }
  return g;
}

function timeText(tm, x, y, cls) {
  if (tm.paused) return s("text", { class: cls, x, y }, clock(tm.left));
  return s("text", { class: cls, x, y, "data-until": tm.until, "data-clock": "" }, clock((tm.until - Date.now()) / 1000));
}
const ringAttrs = (tm) => ({ "data-ring": "", "data-until": tm.paused ? "" : tm.until, "data-total": tm.total, "data-left": tm.left ?? "",
  pathLength: 100, "stroke-dasharray": 100, "stroke-dashoffset": (100 * (1 - remaining(tm))).toFixed(2) });

// A pot for boiling and simmering, an open pan for the rest. The time left runs round the rim and is written on top.
function pot(g, pan, focus) {
  const { cx, cy, r } = g, st = pan.step;
  const rx = r * 0.86, ry = rx * K, hgt = pan.pot ? rx * 0.45 : rx * 0.18, top = cy - hgt;
  const on = st.status === "in_progress";
  const el = s("g", { class: ["pot", on && "on", on && LOW.test(`${st.title} ${st.text}`) && "low", pan.rung && "rung"].filter(Boolean).join(" "),
    style: `--dish: ${dishColor(st.dish)}; --i: ${g.b}; --rest: ${on ? 1 : 0}`, "data-key": pan.key, onclick: () => view(st.id) });
  el.append(petals(cx, cy, rx * 1.06, ry * 1.06, false));
  const w = s("g", { class: "wobble" });
  if (!pan.pot) w.append(s("line", { class: "handle", x1: cx + rx * 0.9, y1: top + 4, x2: cx + rx + r * 0.7, y2: top + ry * 0.8 }));
  w.append(s("path", { class: "body", d: cylinder(cx, cy, rx, ry, hgt) }), s("path", { class: "shade", d: cylinder(cx, cy, rx, ry, hgt) }),
    s("ellipse", { class: "lid", cx, cy: top, rx, ry }));
  if (pan.pot) w.append(s("ellipse", { class: "rim", cx, cy: top, rx: rx - 2, ry: ry - 1 }));
  else w.append(s("ellipse", { class: "well", cx, cy: top + 2, rx: rx - 11, ry: ry - 6 }));
  const tm = pan.timing, big = Math.min(40, rx * 0.38);
  if (tm && !pan.rung) {
    w.append(s("path", { class: "track", d: ellipsePath(cx, top, rx - 10, ry - 6) }), s("path", { class: "bar", d: ellipsePath(cx, top, rx - 10, ry - 6), ...ringAttrs(tm) }));
    const t = timeText(tm, cx, top + big * 0.36, "big"); t.style.fontSize = `${big}px`; w.append(t);
  } else if (pan.rung) {
    w.append(s("text", { class: "big", x: cx, y: top + big * 0.36, style: `font-size: ${big}px` }, "Done"));
  } else {
    w.append(s("text", { class: "word", x: cx, y: top + 7, style: `font-size: ${Math.min(20, rx * 0.19)}px` }, pan.rung ? "Done" : st.status === "pending" ? "Start" : st.title.split(" ")[0]));
  }
  el.append(w, petals(cx, cy, rx * 1.06, ry * 1.06, true));
  if (focus) el.append(s("ellipse", { class: "focus", cx, cy, rx: rx * 1.22, ry: ry * 1.22 }));
  if (st.hands_on && st.cook != null && state.cooks.length > 1) {
    el.append(s("g", { class: "cook", style: `--cook: ${cookColor(st.cook)}`, transform: `translate(${cx - rx + 4} ${cy + ry * 0.6})` },
      s("circle", { r: 18 }), s("text", { y: 6 }, (state.cooks[st.cook]?.[0] || "?").toUpperCase())));
  }
  return el;
}

function burner(g, ghost) {
  const { cx, cy, r } = g;
  const el = s("g", { class: "burner", style: `--i: ${g.b}` });
  el.append(petals(cx, cy, r * 0.42, r * 0.42 * K, false), petals(cx, cy, r * 0.42, r * 0.42 * K, true));
  if (ghost) {
    const rx = r * 0.86;
    el.append(s("ellipse", { class: "ghost", cx, cy: cy - 6, rx, ry: rx * K }),
      s("text", { class: "ghost-text", x: cx, y: cy + 1, "data-until": ghost.at, "data-in": "" }, `in ${hours((ghost.at - Date.now()) / 60000)}`));
    el.style.cursor = "pointer";
    el.addEventListener("click", () => view(ghost.step.id));
  }
  return el;
}

// The oven's window lights up with what's in it.
function oven(x, y, w, hgt, o, focusId) {
  const el = s("g", { class: `oven${o.hot ? " hot" : ""}` });
  const wx = x + 30, wy = y + 40, ww = w - 60, wh = hgt - 64;
  el.append(s("rect", { class: "handlebar", x: x + 50, y: y + 12, width: w - 100, height: 10, rx: 5 }),
    s("rect", { class: "window", x: wx, y: wy, width: ww, height: wh, rx: 14 }), s("rect", { class: "glow", x: wx, y: wy, width: ww, height: wh, rx: 14 }));
  const items = o.heating ? [o.heating, ...o.items].slice(0, 2) : o.items;
  items.forEach((it, k) => {
    const st = it.step, tm = it.timing, ty = wy + (items.length > 1 ? 30 + k * (wh / 2) : wh / 2 - 14), tx = wx + 28, tw = ww - 56;
    const tray = s("g", { class: `tray${it.rung ? " rung" : ""}`, onclick: () => view(st.id) },
      s("text", { x: tx, y: ty + 18 }, abbreviate(st === o.heating?.step ? "Heating" : st.dish, 22)));
    if (tm) {
      tray.append(timeText(tm, tx + tw, ty + 18, "t"),
        s("line", { class: "track", x1: tx, y1: ty + 36, x2: tx + tw, y2: ty + 36 }), s("line", { class: "bar", x1: tx, y1: ty + 36, x2: tx + tw, y2: ty + 36, ...ringAttrs(tm) }));
    }
    if (st.id === focusId) tray.append(s("rect", { class: "focus", x: tx - 14, y: ty - 10, width: tw + 28, height: 60, rx: 12 }));
    el.append(tray);
  });
  return el;
}

let lastKeys = new Set();
function drawScene() {
  const { B, O, burners, ovens } = placement();
  const focusId = objectives()[0]?.s?.id;
  const grid = burnerGrid(B);
  const svg = s("svg", { viewBox: `${RX - 20} ${TOP - 90} ${RW + 40} ${BOTTOM - TOP + 110}`, preserveAspectRatio: "xMidYMid meet" });
  svg.append(s("defs", {},
    s("linearGradient", { id: "shade", x1: 0, x2: 1 },
      s("stop", { offset: 0, "stop-color": "#000", "stop-opacity": 0.1 }), s("stop", { offset: 0.2, "stop-color": "#fff", "stop-opacity": 0.22 }),
      s("stop", { offset: 0.4, "stop-color": "#fff", "stop-opacity": 0 }), s("stop", { offset: 1, "stop-color": "#000", "stop-opacity": 0.28 })),
    s("radialGradient", { id: "glow", cx: 0.5, cy: 0.3, r: 0.9 },
      s("stop", { offset: 0, "stop-color": "#ffa94a", "stop-opacity": 0.9 }), s("stop", { offset: 1, "stop-color": "#7a2408", "stop-opacity": 0.35 }))));
  svg.append(s("rect", { class: "front-lo", x: RX, y: FRONT - 4, width: RW, height: BOTTOM - FRONT + 4, rx: 16 }),
    s("rect", { class: "front", x: RX + 4, y: FRONT - 4, width: RW - 8, height: BOTTOM - FRONT - 6, rx: 14 }),
    s("rect", { class: "cooktop", x: RX, y: TOP, width: RW, height: DEPTH + 6, rx: 14 }),
    s("rect", { class: "lip", x: RX - 4, y: TOP + DEPTH, width: RW + 8, height: LIP, rx: 7 }));
  for (const g of grid) svg.append(s("ellipse", { class: "bowl", cx: g.cx, cy: g.cy, rx: g.r, ry: g.r * K }), s("ellipse", { class: "cap", cx: g.cx, cy: g.cy, rx: g.r * 0.28, ry: g.r * 0.28 * K }));
  for (const g of [...grid].sort((a, b) => a.row - b.row)) {
    const spot = burners[g.b];
    svg.append(spot.pan ? pot(g, spot.pan, spot.pan.step.id === focusId) : burner(g, spot.ghost));
  }
  if (O) {
    const gap = 16, y = FRONT + 22, hgt = BOTTOM - y - 24, w = (RW - 48 - gap * (O - 1)) / O;
    ovens.forEach((o, i) => svg.append(oven(RX + 24 + i * (w + gap), y, w, hgt, o, focusId)));
  }
  const keys = new Set();
  for (const el of svg.querySelectorAll("[data-key]")) {
    keys.add(el.dataset.key);
    if (!lastKeys.has(el.dataset.key) && !reduced()) el.classList.add("drop");
  }
  lastKeys = keys;
  if ($("scene").classList.contains("ignite")) svg.classList.add("ignite");
  $("scene").replaceChildren(svg);
}

// ---------- the card ----------
function meta(st, o) {
  const name = o?.cook != null && state.cooks.length > 1 ? state.cooks[o.cook] : o?.anyone ? "Anyone" : null;
  return h("div", { class: "meta" },
    o?.kind === "rang" && h("span", { class: "alarm" }, "Time's up"),
    name && h("span", { class: "who", style: `--cook: ${cookColor(o.cook)}` }, name),
    st && h("span", { class: "dish", style: `--dish: ${dishColor(st.dish)}` }, st.dish));
}
function button(a, o) {
  if (!a.primary && o.kind === "step") return h("button", { class: "quiet", onclick: () => a.run() }, a.label);
  return h("button", { class: `go${o.kind === "rang" ? " alarm" : ""}`, onclick: (e) => { pressed(e.currentTarget); a.run(); } }, a.label);
}
function nowCard(o, enter) {
  const cls = `now${enter ? " enter" : ""}${o.kind === "rang" ? " rung" : ""}`;
  const a = objectiveAction(o);
  if (o.kind === "eat") return h("section", { class: cls }, h("h1", {}, "Dinner's up."), h("p", { class: "sub" }, "Everything's done."), h("div", { class: "act" }, button(a, o)));
  const st = o.s;
  const items = st ? stepUses(st) : [];
  return h("section", { class: cls },
    o.viewing && h("button", { class: "back", onclick: backToNow }, "← Back to now"),
    meta(st, o),
    h("h1", {}, st ? st.title : words(o.label)),
    st && !sameWords(st.title, st.text) && instructionLines(st.text),
    items.length > 0 && h("p", { class: "uses" }, items.flatMap((u, i) => [i > 0 ? " · " : null, h("span", { class: u.out ? "out" : false }, [u.amount, u.name].filter(Boolean).join(" "))])),
    o.waiting && h("div", { class: "when", "data-until": stateAt + st.start * 60000, "data-in": "" }, `in ${hours(st.start)}`),
    a && h("div", { class: "act" }, button(a, o), o.kind === "rang" && h("button", { class: "quiet", onclick: () => moreTime(o) }, "+1 min")));
}
// Everyone else's step, and what's on the counter, a line each.
function alsoList(rest) {
  const rows = rest.filter((o) => o.s).map((o) => {
    const a = objectiveAction(o), name = o.cook != null && state.cooks.length > 1 ? state.cooks[o.cook] : null;
    return h("div", { class: "row" }, h("span", {}, name && h("span", { class: "who", style: `--cook: ${cookColor(o.cook)}` }, `${name}  `), o.s.title),
      a && h("button", { onclick: () => a.run() }, a.label));
  });
  const shown = new Set(rest.map((o) => o.s?.id));
  for (const it of placement().counter) {
    if (it.step && (shown.has(it.step.id) || objectives()[0]?.s?.id === it.step.id)) continue;
    const tm = it.timing;
    rows.push(h("div", { class: `row${it.rung ? " rung" : ""}` }, h("span", {}, it.step ? it.step.title : it.label),
      tm && (tm.paused ? h("span", { class: "t" }, clock(tm.left)) : h("span", { class: "t", "data-until": tm.until, "data-clock": "" }, clock((tm.until - Date.now()) / 1000)))));
  }
  return rows.length ? h("div", { class: "also" }, rows) : null;
}
function helloCard() {
  if (busyWith) return h("section", { class: "now" }, h("p", { class: "hello working", "data-busy": "" }, busyText()));
  return h("section", { class: "now" },
    h("p", { class: "hello" }, hello()),
    h("p", { class: "sub" }, ws ? "Basil's listening." : "Press Space or tap Basil to talk."));
}
let lastFirst = null;
function drawQuest() {
  const [first, ...rest] = objectives();
  $("quest").replaceChildren(...[first ? nowCard(first, first.key !== lastFirst && !reduced()) : helloCard(), alsoList(rest)].filter(Boolean));
  lastFirst = first?.key;
}
function drawNav() {
  $("nav").replaceChildren(...navItems().map(({ view: v, label, flag }) =>
    h("button", { class: flag ? "flag" : false, "aria-expanded": String(sheetView === v), onclick: () => { sound.tap(); openSheet(sheetView === v ? "nothing" : v); } }, label)));
}
function pressed(btn) { btn.classList.add("pressed"); setTimeout(() => btn.classList.remove("pressed"), 120); }

View.render = () => { drawScene(); drawQuest(); drawNav(); };
View.tick = (now) => {
  for (const el of document.querySelectorAll("[data-ring]")) {
    const total = Number(el.dataset.total) || 1;
    const left = el.dataset.until ? (Number(el.dataset.until) - now) / 1000 : Number(el.dataset.left);
    el.setAttribute("stroke-dashoffset", (100 * (1 - Math.max(0, Math.min(1, left / total)))).toFixed(2));
  }
};
let mouthRaf = null;
View.pilot = (mode) => {
  const p = $("pilot"), mouth = $("mouth");
  p.dataset.mode = mode;
  cancelAnimationFrame(mouthRaf);
  if (mode === "talking" && !reduced()) {
    const loop = () => { mouth.style.transform = `scaleY(${(0.4 + Math.min(1, voiceLevel() * 3.2) * 1.4).toFixed(2)})`; mouthRaf = requestAnimationFrame(loop); };
    loop();
  } else mouth.style.transform = mode === "asleep" ? "scaleY(.2)" : "scaleY(.5)";
  const st = $("status"), text = busyWith ? busyText() : mode === "thinking" ? "Thinking…" : "";
  st.hidden = !text; st.textContent = text;
  if (busyWith) st.setAttribute("data-busy", ""); else st.removeAttribute("data-busy");
  if (state) drawQuest();
};
View.said = (who, text, live) => {
  const el = $(who === "you" ? "you" : "basil");
  el.hidden = !text && !(live && who === "basil");
  el.textContent = text || (live ? "…" : "");
  el.classList.toggle(who === "you" ? "live" : "pondering", !!live && (who === "you" || !text));
};
View.stream = (piece) => {
  const el = $("basil");
  el.hidden = false; el.classList.remove("pondering");
  if (el.textContent === "…") el.textContent = "";
  el.append(h("i", {}, piece));
};
// Basil arrives: every burner catches in turn.
View.ignite = () => {
  $("scene").classList.add("ignite"); $("pilot").classList.add("hop");
  if (state) drawScene();
  setTimeout(() => { $("scene").classList.remove("ignite"); $("pilot").classList.remove("hop"); if (state) drawScene(); }, 2000);
};
View.pressed = () => { const b = document.querySelector("#quest .go"); if (b) pressed(b); };

bindTalk($("pilot"));
document.addEventListener("keydown", (e) => {
  if (e.code !== "Space" || e.repeat || pushToTalk || sheetView || e.target.matches?.("input, textarea, button, a")) return;
  e.preventDefault(); talkPress();
});
startBasil();
</script>
